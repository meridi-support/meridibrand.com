<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeridiPlay — おみくじ（子午神社） | Omikuji Fortune</title>
<meta name="description" content="夜の千本鳥居で引く無料のおみくじ。二礼二拍手一礼、和歌、季節の運勢。Free Japanese omikuji fortune.">
<style>
:root{
  --shu:#c8261e; --shu-d:#8e1612; --gold:#d8b45a; --gold-l:#f3dc97; --washi:#f6efdf; --sumi:#1d1a17;
  --ink:#2b2420; --night:#05060f; --E:cubic-bezier(.22,1,.36,1);
  --mincho:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP','MS PMincho',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--night);color:#efe4cc;font-family:var(--mincho);overflow:hidden}
#sky{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,transparent 40%,#000a 100%)}

/* ===== HEADER ===== */
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:14px 22px;background:linear-gradient(#000c,transparent)}
.brand{margin-right:auto;display:flex;align-items:baseline;gap:12px;letter-spacing:4px}
.brand b{font-size:20px;color:var(--gold-l);text-shadow:0 0 14px #d8b45a55;font-weight:600}
.brand span{font-size:11px;opacity:.6;letter-spacing:3px}
.tg{background:#0008;color:#e9dcc0;border:1px solid #d8b45a44;border-radius:18px;padding:7px 14px;font:13px var(--mincho);cursor:pointer;transition:all .4s var(--E);letter-spacing:1px}
.tg:hover{border-color:var(--gold);color:var(--gold-l);box-shadow:0 0 12px #d8b45a33}
.tg.on{border-color:var(--gold);color:var(--gold-l);background:#d8b45a1a}
.tg .cnt{display:inline-block;min-width:1.6em;margin-left:4px;color:var(--gold-l)}

/* ===== NOBORI ===== */
.nobori{position:fixed;top:78px;z-index:3;width:46px;height:300px;background:linear-gradient(90deg,#efe6d2,#fbf6ea 45%,#e7dcc4);border-top:6px solid var(--shu);box-shadow:4px 6px 20px #0008;transform-origin:50% 0;animation:sway 7s ease-in-out infinite;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:flex-start;padding-top:18px;font-size:22px;letter-spacing:10px;color:var(--shu-d);font-weight:700}
.nobori::before{content:'';position:absolute;top:-14px;left:-10px;right:-10px;height:6px;background:#3a2414;border-radius:3px}
.nobori::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,var(--shu) 0 9px,transparent 9px 12px)}
.nb-l{left:7vw}.nb-r{right:7vw;animation-delay:-3.5s}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}

/* ===== STAGE ===== */
#stage{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5vh;pointer-events:none}
#stage > *{pointer-events:auto}
.titleV{position:fixed;top:13vh;left:50%;transform:translateX(-50%);z-index:3;text-align:center;pointer-events:none;transition:opacity 1s,transform 1.2s var(--E)}
.titleV h1{font-size:54px;letter-spacing:22px;margin-right:-22px;color:#f7ecd2;font-weight:600;text-shadow:0 0 28px #d8b45a55,0 2px 0 #0008}
.titleV p{font-size:13px;letter-spacing:6px;color:#d8c79e;opacity:.75;margin-top:10px}
.titleV .rule{width:180px;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.altar{position:relative;width:260px;height:330px;display:flex;justify-content:center;align-items:flex-end;cursor:pointer}
.altar::after{content:'';position:absolute;bottom:-6px;left:50%;width:300px;height:40px;transform:translateX(-50%);background:radial-gradient(ellipse,#0009,transparent 70%);z-index:-1}
.sanbo{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:200px;height:56px}
.sanbo .top{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(#e8d6ae,#c9ad78);border:1px solid #8f7448;border-radius:2px;box-shadow:0 3px 0 #a88a58}
.sanbo .base{position:absolute;top:17px;left:24px;right:24px;bottom:0;background:linear-gradient(90deg,#b99a64,#e1cb98 50%,#b99a64);border:1px solid #8f7448;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%)}
.sanbo .base::after{content:'';position:absolute;left:50%;top:10px;width:30px;height:22px;transform:translateX(-50%);border-radius:50% 50% 0 0;background:#3b2a18aa}
#tubeWrap{position:absolute;bottom:52px;left:50%;width:120px;height:240px;margin-left:-60px;transform-origin:50% 55%;z-index:2;filter:drop-shadow(0 14px 18px #000b)}
#tubeWrap svg{position:absolute;inset:0;z-index:2;overflow:visible}
.stick{position:absolute;left:50%;top:20px;width:9px;margin-left:-4.5px;height:150px;z-index:1;border-radius:2px;background:linear-gradient(90deg,#c9a46e,#f2ddb0 45%,#b98f58);box-shadow:inset 0 0 0 1px #8a6a3c66}
.stick::before{content:'';position:absolute;top:0;left:0;right:0;height:16px;background:var(--shu);border-radius:2px 2px 0 0}
.altar:hover #tubeWrap{filter:drop-shadow(0 14px 18px #000b) drop-shadow(0 0 16px #d8b45a44)}
.instr{margin-top:20px;font-size:15px;letter-spacing:3px;color:#efe1bf;text-shadow:0 1px 6px #000;min-height:24px;text-align:center;transition:opacity .6s}
.instr small{display:block;font-size:11px;opacity:.55;letter-spacing:2px;margin-top:6px}
.wish{margin-top:12px;width:300px;background:#0009;border:1px solid #d8b45a44;color:#f3e8cf;border-radius:22px;padding:9px 18px;font:14px var(--mincho);text-align:center;letter-spacing:2px;outline:none;transition:border-color .4s,box-shadow .4s,opacity .6s}
.wish:focus{border-color:var(--gold);box-shadow:0 0 14px #d8b45a33}
.wish::placeholder{color:#e9dcc099}
.todayLine{margin-top:10px;font-size:12px;letter-spacing:2px;color:var(--gold-l);opacity:.8;min-height:18px}
.busy .instr small,.busy .wish,.busy .todayLine{opacity:0;pointer-events:none}
.busy .titleV{opacity:.25}

/* ===== MUSUBI (結び処) ===== */
.musubi{position:fixed;left:3.5vw;bottom:5vh;z-index:3;width:250px;height:170px}
.musubi svg{position:absolute;inset:0}
.musubi .lbl{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:11px;letter-spacing:4px;color:#e8d9b5;opacity:.7;white-space:nowrap}
.knot{position:absolute;width:9px;height:26px;margin:-4px 0 0 -4.5px;background:linear-gradient(90deg,#e9e1cf,#fffaf0 50%,#ddd2bb);box-shadow:1px 2px 3px #0007;border-radius:1px;transform-origin:50% 4px;animation:knotSway 5s ease-in-out infinite}
.knot::before{content:'';position:absolute;top:3px;left:-3px;right:-3px;height:5px;background:#f8f2e4;border-radius:2px;box-shadow:0 1px 1px #0005}
.knot.fresh{animation:knotIn .9s var(--E),knotSway 5s ease-in-out .9s infinite}
@keyframes knotSway{0%,100%{transform:rotate(var(--r,0deg))}50%{transform:rotate(calc(var(--r,0deg) + 4deg))}}
@keyframes knotIn{from{transform:scale(1.8) rotate(-20deg);opacity:0}to{transform:rotate(var(--r,0deg));opacity:1}}

/* ===== RITE ===== */
.rite{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 50%,#000000a0,#000000e0);opacity:0;transition:opacity 1s ease}
.rite.show{opacity:1}
.rite .w{font-size:86px;letter-spacing:20px;margin-right:-20px;color:#f6ead0;text-shadow:0 0 40px #d8b45a66;opacity:0;transform:translateY(10px) scale(.98);transition:opacity .7s ease,transform 1s var(--E)}
.rite .s{font-size:15px;letter-spacing:5px;color:#d8c79e;margin-top:20px;opacity:0;transition:opacity .7s ease .15s}
.rite.on .w{opacity:1;transform:none}.rite.on .s{opacity:.85}
.ripple{position:fixed;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:1px solid #f3dc97;z-index:31;pointer-events:none;animation:rip 1.6s var(--E) forwards}
@keyframes rip{from{transform:scale(.4);opacity:.8}to{transform:scale(9);opacity:0}}
.skip{position:fixed;bottom:4vh;left:50%;transform:translateX(-50%);z-index:32;font-size:12px;opacity:0;transition:opacity .6s;pointer-events:none}
.rite.show ~ .skip{opacity:.7;pointer-events:auto}

/* ===== STICK CARD ===== */
.stickCard{position:fixed;left:50%;top:44%;z-index:35;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;transition:opacity .8s ease,transform 1.1s var(--E);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.stickCard.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.stickCard .bar{width:46px;height:340px;border-radius:4px;background:linear-gradient(90deg,#c39b62,#f6e3b8 45%,#b68a52);box-shadow:0 0 50px #d8b45a55,0 20px 40px #000c;position:relative;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font-size:26px;letter-spacing:8px;color:var(--shu-d);font-weight:700;padding-top:20px}
.stickCard .bar::before{content:'';position:absolute;top:0;left:0;right:0;height:40px;background:var(--shu);border-radius:4px 4px 0 0}
.stickCard .cap{margin-top:22px;font-size:14px;letter-spacing:4px;color:#f3e6c6;text-shadow:0 1px 6px #000;text-align:center}

/* ===== SLIP ===== */
.layer{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 45%,#140c08d0,#000000f0);opacity:0;pointer-events:none;transition:opacity .9s ease}
.layer.show{opacity:1;pointer-events:auto}
.slipbox{position:fixed;left:50%;top:45%;z-index:41;transform:translate(-50%,-50%);pointer-events:none}
.slipbox.show{pointer-events:auto}
.slip{display:inline-block;position:relative;padding:26px 28px;border-radius:2px;color:var(--ink);background-color:var(--washi);box-shadow:0 30px 80px #000d,0 0 0 1px #00000022;clip-path:inset(0 50% 0 50%);opacity:0}
.slip.open{animation:unfold 1.6s var(--E) forwards}
.slip.close{animation:fold .9s cubic-bezier(.6,0,.4,1) forwards}
@keyframes unfold{0%{clip-path:inset(0 48% 0 48%);opacity:0;transform:scaleY(.96)}12%{opacity:1}100%{clip-path:inset(0 0 0 0);opacity:1;transform:none}}
@keyframes fold{from{clip-path:inset(0 0 0 0);opacity:1}to{clip-path:inset(0 48% 0 48%);opacity:.9}}
.slip .crease{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(transparent,#0000001c 20%,#0000001c 80%,transparent);pointer-events:none}
.frame{position:relative;border:2px solid var(--shu);outline:1px solid var(--shu);outline-offset:5px;padding:20px 18px}
.slip.v .frame{writing-mode:vertical-rl;height:540px}
.slip.v .frame > *{margin-block-end:16px}
.slip.h .frame{width:min(720px,88vw);writing-mode:horizontal-tb}
.rv{opacity:0;animation:rv 1s var(--E) forwards}
@keyframes rv{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.sec{position:relative}
.slip.v .sec+.sec{padding-inline-end:0}
.slip.v .sep{border-left:1px solid #c8261e55;margin-block-end:16px}
.head{font-size:15px;letter-spacing:6px;color:var(--shu)}
.head .shrine{display:block;font-size:12px;letter-spacing:4px;color:#7a6a58;margin-block-start:0}
.rank{font-weight:700;color:var(--shu-d);letter-spacing:6px;line-height:1.1;text-shadow:0 1px 0 #fff8}
.rank.t-hi{color:#a8120c;text-shadow:0 0 18px #d8b45a88,0 1px 0 #fff8}
.rank.t-lo{color:#2c3550}
.rank small{display:block;font-size:13px;letter-spacing:3px;color:#7a6a58;font-weight:normal}
.dots{font-size:12px;letter-spacing:4px;color:#b08a3a}
.lbl{display:inline-block;background:var(--shu);color:#fff7e8;font-size:12px;letter-spacing:3px;padding:6px 3px;border-radius:2px;margin-block-end:8px;font-weight:600}
.slip.h .lbl{padding:2px 8px;margin:0 8px 6px 0}
.waka p{font-size:18px;letter-spacing:4px;line-height:2.1}
.waka p.lo{padding-inline-start:3.2em}
.waka .en{font-size:13px;font-style:italic;color:#5a4c40;letter-spacing:0;line-height:1.6;margin-top:6px}
.teach p{font-size:14.5px;line-height:2;letter-spacing:2px;max-block-size:none}
.slip.v .teach{max-inline-size:none}
.cats .cat{font-size:14px;letter-spacing:2px;line-height:1.9}
.slip.v .cats .cat{margin-block-end:4px}
.slip.v .cats .cat b{display:inline-block;color:var(--shu);border:1px solid var(--shu);padding:4px 1px;margin-block-end:6px;font-size:12.5px;letter-spacing:2px}
.slip.h .cats{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;margin:14px 0}
.slip.h .cats .cat b{display:inline-block;min-width:118px;color:var(--shu);font-size:12px;letter-spacing:1px;border-bottom:1px solid #c8261e55;margin-right:6px}
.lucky span{font-size:14px;letter-spacing:3px;display:block}
.slip.h .lucky span{display:inline-block;margin-right:22px}
.lucky em{font-style:normal;color:var(--shu);margin-inline-end:6px}
.prayer{font-size:13px;letter-spacing:2px;color:#5a4c40}
.prayer q{quotes:'「' '」';color:var(--ink)}
.seal{position:absolute;width:74px;height:74px;opacity:0;transform:scale(1.6) rotate(-8deg);pointer-events:none}
.slip.v .seal{left:22px;bottom:22px}
.slip.h .seal{right:26px;bottom:22px}
.seal.on{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{to{opacity:.88;transform:scale(1) rotate(-8deg)}}
.slip.h .rank{font-size:40px;text-align:center;margin:10px 0 2px}
.slip.h .head{text-align:center}
.slip.h .dots{text-align:center;margin-bottom:10px}
.slip.h .waka{text-align:center;border-top:1px solid #c8261e44;border-bottom:1px solid #c8261e44;padding:12px 0;margin:12px 0}
.slip.h .waka p{font-size:15px;line-height:1.7}
.slip.h .waka p.lo{padding:0}
.slip.h .teach p{font-size:14px;line-height:1.8;letter-spacing:.3px}
.slipActs{position:fixed;left:50%;bottom:4.5vh;z-index:42;transform:translate(-50%,20px);display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s ease,transform .9s var(--E)}
.slipActs.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.act{background:#0b0806e6;color:#f1e4c6;border:1px solid #d8b45a66;border-radius:24px;padding:11px 22px;font:14px var(--mincho);letter-spacing:3px;cursor:pointer;transition:all .45s var(--E)}
.act:hover{border-color:var(--gold);color:var(--gold-l);transform:translateY(-2px);box-shadow:0 8px 20px #000a,0 0 14px #d8b45a33}
.act.rec{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px #d8b45a44}
.recTxt{position:fixed;left:50%;bottom:calc(4.5vh + 58px);transform:translateX(-50%);z-index:42;font-size:12px;letter-spacing:3px;color:#e5d4ab;opacity:0;transition:opacity .8s;white-space:nowrap;text-shadow:0 1px 4px #000}
.recTxt.show{opacity:.85}
.strip{position:fixed;z-index:45;width:22px;height:120px;margin:-60px 0 0 -11px;background:linear-gradient(90deg,#e9e1cf,#fffaf0 50%,#ddd2bb);box-shadow:0 6px 18px #000a;border-radius:1px;pointer-events:none}
.toast{position:fixed;left:50%;top:16vh;z-index:50;transform:translate(-50%,-8px);background:#0b0806ee;border:1px solid #d8b45a66;color:#f2e6c8;padding:12px 26px;border-radius:24px;font-size:14px;letter-spacing:3px;opacity:0;transition:opacity .7s,transform .8s var(--E);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== COLLECTION ===== */
.modal{position:fixed;inset:0;z-index:60;background:#000c;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s}
.modal.show{opacity:1;pointer-events:auto}
.mbox{width:min(860px,94vw);max-height:88vh;overflow:auto;background:linear-gradient(#17100c,#0c0806);border:1px solid #d8b45a55;border-radius:14px;padding:26px 28px;box-shadow:0 30px 80px #000;transform:translateY(14px);transition:transform .8s var(--E)}
.modal.show .mbox{transform:none}
.mbox h2{font-size:20px;letter-spacing:8px;color:var(--gold-l);font-weight:600;text-align:center}
.mstat{text-align:center;font-size:13px;letter-spacing:2px;color:#d9c9a3;margin:10px 0 4px}
.pbar{height:6px;background:#2a1d14;border-radius:3px;overflow:hidden;margin:12px auto 4px;max-width:520px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--shu),var(--gold));transition:width 1.4s var(--E)}
.ptxt{text-align:center;font-size:12px;color:#cdbb92;letter-spacing:3px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin:22px 0}
@media(max-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.mini{height:150px;border-radius:2px;background:#1d140e;border:1px dashed #d8b45a33;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:15px;letter-spacing:3px;color:#ffffff22;transition:all .5s var(--E);position:relative;overflow:hidden}
.mini.got{background:linear-gradient(90deg,#efe6d2,#fbf6ea 50%,#e9dec7);color:var(--shu-d);border:1px solid var(--shu);cursor:pointer;font-weight:700}
.mini.got:hover{transform:translateY(-4px);box-shadow:0 10px 20px #000a,0 0 12px #d8b45a44}
.mini.got.hi{box-shadow:0 0 14px #d8b45a55}
.mini .n{position:absolute;top:4px;left:0;right:0;writing-mode:horizontal-tb;text-align:center;font-size:9px;letter-spacing:1px;color:#00000066;font-weight:normal}
.mini.lock::after{content:'？';color:#ffffff22}
.hist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.hist span{font-size:12px;padding:4px 10px;border:1px solid #d8b45a33;border-radius:12px;color:#e2d2ad;letter-spacing:1px}
.hist span.hi{border-color:var(--gold);color:var(--gold-l)}
.hist span em{font-style:normal;opacity:.5;margin-left:6px;font-size:10px}
.mrow{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.sub2{font-size:13px;letter-spacing:4px;color:#cdbb92;text-align:center;margin-top:18px}
@media(max-width:820px){.nobori{display:none}.musubi{transform:scale(.7);transform-origin:0 100%}.titleV h1{font-size:38px}}
@media(prefers-reduced-motion:reduce){.nobori,.knot{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="veil"></div>

<header>
  <div class="brand"><b id="bName">子午神社</b><span>MERIDIPLAY · OMIKUJI</span></div>
  <button class="tg" id="tLang">🌐 EN</button>
  <button class="tg" id="tSound">🔔</button>
  <button class="tg" id="tRite"></button>
  <button class="tg" id="tSeason"></button>
  <button class="tg" id="tColl"><span id="tCollL"></span><span class="cnt" id="tCollN">0</span></button>
</header>

<div class="nobori nb-l" id="nbL">奉納 御神籤</div>
<div class="nobori nb-r" id="nbR">子午神社</div>

<div class="titleV" id="titleV"><h1 id="hTitle">御神籤</h1><div class="rule"></div><p id="hSub"></p></div>

<div class="musubi" id="musubi">
  <svg viewBox="0 0 250 170">
    <defs><linearGradient id="post" x1="0" x2="1"><stop offset="0" stop-color="#2a1a0e"/><stop offset=".5" stop-color="#5a3b22"/><stop offset="1" stop-color="#2a1a0e"/></linearGradient></defs>
    <rect x="8" y="14" width="12" height="146" fill="url(#post)"/><rect x="230" y="14" width="12" height="146" fill="url(#post)"/>
    <rect x="2" y="8" width="246" height="9" rx="2" fill="#1c120a"/>
    <g fill="none" stroke="#c9b27a" stroke-width="2.2" stroke-linecap="round">
      <path d="M20 44 Q125 56 230 44"/><path d="M20 84 Q125 96 230 84"/><path d="M20 124 Q125 136 230 124"/>
    </g>
    <g fill="none" stroke="#8a7446" stroke-width=".8" stroke-dasharray="2 3">
      <path d="M20 44 Q125 56 230 44"/><path d="M20 84 Q125 96 230 84"/><path d="M20 124 Q125 136 230 124"/>
    </g>
  </svg>
  <div id="knots"></div>
  <div class="lbl" id="musLbl">結 び 処</div>
</div>

<div id="stage">
  <div class="altar" id="altar" title="">
    <div class="sanbo"><div class="top"></div><div class="base"></div></div>
    <div id="tubeWrap">
      <div class="stick" id="stick"></div>
      <svg viewBox="0 0 120 240" aria-hidden="true">

      cx.fillStyle = gr; cx.fillRect(l.x - l.r * 9, l.y - l.r * 9, l.r * 18, l.r * 18);
      cx.fillStyle = `rgba(245,255,200,${.9 * glow})`; cx.beginPath(); cx.arc(l.x, l.y, l.r * .7, 0, 7); cx.fill();
      cx.globalCompositeOperation = 'source-over';
      return;
    }
    l.y += l.vy * dt; l.ph += .02 * l.sp * dt; l.rot += l.vr * dt;
    const x = l.x + Math.sin(l.ph) * (l.k === 'snow' ? 12 : 30) * (l.sw / 6);
    cx.globalAlpha = l.a; cx.fillStyle = l.c;
    if (l.k === 'snow'){ cx.beginPath(); cx.arc(x, l.y, l.r, 0, 7); cx.fill(); }
    else {
      cx.save(); cx.translate(x, l.y); cx.rotate(l.rot + Math.sin(l.ph) * .6); cx.scale(Math.cos(l.ph * 1.3), 1);
      if (l.k === 'petal') petalPath(cx, l.r); else leafPath(cx, l.r);
      cx.fill(); cx.restore();
    }

  });
  cx.globalAlpha = 1;
  // 凶の時の静かな靄
  moodLow += ((window.__lowT || 0) - moodLow) * .02;
  if (moodLow > .01){ cx.fillStyle = `rgba(20,28,60,${.28 * moodLow})`; cx.fillRect(0, 0, W, Hh); }
  requestAnimationFrame(frame);
}

  if ($('slipActs').classList.contains('show')){
    if (k === '1' && viewing && viewing.fresh) closeSlip('tie');
    else if (k === '2' && viewing && viewing.fresh) closeSlip('keep');
    else if (k === 'Escape' || k === '3') closeSlip('close');
  }
});
window.addEventListener('resize', () => { buildScene(); fitSlip(); });

/* =========================================================
   INIT
   ========================================================= */
SEA = seasonNow();
buildScene(); requestAnimationFrame(frame);
renderKnots(); apply();
})();
