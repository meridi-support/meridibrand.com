<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeridiPlay — SHUT THE BOX</title>
<style>
:root{--E:cubic-bezier(.22,1,.36,1);--g:#39ff14;--pg:#030805;--ink:#d8ffd0;--line:#39ff1433;--panel:#000b;--acc:#39ff14;--felt1:#0b3a18;--felt2:#031a09}
body.light{--pg:#efe9de;--ink:#2a2118;--line:#7a5a3a44;--panel:#fffaf0dd;--acc:#2a7a3a;--felt1:#2f7a46;--felt2:#174d2a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--pg);color:var(--ink);font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;overflow-x:hidden;transition:background .6s var(--E),color .6s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% -10%,#ffb34714,transparent 60%)}
header{position:relative;z-index:3;display:flex;align-items:center;gap:7px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{margin-right:auto;display:flex;align-items:baseline;gap:10px}
.brand b{font:bold 18px 'Courier New',monospace;letter-spacing:5px;color:var(--g);text-shadow:0 0 10px #39ff1488}
body.light .brand b{color:#1f7a3a;text-shadow:none}
.brand span{font:bold 13px Georgia,serif;letter-spacing:4px}
.tg{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font:12px 'Courier New',monospace;cursor:pointer;transition:all .3s var(--E);white-space:nowrap}
.tg:hover{border-color:var(--acc)}
.wrap{position:relative;z-index:2;display:flex;gap:18px;justify-content:center;padding:16px 10px 34px;flex-wrap:wrap;align-items:flex-start}
.main{width:min(780px,97vw)}

/* ===== the box ===== */
.box{position:relative;border-radius:18px;padding:16px 16px 18px;background:
  linear-gradient(90deg,#00000030,transparent 6%,transparent 94%,#00000030),
  repeating-linear-gradient(92deg,#6b3f1c 0 7px,#7a4a22 7px 13px,#5f3716 13px 17px,#734520 17px 26px);
  box-shadow:0 30px 60px #000b,inset 0 2px 0 #c8915a66,inset 0 -4px 0 #2a1406,0 0 0 3px #2a1406}
.box::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,#ffffff14,transparent 30%,#00000026)}
.plate{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 6px 10px;font:bold 12px Georgia,serif;color:#f6dfae;letter-spacing:2px;text-shadow:0 1px 0 #000}
.plate .nm{font-size:17px;letter-spacing:5px}
.plate .who{font:bold 13px 'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:1px;padding:3px 12px;border-radius:12px;background:#0006;border:1px solid #f6dfae55;transition:all .4s var(--E)}
.rail{position:relative;z-index:2;border-radius:10px;padding:12px 10px 8px;background:linear-gradient(180deg,#3a200c,#24130a);box-shadow:inset 0 6px 12px #000a,inset 0 -2px 0 #ffffff10;perspective:700px}
.tiles{display:grid;gap:6px}
.tile{position:relative;aspect-ratio:.62;border-radius:5px 5px 3px 3px;cursor:pointer;transform-origin:50% 100%;
  background:linear-gradient(180deg,#f4ddae,#e2c48a 55%,#c8a468);box-shadow:0 3px 0 #6a4418,0 5px 8px #0008,inset 0 1px 0 #fff8;
  display:flex;align-items:center;justify-content:center;font:bold clamp(18px,4.4vw,34px) Georgia,'Times New Roman',serif;color:#3a1e08;
  transition:transform .55s var(--E),filter .35s,box-shadow .3s;user-select:none;-webkit-user-select:none}
.tile::before{content:'';position:absolute;left:12%;right:12%;top:8%;height:10%;border-radius:3px;background:#00000014}
.tile .n{position:relative;text-shadow:0 1px 0 #fff6}
.tile.sel{transform:translateY(-8px);box-shadow:0 11px 0 #6a4418,0 13px 14px #000a,0 0 0 2px #39ff14,inset 0 1px 0 #fff8}
body.light .tile.sel{box-shadow:0 11px 0 #6a4418,0 13px 14px #0006,0 0 0 2px #e8392a,inset 0 1px 0 #fff8}
.tile.dim{filter:brightness(.62) saturate(.7);cursor:default}
.tile.shut{transform:rotateX(78deg);filter:brightness(.42);cursor:default;box-shadow:0 1px 0 #3a2008}
.tile.best{outline:2px dashed #39ff14;outline-offset:3px}
body.light .tile.best{outline-color:#e8392a}
.tile.cat .n{font-size:.9em}
.felt{position:relative;z-index:2;margin-top:12px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 3px #24130a,0 2px 0 #ffffff12}
#cv{display:block;width:100%;touch-action:manipulation;cursor:pointer}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;pointer-events:none;text-align:center}
.big{font:900 clamp(30px,8vw,56px) Georgia,serif;color:#fff4c8;text-shadow:0 0 16px #ffd27a88,0 3px 0 #0008;opacity:0;transform:scale(.8);transition:opacity .5s,transform .7s var(--E)}
.big.on{opacity:1;transform:none}
.sm{font:bold 14px 'Hiragino Sans','Yu Gothic',sans-serif;color:#f6e8c8;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .5s}
.sm.on{opacity:.95}
.ctl{position:relative;z-index:2;display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;border:2px solid #2a1406;border-radius:12px;padding:12px 10px;cursor:pointer;font:bold 15px 'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:1px;color:#2a1406;
  background:linear-gradient(180deg,#ffe9b8,#e8c27a 50%,#c8964a);box-shadow:0 4px 0 #5a3410,0 6px 10px #0008;transition:transform .08s,box-shadow .08s,filter .3s}
.btn small{display:block;font-size:10px;font-weight:normal;opacity:.7}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #5a3410,0 3px 6px #0008}
.btn:disabled{filter:grayscale(.85) brightness(.55);cursor:default}
.btn.go{background:linear-gradient(180deg,#c8ffb8,#5ad84a 50%,#2a9a2a);border-color:#0a3a0a;box-shadow:0 4px 0 #0a3a0a,0 6px 10px #0008}
.btn.go:active:not(:disabled){box-shadow:0 1px 0 #0a3a0a}
.sumbar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:bold 14px 'Courier New',monospace;color:#f6dfae;gap:8px;flex-wrap:wrap}
.sumbar b{font-size:20px;color:#fff4c8}
.sumbar .ok{color:#7aff5a}

/* ===== side ===== */
.side{width:330px;max-width:97vw;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h3{font:bold 12px 'Courier New',monospace;letter-spacing:3px;color:var(--acc);margin-bottom:9px}
.lbl{font-size:11px;opacity:.7;margin:7px 0 4px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 4px;font:12px 'Hiragino Sans','Yu Gothic',sans-serif;cursor:pointer;transition:all .3s var(--E)}
.seg button.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg button small{display:block;font-size:9.5px;opacity:.65}
.mini{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--ink);font:bold 13px 'Hiragino Sans','Yu Gothic',sans-serif;cursor:pointer}
.sc table{width:100%;border-collapse:collapse;font:12px 'Courier New',monospace}
.sc td,.sc th{padding:4px 4px;border-bottom:1px solid var(--line);text-align:right}
.sc td:first-child,.sc th:first-child{text-align:left}
.sc tr.cur td{color:var(--acc);font-weight:bold}
.sc tr.lead td:last-child::after{content:' 👑'}
.tr{font:12px 'Hiragino Sans','Yu Gothic',sans-serif;line-height:1.75}
.tr .okc{color:#39ff14;font-weight:bold}.tr .ngc{color:#ff7a5a;font-weight:bold}
body.light .tr .okc{color:#1f7a3a}
.tr table{width:100%;border-collapse:collapse;font:11px 'Courier New',monospace;margin-top:6px}
.tr td{padding:2px 3px;border-bottom:1px solid var(--line)}
.tr td:not(:first-child){text-align:right}
.tr tr.me td{color:var(--acc);font-weight:bold}
.st{font:11.5px 'Courier New',monospace;line-height:1.7}
.hist{display:flex;align-items:flex-end;gap:2px;height:64px;margin-top:6px;border-bottom:1px solid var(--line)}
.hist i{flex:1;background:var(--acc);opacity:.75;border-radius:2px 2px 0 0;min-height:1px;transition:height .6s var(--E)}
.hist i.z{background:#ffd24a;opacity:1}
.hx{display:flex;justify-content:space-between;font:9px 'Courier New',monospace;opacity:.6}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.ach div{border:1px solid var(--line);border-radius:8px;padding:5px 3px;text-align:center;font-size:10px;opacity:.38;transition:opacity .5s}
.ach div.got{opacity:1;border-color:var(--acc)}
.ach div b{display:block;font-size:18px}
.kb{font:10.5px 'Courier New',monospace;opacity:.55;line-height:1.7}

/* ===== guide ===== */
.help{position:fixed;inset:0;z-index:80;background:#000b;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s var(--E);padding:14px}
.help.show{opacity:1;pointer-events:auto}
.hbox{width:min(700px,100%);max-height:88vh;overflow:auto;background:#030a05f2;color:#d8ffd0;border:1px solid var(--acc);border-radius:16px;padding:18px 22px;transform:translateY(14px);transition:transform .6s var(--E)}
body.light .hbox{background:#fffaf0f5;color:#2a2118}
.help.show .hbox{transform:none}
.htabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.htabs button{background:transparent;color:inherit;border:1px solid var(--line);border-radius:14px;padding:6px 12px;font:12px 'Hiragino Sans','Yu Gothic',sans-serif;cursor:pointer}
.htabs button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,transparent)}
.hc{font-size:13.5px;line-height:1.85}
.hc h4{color:var(--acc);margin:10px 0 4px;font-size:14px}
.hc ol,.hc ul{padding-left:22px}
.hc table{border-collapse:collapse;margin:6px 0;font-size:12.5px}
.hc td,.hc th{border:1px solid var(--line);padding:3px 8px}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);background:#020604ee;border:1px solid var(--acc);color:#d8ffd0;padding:10px 22px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .5s,transform .7s var(--E);z-index:90;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){.tiles{gap:4px}.btn{min-width:90px;font-size:13px}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>MERIDIPLAY</b><span>SHUT THE BOX</span></div>
  <button class="tg" id="tHelp">📖</button>
  <button class="tg" id="tLang">🌐 EN</button>
  <button class="tg" id="tSound">🔊</button>
  <button class="tg" id="tTheme"></button>
</header>
<div class="wrap">
  <div class="main">
    <div class="box">
      <div class="plate"><span class="nm">SHUT · THE · BOX</span><span class="who" id="who"></span></div>
      <div class="rail"><div class="tiles" id="tiles"></div></div>
      <div class="felt"><canvas id="cv"></canvas>
        <div class="ov"><div class="big" id="big"></div><div class="sm" id="sm"></div></div>
      </div>
      <div class="sumbar"><span><span id="lRoll"></span> <b id="roll">—</b></span><span><span id="lSel"></span> <b id="sel">0</b></span><span><span id="lLeft"></span> <b id="left">45</b></span></div>
      <div class="ctl">
        <button class="btn" id="bRoll2"></button>
        <button class="btn" id="bRoll1" style="display:none"></button>
        <button class="btn go" id="bShut"></button>
        <button class="btn" id="bNext" style="display:none"></button>
      </div>
    </div>
  </div>
  <div class="side">
    <div class="panel sc"><h3 id="hScore"></h3><div id="score"></div><button class="mini" id="bNew"></button></div>
    <div class="panel">
      <h3 id="hSet"></h3>
      <div class="lbl" id="lMode"></div><div class="seg" id="sMode"></div>
      <div class="lbl" id="lOpp"></div><div class="seg" id="sOpp"></div>
      <div class="lbl" id="lTiles"></div><div class="seg" id="sTiles"></div>
      <div class="lbl" id="lScoring"></div><div class="seg" id="sScoring"></div>
      <div class="lbl" id="lOne"></div><div class="seg" id="sOne"></div>
      <div class="lbl" id="lRounds"></div><div class="seg" id="sRounds"></div>
      <div class="lbl" id="lTrain"></div><div class="seg" id="sTrain"></div>
      <div class="lbl" id="lAuto"></div><div class="seg" id="sAuto"></div>
    </div>
    <div class="panel"><h3 id="hTr"></h3><div class="tr" id="tr"></div></div>
    <div class="panel"><h3 id="hSt"></h3><div class="st" id="st"></div><div class="hist" id="histo"></div><div class="hx" id="hx"></div><div class="ach" id="ach"></div></div>
    <div class="kb" id="kb"></div>
  </div>
</div>
<div class="help" id="help"><div class="hbox"><div class="htabs" id="htabs"></div><div class="hc" id="hc"></div><button class="mini" id="hClose"></button></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
function rnd(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
const die6 = () => 1 + Math.floor(rnd() * 6);
const pick = a => a[Math.floor(rnd() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lsGet = k => { try { return window.localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { window.localStorage.setItem(k, v); } catch(e){} };

/* ================= 保存 ================= */
const LS = 'meridiplay_shutthebox_v1';
let D = { lang:'ja', sound:true, theme:'dark', mode:'solo', opp:[1,0,0], n:9, scoring:'sum', one:1, rounds:1, train:1, auto:1, stats:{}, ach:{}, tr:{ n:0, ok:0, loss:0 }, streak:0, catTiles:false };
try { const s = JSON.parse(lsGet(LS) || 'null'); if (s) D = Object.assign(D, s); } catch(e){}
try { const th = lsGet('meridiplay_theme'); if (th === 'light' || th === 'dark') D.theme = th; } catch(e){}
if (!Array.isArray(D.opp) || D.opp.length !== 3) D.opp = [1,0,0];
if (![9,10,12].includes(D.n)) D.n = 9;
['stats','ach'].forEach(k => { if (!D[k] || typeof D[k] !== 'object') D[k] = {}; });
if (!D.tr) D.tr = { n:0, ok:0, loss:0 };
const save = () => { lsSet(LS, JSON.stringify(D)); lsSet('meridiplay_theme', D.theme); };

/* ================= 言葉 ================= */
const CATS = [
  { ja:'トラ', en:'Tora', ic:'🐈', lv:0, lvJ:'うっかり', lvE:'Careless' },
  { ja:'クロ', en:'Kuro', ic:'🐈⬛', lv:1, lvJ:'ふつう', lvE:'Steady' },
  { ja:'ハイ', en:'Hai', ic:'🐱', lv:2, lvJ:'名人', lvE:'Master' }
];
const UI = {
  ja:{ score:'スコア表', set:'設定', mode:'あそび方', modes:{ solo:'ひとり', cpu:'猫と対戦', duo:'みんなで' }, opp:'相手の猫', players:'人数',
    tiles:'板の数', tilesL:n => `1〜${n}`, scoring:'点数の数え方', scorings:{ sum:['合計','残った数字を足す'], digital:['デジタル','並べて読む（1と2→12）'] },
    one:'サイコロ 1 個のルール', ones:[['なし','いつも 2 個'], ['あり','7 以上が全部倒れたら']], rounds:'ラウンド数', roundsL:n => `${n} 回`,
    train:'戦略トレーナー', trains:['オフ','判定','判定＋ヒント'], auto:'合計がそろったら', autos:['ボタンで倒す','自動で倒す'],
    tr:'トレーナー', st:'記録', roll2:['サイコロを振る','Space'], roll1:['1 個で振る','O'], shut:['倒す','Enter'], next:['次へ','Enter'], newg:'新しく始める',
    lRoll:'出目', lSel:'選んだ合計', lLeft:'残り',
    you:'あなた', p:i => `${i + 1}P`, turn:n => `${n} の番`, rollPls:'サイコロを振ってください', pickPls:n => `合計 ${n} になるように板を選んでください`,
    noMove:'倒せる組み合わせがありません', shutBox:'SHUT THE BOX!', turnEnd:s => `この回の点数 ${s}`, roundEnd:r => `第 ${r} ラウンド終了`, matchEnd:'勝負あり', winner:n => `${n} の勝ち！`, tie:'引き分け',
    shutRate:p => `この設定で、最善の手を打ち続けたときに締め切れる確率は <b>${p}%</b>、点数の期待値は <b>${'$'}</b>です。`,
    trIdle:'サイコロを振ると、倒し方ごとに「最後に残る点数の期待値」を計算して、あなたの選択を判定します（点数は少ないほど良い）。',
    trOk:'最善の倒し方です！', trNg:'もっと良い倒し方がありました', trYour:'あなたの選択', trBest:'最善', evL:'期待値', shutL:'締め切り率', loss:l => `期待値で ${l} 点の損`,
    acc:(n, ok, l) => `判定 ${n} 回 ／ 最善 ${ok} 回（${n ? (ok / n * 100).toFixed(1) : '0.0'}%）／ 損の合計 ${l.toFixed(2)} 点`,
    oneDie:'サイコロを 1 個にするか選べます', dieChoice:(a, b) => `2 個なら期待値 ${a}、1 個なら ${b}`,
    stats:(s) => `遊んだ回数 ${s.games} ／ 締め切り ${s.shut} 回（${s.games ? (s.shut / s.games * 100).toFixed(1) : '0.0'}%）<br>平均点 ${s.games ? (s.sum / s.games).toFixed(2) : '—'} ／ 最高 ${s.best == null ? '—' : s.best}<br>連続締め切り ${D.streak}`,
    stKey:(n, sc, o) => `板 ${n} 枚・${sc === 'sum' ? '合計' : 'デジタル'}・1 個ルール${o ? 'あり' : 'なし'}`,
    kb:'⌨ Space：振る ／ O：1 個で振る ／ 1〜9・0・-・=：板を選ぶ（10・11・12）／ Enter：倒す・次へ ／ Backspace：選び直す ／ ?：遊び方',
    help:'閉じる', total:'合計', cpuThink:n => `${n} が考え中…` },
  en:{ score:'SCOREBOARD', set:'SETTINGS', mode:'MODE', modes:{ solo:'Solo', cpu:'vs Cats', duo:'Pass & play' }, opp:'OPPONENTS', players:'PLAYERS',
    tiles:'TILES', tilesL:n => `1–${n}`, scoring:'SCORING', scorings:{ sum:['Sum','Add the tiles left'], digital:['Digital','Read as digits (1,2→12)'] },
    one:'ONE-DIE RULE', ones:[['Off','Always 2 dice'], ['On','When 7+ are shut']], rounds:'ROUNDS', roundsL:n => `${n}`,
    train:'STRATEGY TRAINER', trains:['Off','Judge','Judge + Hint'], auto:'WHEN THE SUM MATCHES', autos:['Press to shut','Auto shut'],
    tr:'TRAINER', st:'STATS', roll2:['Roll the dice','Space'], roll1:['Roll one die','O'], shut:['Shut','Enter'], next:['Next','Enter'], newg:'New game',
    lRoll:'Roll', lSel:'Selected', lLeft:'Left',
    you:'You', p:i => `P${i + 1}`, turn:n => `${n}'s turn`, rollPls:'Roll the dice', pickPls:n => `Pick tiles that add up to ${n}`,
    noMove:'No tiles add up — turn over', shutBox:'SHUT THE BOX!', turnEnd:s => `Score this turn: ${s}`, roundEnd:r => `Round ${r} complete`, matchEnd:'Match over', winner:n => `${n} wins!`, tie:'Tie',
    shutRate:p => `With these rules and perfect play, you shut the box <b>${p}%</b> of the time; expected score <b>${'$'}</b>.`,
    trIdle:'After each roll, the trainer computes the expected final score of every possible move and grades your choice (lower is better).',
    trOk:'Optimal move!', trNg:'There was a better move', trYour:'Your move', trBest:'Best', evL:'EV', shutL:'Shut %', loss:l => `Costs ${l} points of EV`,
    acc:(n, ok, l) => `Graded ${n} / Optimal ${ok} (${n ? (ok / n * 100).toFixed(1) : '0.0'}%) / Total cost ${l.toFixed(2)}`,
    oneDie:'You may roll one die', dieChoice:(a, b) => `2 dice EV ${a}, 1 die EV ${b}`,
    stats:(s) => `Games ${s.games} / Shut ${s.shut} (${s.games ? (s.shut / s.games * 100).toFixed(1) : '0.0'}%)<br>Avg ${s.games ? (s.sum / s.games).toFixed(2) : '—'} / Best ${s.best == null ? '—' : s.best}<br>Shut streak ${D.streak}`,
    stKey:(n, sc, o) => `${n} tiles · ${sc} · one-die ${o ? 'on' : 'off'}`,
    kb:'⌨ Space: roll / O: one die / 1-9, 0, -, =: tiles (10, 11, 12) / Enter: shut·next / Backspace: clear / ?: help',
    help:'Close', total:'Total', cpuThink:n => `${n} is thinking…` }
};
const T = k => UI[D.lang][k];
const J = () => D.lang === 'ja';
const ACH = [
  ['first','🎉','初めて締め切った','First shut'],
  ['ten','🔟','板 10 枚で締め切った','Shut 10 tiles'],
  ['twelve','👑','板 12 枚で締め切った','Shut 12 tiles'],
  ['streak2','🔥','2 回続けて締め切った','2 shuts in a row'],
  ['beatHai','🐱','名人ハイに勝った','Beat master Hai'],
  ['g50','🍺','50 回遊んだ','Played 50 games']
];

/* ================= 音 ================= */
let AC = null, master = null, NB = null;

async function cpuChoose(mv){
  const lv = cur().cpu.lv; let m;

    m = mv.slice().sort((a, b) => bits(a).length - bits(b).length || Math.max(...bits(b)) - Math.max(...bits(a)))[0];
  } else m = rnd() < .35 ? G.bestMove : pick(mv);

  await sleep(600 + rnd() * 600);

}

function fmtMove(m){ return bits(m).join(' + '); }
function gradeMove(m){
  const best = G.bestMove, l = Math.max(0, SOL.E[G.mask ^ m] - SOL.E[G.mask ^ best]), ok = l < 1e-9;
  D.tr.n++; if (ok) D.tr.ok++; D.tr.loss += l; save();
  G.lastJudge = { kind:'move', mask:G.mask, m, best, l, ok, cands:G.cands.slice() };
  sfx(ok ? 'ok' : 'wall', .5);
}
function gradeDiceChoice(one){
  const m = G.mask;
  const f = (lo, hi, pr) => { let e = 0; for (let r = lo; r <= hi; r++){ const q = pr(r); if (!q) continue; let b = null; for (let s = m; s; s = (s - 1) & m) if (SOL.sum[s] === r){ const v = SOL.E[m ^ s]; if (b == null || v < b) b = v; } e += q * (b == null ? SOL.SC[m] : b); } return e; };
  const e2 = f(2, 12, r => P2[r]), e1 = f(1, 6, () => 1 / 6);
  const mine = one ? e1 : e2, best = Math.min(e1, e2), l = Math.max(0, mine - best), ok = l < 1e-9;
  D.tr.n++; if (ok) D.tr.ok++; D.tr.loss += l; save();
  G.lastJudge = { kind:'dice', one, e1, e2, l, ok };
}

      const rows = j.cands.slice().sort((a, b) => SOL.E[j.mask ^ a] - SOL.E[j.mask ^ b]).slice(0, 6);
      h += `<table><tr><td></td><td>${T('evL')}</td><td>${T('shutL')}</td></tr>${rows.map(m => `<tr class="${m === j.m ? 'me' : ''}"><td>${fmtMove(m)}</td><td>${SOL.E[j.mask ^ m].toFixed(3)}</td><td>${(SOL.P[j.mask ^ m] * 100).toFixed(1)}%</td></tr>`).join('')}</table>`;
    } else {
      h += `<div class="${j.ok ? 'okc' : 'ngc'}">${j.ok ? '✓ ' + T('trOk') : '✗ ' + T('trNg')}</div><div>${T('dieChoice')(j.e2.toFixed(3), j.e1.toFixed(3))}</div>`;

const openHelp = () => { renderHelp(); $('help').classList.add('show'); };
const closeHelp = () => $('help').classList.remove('show');

/* ================= 紙吹雪（点滅なし） ================= */
function burst(){
  const n = 70;
  for (let i = 0; i < n; i++){
    const e = document.createElement('div');
    const c = pick(['#ffe08a','#39ff14','#ff7a5a','#9fd8ff','#f6dfae']);
    e.style.cssText = `position:fixed;left:${50 + (rnd() - .5) * 30}vw;top:40vh;width:8px;height:4px;background:${c};z-index:95;pointer-events:none;border-radius:1px`;
    document.body.append(e);
    const dx = (rnd() - .5) * 700, dy = -200 - rnd() * 300, rot = (rnd() - .5) * 900;
    e.animate([{ transform:'translate(0,0) rotate(0)', opacity:1 }, { transform:`translate(${dx * .6}px,${dy}px) rotate(${rot * .5}deg)`, opacity:1, offset:.35 }, { transform:`translate(${dx}px,${dy + 600}px) rotate(${rot}deg)`, opacity:0 }], { duration:2400 + rnd() * 900, easing:'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => e.remove();
  }
}

/* ================= 共通 ================= */
let toastT = null;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
function btnL(id, a){ $(id).innerHTML = a[0] + `<small>${a[1]}</small>`; }
function apply(){
  document.documentElement.lang = D.lang;
  document.body.classList.toggle('light', D.theme === 'light');
  $('tLang').textContent = J() ? '🌐 EN' : '🌐 日本語';
  $('tSound').textContent = D.sound ? '🔊' : '🔇';
  $('tTheme').textContent = D.theme === 'light' ? '🌙 ' + (J() ? 'ダーク' : 'Dark') : '☀️ ' + (J() ? 'ノーマル' : 'Normal');
  $('hScore').textContent = T('score'); $('hSet').textContent = T('set'); $('hTr').textContent = T('tr'); $('hSt').textContent = T('st');
  $('lMode').textContent = T('mode'); $('lTiles').textContent = T('tiles'); $('lScoring').textContent = T('scoring'); $('lOne').textContent = T('one'); $('lRounds').textContent = T('rounds'); $('lTrain').textContent = T('train'); $('lAuto').textContent = T('auto');
  $('lRoll').textContent = T('lRoll'); $('lSel').textContent = T('lSel'); $('lLeft').textContent = T('lLeft');
  btnL('bRoll2', T('roll2')); btnL('bRoll1', T('roll1')); btnL('bShut', T('shut')); btnL('bNext', T('next'));
  $('bNew').textContent = T('newg'); $('kb').textContent = T('kb');
  renderSettings(); buildFelt(); renderStats(); updateTrainer();
  if (G){ G.pl.forEach((p, i) => { if (!p.cpu) p.name = D.mode === 'duo' ? T('p')(i) : T('you'); else p.name = `${p.cpu.ic} ${J() ? p.cpu.ja : p.cpu.en}`; }); renderAll(); }
  if ($('help').classList.contains('show')) renderHelp();
}
$('bRoll2').onclick = () => doRoll(false);
$('bRoll1').onclick = () => doRoll(true);
$('bShut').onclick = () => confirmShut();
$('bNext').onclick = () => newMatch();
$('bNew').onclick = () => newMatch();
cv.addEventListener('pointerdown', () => { if (G && G.phase === 'roll' && !cur().cpu) doRoll(false); });
$('tHelp').onclick = openHelp; $('hClose').onclick = closeHelp;
$('help').onclick = e => { if (e.target === $('help')) closeHelp(); };
$('tLang').onclick = () => { D.lang = J() ? 'en' : 'ja'; save(); apply(); };
$('tSound').onclick = () => { D.sound = !D.sound; ac(); save(); apply(); };
$('tTheme').onclick = () => { D.theme = D.theme === 'light' ? 'dark' : 'light'; save(); apply(); };
const KEYMAP = { '1':0, '2':1, '3':2, '4':3, '5':4, '6':5, '7':6, '8':7, '9':8, '0':9, '-':10, '=':11 };
const KON = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a']; let kb = [];
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(); kb.push(k); if (kb.length > 10) kb.shift();
  if (kb.join() === KON.join()){ kb = []; D.catTiles = !D.catTiles; save(); buildTiles(); renderTiles(); TEL.forEach((t, i) => { if (D.catTiles) t.querySelector('.n').textContent = CATNUM[i] + (i + 1); }); toast(D.catTiles ? '🐾 板に三匹の足あとが付きました' : '🪵 いつもの板に戻りました'); return; }
  if (kb.slice(-3).join('') === 'neo'){ D.neo = !D.neo; buildFelt(); toast(D.neo ? '🟩 Wake up, Neo… the felt is green code now.' : '🍺 Back to the pub.'); return; }
  if ($('help').classList.contains('show')){ if (k === 'escape' || k === '?') closeHelp(); return; }
  if (e.repeat) return;
  if (k === ' ' || k === 'r'){ e.preventDefault(); if (G && G.over) return; doRoll(false); }
  else if (k === 'o'){ doRoll(true); }
  else if (k === 'enter'){ e.preventDefault(); if (G && G.over) newMatch(); else confirmShut(); }
  else if (k === 'backspace'){ if (G && G.phase === 'choose' && !cur().cpu){ e.preventDefault(); G.sel = 0; renderAll(); } }
  else if (k === '?'){ openHelp(); }
  else if (k in KEYMAP){ const i = KEYMAP[k]; if (SOL && i < SOL.n) tapTile(i); }
});
let rT = null; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(size, 120); });

apply(); size(); newMatch(); requestAnimationFrame(frame);
})();
</script>
