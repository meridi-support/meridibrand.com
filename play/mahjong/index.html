<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeridiPlay — 麻雀牌占い Mahjong Oracle</title>
<style>
:root{--g:#39ff14;--gold:#e8c26a;--E:cubic-bezier(.22,1,.36,1);
  --mincho:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP','MS PMincho',serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#07090c;color:#e9e2cf;font-family:var(--mincho);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 20%,#1b2a22 0%,#0a0f0c 55%,#040605 100%)}
header{position:relative;z-index:5;display:flex;align-items:center;gap:7px;padding:12px 20px;border-bottom:1px solid #39ff1422;flex-wrap:wrap;background:#0007}
.brand{margin-right:auto;display:flex;align-items:baseline;gap:12px}
.brand b{font:bold 18px 'Courier New',monospace;letter-spacing:5px;color:var(--g);text-shadow:0 0 10px #39ff1488}
.brand span{font-size:14px;letter-spacing:6px}
.tg{background:#000a;color:#d6e6d0;border:1px solid #39ff1440;border-radius:16px;padding:6px 12px;font:12px 'Courier New',monospace;cursor:pointer;transition:all .3s var(--E);white-space:nowrap}
.tg:hover{border-color:var(--g);color:var(--g)}
.tg.on{background:#39ff141c;border-color:var(--g);color:var(--g);box-shadow:0 0 8px #39ff1440}
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:14px 16px 30px}

/* mat */
.mat{position:relative;height:330px;border-radius:18px;border:12px solid #2a1a0e;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,#1f7a48 0%,#155c35 55%,#0c3a21 100%);box-shadow:0 0 50px #000c,inset 0 0 50px #0008}
.mat::before{content:'';position:absolute;inset:0;opacity:.25;background:repeating-linear-gradient(45deg,#ffffff06 0 2px,transparent 2px 5px)}
.mlabel{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:8px;color:#ffffff33;white-space:nowrap}
.tile{position:absolute;width:52px;height:70px;border-radius:7px;will-change:transform;user-select:none}
.tile .f,.tile .b{position:absolute;inset:0;border-radius:7px}
.tile .f{background:linear-gradient(160deg,#fffdf4,#efe8d4);box-shadow:inset 0 0 0 1px #00000018,inset 2px 2px 2px #fff,0 5px 0 #d9cfb4,0 6px 0 #1f8a48,0 9px 0 #166b37,0 12px 10px #0009}
.tile .b{background:linear-gradient(160deg,#2fae63,#1a7a42);box-shadow:inset 0 0 0 1px #0003,inset 2px 2px 3px #ffffff44,0 5px 0 #146a35,0 6px 0 #e9e1c8,0 9px 0 #cfc5a8,0 12px 10px #0009;display:none}
.tile.down .f{display:none}.tile.down .b{display:block}
.tile .f svg{width:100%;height:100%;display:block}
body.gold .tile .b{background:linear-gradient(160deg,#ffe08a,#c08a1c);box-shadow:inset 0 0 0 1px #0003,inset 2px 2px 3px #fff8,0 5px 0 #9a6d10,0 6px 0 #e9e1c8,0 9px 0 #cfc5a8,0 12px 10px #0009}
.tile.pick{cursor:pointer;transition:transform .35s var(--E)}
.tile.pick:hover,.tile.pick.cur{transform:translateY(-12px)!important}
.tile.cur .b{outline:2px solid #fff8;outline-offset:3px}
.tile.big{width:86px;height:116px;border-radius:10px}
.tile.big .f,.tile.big .b{border-radius:10px}

/* spread */
.spread{display:flex;justify-content:center;gap:22px;margin-top:22px;flex-wrap:wrap}
.pos{width:300px;min-height:330px;border:1px solid #39ff1422;border-radius:14px;background:#050a07cc;padding:14px;display:flex;flex-direction:column;align-items:center;transition:border-color .6s,box-shadow .6s}
.pos.filled{border-color:#e8c26a55;box-shadow:0 0 22px #e8c26a18}
.pos h4{font-size:13px;letter-spacing:6px;color:var(--gold);margin-bottom:12px}
.slot{position:relative;width:86px;height:128px;border:1px dashed #ffffff22;border-radius:10px}
.slot .tile{position:absolute;left:0;top:0}
.pn{margin-top:14px;font-size:20px;letter-spacing:4px;font-weight:700;opacity:0;transition:opacity .8s}
.pk{font:11px 'Courier New',monospace;letter-spacing:2px;color:#9fcf9f;margin-top:4px;opacity:0;transition:opacity .8s .1s}
.pm{font-size:14px;line-height:1.9;margin-top:10px;text-align:center;opacity:0;transform:translateY(6px);transition:opacity .9s .25s,transform 1s .25s var(--E)}
.pos.filled .pn,.pos.filled .pk,.pos.filled .pm{opacity:1;transform:none}
.reading{max-width:920px;margin:20px auto 0;border:1px solid #e8c26a44;border-radius:14px;padding:18px 22px;background:#0b0905cc;opacity:0;transform:translateY(10px);transition:opacity 1s,transform 1.1s var(--E)}
.reading.show{opacity:1;transform:none}
.reading h3{font-size:16px;letter-spacing:8px;color:var(--gold);text-align:center;margin-bottom:10px}
.yaku{text-align:center;font-size:24px;letter-spacing:6px;font-weight:700;color:#ffe08a;text-shadow:0 0 20px #e8c26a88;margin-bottom:8px;min-height:0}
.reading p{font-size:15px;line-height:2;letter-spacing:1px}
.lucky{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:14px}
.lucky em{font-style:normal;color:var(--gold);margin-right:6px}

.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--gold);background:linear-gradient(#1c2a20,#0b120d);color:#f3ecd8;border-radius:24px;padding:11px 26px;font:16px var(--mincho);letter-spacing:4px;cursor:pointer;transition:all .35s var(--E)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px #000a,0 0 14px #e8c26a44}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.main{border-color:var(--g);font-size:18px;padding:12px 36px;box-shadow:0 0 14px #39ff1433}
.msg{text-align:center;font-size:14px;letter-spacing:3px;margin-top:12px;min-height:22px;color:#dfe9d6}
.qin{display:block;margin:12px auto 0;width:min(420px,90%);background:#000a;border:1px solid #e8c26a44;color:#f3ecd8;border-radius:22px;padding:9px 18px;font:14px var(--mincho);text-align:center;letter-spacing:2px;outline:none}
.qin:focus{border-color:var(--gold)}
.hint{text-align:center;font:11px 'Courier New',monospace;opacity:.5;margin-top:14px;letter-spacing:1px}

/* book */
.modal{position:fixed;inset:0;z-index:40;background:#000c;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.modal.show{opacity:1;pointer-events:auto}
.mbox{width:min(820px,95vw);max-height:90vh;overflow:auto;background:linear-gradient(#0f1712,#070b08);border:1px solid #e8c26a66;border-radius:14px;padding:22px 24px;transform:translateY(12px);transition:transform .6s var(--E)}
.modal.show .mbox{transform:none}
.mbox h2{font-size:19px;letter-spacing:8px;color:var(--gold);text-align:center}
.prog{text-align:center;font-size:12px;letter-spacing:3px;margin:8px 0 14px;opacity:.75}
.book{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
@media(max-width:640px){.book{grid-template-columns:repeat(6,1fr)}}
.bk{position:relative;aspect-ratio:52/70;border-radius:6px;cursor:pointer}
.bk svg{width:100%;height:100%;display:block;border-radius:6px;background:linear-gradient(160deg,#fffdf4,#efe8d4);box-shadow:0 3px 0 #1f8a48}
.bk.lock svg{filter:grayscale(1) brightness(.25)}
.bk i{position:absolute;right:2px;bottom:2px;font:bold 9px 'Courier New',monospace;font-style:normal;color:#0a5a2a}
.bdet{margin-top:14px;min-height:60px;font-size:14px;line-height:1.9;text-align:center}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:13px}
.hist div{border-bottom:1px solid #ffffff12;padding:4px 0}
.hist em{font-style:normal;opacity:.5;margin-right:8px;font-family:'Courier New',monospace;font-size:11px}
.mrow{display:flex;justify-content:space-between;margin-top:18px}
.gbox{width:min(760px,95vw)}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0 16px}
.gpage{animation:gIn .5s var(--E);font-size:14.5px;line-height:2;letter-spacing:.5px}
@keyframes gIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gpage h4{font-size:15px;letter-spacing:4px;color:var(--gold);margin:14px 0 6px}
.gpage ol,.gpage ul{padding-left:1.4em}
.gpage b{color:#ffe08a}
.gpage .note{font-size:12px;opacity:.65;margin-top:10px;line-height:1.8}
.gtbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.gtbl th,.gtbl td{border-bottom:1px solid #ffffff14;padding:6px 6px;text-align:left;vertical-align:middle}
.gtbl th{color:var(--gold);font-weight:normal;font-size:12px;letter-spacing:2px}
.gtiles{display:flex;gap:3px}
.gtiles span{display:block;width:26px;height:35px;border-radius:4px;background:linear-gradient(160deg,#fffdf4,#efe8d4);box-shadow:0 2px 0 #1f8a48}
.gtiles svg{width:100%;height:100%;display:block}
.gno{display:block;text-align:center;font-size:12px;opacity:.7;margin-top:14px;cursor:pointer}
.toasts{position:fixed;right:16px;top:64px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#0b0905ee;border:1px solid var(--gold);border-radius:12px;padding:9px 14px;font-size:13px;letter-spacing:1px;animation:tin .6s var(--E) both;max-width:320px}
.toast.out{animation:tout .5s ease forwards}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:45}
</style>
</head>
<body>
<header>
  <div class="brand"><b>MERIDIPLAY</b><span id="bT">麻雀牌占い</span></div>
  <button class="tg" id="tLang">🌐 EN</button>
  <button class="tg" id="tSound">🔊</button>
  <button class="tg" id="tMode"></button>
  <button class="tg" id="tBook"></button>
  <button class="tg" id="tGuide"></button>
</header>

<div class="wrap">
  <div class="mat" id="mat"><div class="mlabel">MERIDIPLAY · 麻 雀 牌 占 い</div></div>
  <input class="qin" id="qin" maxlength="40" autocomplete="off">
  <div class="ctrl"><button class="btn main" id="bMain"></button><button class="btn" id="bAuto"></button></div>
  <div class="msg" id="msg"></div>
  <div class="spread" id="spread"></div>
  <div class="reading" id="reading"><h3 id="rT"></h3><div class="yaku" id="yaku"></div><p id="rP"></p><div class="lucky" id="lucky"></div></div>
  <div class="hint" id="hint"></div>
</div>

<div class="modal" id="modal"><div class="mbox">
  <h2 id="mT"></h2><div class="prog" id="mP"></div>
  <div class="book" id="book"></div>
  <div class="bdet" id="bdet"></div>
  <div class="hist" id="hist"></div>
  <div class="mrow"><button class="tg" id="mReset"></button><button class="tg on" id="mClose">OK</button></div>
</div></div>
<div class="modal" id="guide"><div class="mbox gbox">
  <h2 id="gT"></h2>
  <div class="gtabs" id="gTabs"></div>
  <div id="gBody"></div>
  <label class="gno"><input type="checkbox" id="gNo"> <span id="gNoL"></span></label>
  <div class="mrow"><button class="tg" id="gPrev">‹</button><button class="tg on" id="gClose"></button><button class="tg" id="gNext">›</button></div>
</div></div>
<div class="toasts" id="toasts"></div>
<canvas id="fx"></canvas>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const H = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
function rnd(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
const ri = n => Math.floor(rnd() * n);
const pick = a => a[ri(a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lsGet = k => { try { return window.localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { window.localStorage.setItem(k, v); } catch(e){} };
const EASE = 'cubic-bezier(.22,1,.36,1)';

/* ================= TILES ================= */
// id: m1-9 萬子 / p1-9 筒子 / s1-9 索子 / z1-7 東南西北白發中
const TILES = [];
['m', 'p', 's'].forEach(s => { for (let n = 1; n <= 9; n++) TILES.push({ id: s + n, s, n }); });
for (let n = 1; n <= 7; n++) TILES.push({ id: 'z' + n, s: 'z', n });
const KAN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
const ZJ = ['', '東', '南', '西', '北', '白', '發', '中'];
const ZE = ['', 'East', 'South', 'West', 'North', 'White', 'Green', 'Red'];
const SUITJ = { m: '萬子', p: '筒子', s: '索子' }, SUITE = { m: 'Characters', p: 'Circles', s: 'Bamboo' };
function tName(t, lang){
  if (t.s === 'z') return lang === 'ja' ? ZJ[t.n] : ZE[t.n] + (t.n <= 4 ? ' Wind' : ' Dragon');
  return lang === 'ja' ? KAN[t.n] + (t.s === 'm' ? '萬' : t.s === 'p' ? '筒' : '索') : `${t.n} of ${SUITE[t.s]}`;
}

/* ---------- face SVG ---------- */
const PIPS = {
  1: [[30, 40]], 2: [[30, 21], [30, 59]], 3: [[16, 17], [30, 40], [44, 63]], 4: [[18, 22], [42, 22], [18, 58], [42, 58]],
  5: [[18, 20], [42, 20], [30, 40], [18, 60], [42, 60]], 6: [[19, 17], [41, 17], [19, 40], [41, 40], [19, 63], [41, 63]],
  7: [[14, 13], [30, 21], [46, 29], [19, 47], [41, 47], [19, 66], [41, 66]], 8: [[19, 12], [41, 12], [19, 30], [41, 30], [19, 50], [41, 50], [19, 68], [41, 68]],
  9: [[15, 16], [30, 16], [45, 16], [15, 40], [30, 40], [45, 40], [15, 64], [30, 64], [45, 64]]
};
function face(t){
  let b = '';
  if (t.s === 'm'){
    b = `<text x="30" y="34" font-size="27" text-anchor="middle" font-weight="700" fill="#1b2350" font-family="serif">${KAN[t.n]}</text>
         <text x="30" y="70" font-size="29" text-anchor="middle" font-weight="700" fill="#b3121e" font-family="serif">萬</text>`;
  } else if (t.s === 'p'){
    const r = t.n === 1 ? 19 : t.n <= 4 ? 10 : t.n <= 6 ? 8.5 : 7.4;
    PIPS[t.n].forEach(([x, y], i) => {
      const c = t.n === 1 ? '#b3121e' : (t.n === 5 && i === 2) || (t.n === 7 && i < 3) || (t.n === 9 && i % 3 === 1) ? '#b3121e' : i % 2 ? '#1f7a3a' : '#1b3a8a';
      b += `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${c}" stroke-width="${r * .28}"/><circle cx="${x}" cy="${y}" r="${r * .42}" fill="${c}"/>`;
      if (t.n === 1) b += `<circle cx="30" cy="40" r="11" fill="none" stroke="#1b3a8a" stroke-width="2.4"/>`;
    });
  } else if (t.s === 's'){
    if (t.n === 1){
      b = `<g transform="translate(30,42)"><ellipse cx="0" cy="6" rx="12" ry="15" fill="#1f7a3a"/><circle cx="0" cy="-14" r="7" fill="#b3121e"/><path d="M0 -14 L10 -18 L2 -10Z" fill="#e2a31c"/>
        <path d="M-10 18 Q-18 30 -6 28 M10 18 Q18 30 6 28" stroke="#1b3a8a" stroke-width="3" fill="none"/><circle cx="-2" cy="-15" r="1.6" fill="#fff"/></g>`;
    } else {
      PIPS[t.n].forEach(([x, y], i) => {
        const c = (t.n === 5 && i === 2) || (t.n === 7 && i === 0) || (t.n === 9 && i % 3 === 1) ? '#b3121e' : '#1f7a3a';
        const h = t.n <= 4 ? 30 : t.n <= 6 ? 20 : 16;
        b += `<rect x="${x - 3.6}" y="${y - h / 2}" width="7.2" height="${h}" rx="3.4" fill="${c}"/><rect x="${x - 4.4}" y="${y - 1}" width="8.8" height="2.2" rx="1" fill="#fff9"/>`;
      });
    }
  } else {
    const c = t.n === 7 ? '#b3121e' : t.n === 6 ? '#1f7a3a' : '#1a1a1a';
    if (t.n === 5) b = `<rect x="13" y="16" width="34" height="48" rx="3" fill="none" stroke="#1b3a8a" stroke-width="3"/><rect x="18" y="21" width="24" height="38" rx="2" fill="none" stroke="#1b3a8a" stroke-width="1.2"/>`;
    else b = `<text x="30" y="56" font-size="40" text-anchor="middle" font-weight="700" fill="${c}" font-family="serif">${ZJ[t.n]}</text>`;
  }
  return `<svg viewBox="0 0 60 80">${b}</svg>`;
}
function tileEl(t, down = true){
  const el = H('div', 'tile' + (down ? ' down' : ''));
  const f = H('div', 'f'); f.innerHTML = face(t); el.append(f, H('div', 'b'));
  el._t = t; return el;
}

/* ================= MEANINGS（MeridiPlay オリジナル解釈） ================= */
const KEY = { 1:['始まり','Beginning'], 2:['縁','Connection'], 3:['芽吹き','Growth'], 4:['土台','Foundation'], 5:['転機','Turning point'], 6:['調和','Harmony'], 7:['内省','Reflection'], 8:['広がり','Expansion'], 9:['成就','Fulfillment'] };
const THEME = { m:['財と仕事','wealth & work'], p:['心と人の縁','heart & relationships'], s:['成長と健やかさ','growth & wellbeing'], z:['天の巡り','the turning of heaven'] };
const MJ = {
  m:['新しい仕事の芽が出ます。小さく始めることが、大きな実りへの近道です。','頼れる協力者が現れます。一人で抱えず、声をかけてみて。','努力が形になり始めます。手を止めず、少しずつ積み上げて。',
     '地道な準備が報われる時。足元を固めるほど、先が開けます。','流れが変わる兆し。新しいやり方を一つ取り入れると吉。','収支の釣り合いが取れる時。無理のない計画が福を呼びます。',
     '立ち止まって見直す時期。焦りは禁物、数字を丁寧に確かめて。','評価や収入が広がる兆し。人に分けるほど巡りが良くなります。','長く続けてきたことが実を結びます。胸を張って受け取りましょう。'],
  p:['新しい出会いの予感。最初の挨拶を、いつもより丁寧に。','大切な人との縁が深まります。感謝を言葉にすると吉。','心に小さな喜びが芽生えます。好きなことに少し時間を。',
     '信頼の土台が育つ時。約束を一つずつ守ることが鍵です。','気持ちに変化が訪れます。素直な心で受け止めて。','人の輪がよく和みます。聞き役に回ると、福が集まります。',
     '心を休める時。一人の静かな時間が、次の力になります。','縁が縁を呼びます。誘いには気軽に応じてみて。','想いが通じ合います。積み重ねた優しさが、ここで報われます。'],
  s:['新しい習慣を始めるのに良い時。今日の一歩を大切に。','支え合うことで伸びていきます。仲間と歩調を合わせて。','すくすくと伸びる時期。学んだことをすぐ試してみて。',
     '体と暮らしを整える時。眠りと食事を見直すと吉。','伸び方が変わる節目。竹の節のように、ここで強くなります。','心身の調子が整います。無理をせず、今のリズムを守って。',
     '休むことも成長のうち。少し立ち止まって、根を張りましょう。','力が外へ広がります。挑戦の範囲を一歩だけ広げて。','長く育ててきたものが実ります。自分をしっかり労って。']
};
const ZM = [null,
  ['東は日の昇る方角。物事の始まりに追い風が吹きます。','Rising sun: a tailwind for new beginnings.'],
  ['南は陽の極み。明るさと勢いが、周りを惹きつけます。','Full sun: your brightness draws people in.'],
  ['西は実りと休息の方角。一区切りつけて、成果を味わって。','Harvest and rest: pause and enjoy your results.'],
  ['北は静けさと蓄えの方角。今は力を内に溜める時です。','Stillness and storage: gather strength within.'],
  ['白は清らかな余白。何も描かれていないのは、何でも描けるということ。','A blank tile: nothing drawn means anything can be.'],
  ['發は発展の兆し。思い切った一手が、大きな広がりを生みます。','Prosperity: one bold move brings great expansion.'],
  ['中は的の真ん中。迷いが晴れ、狙いがまっすぐ定まります。','Bullseye: doubts clear and your aim becomes true.']];
function meaning(t, lang){
  if (t.s === 'z') return ZM[t.n][lang === 'ja' ? 0 : 1];
  if (lang === 'ja') return MJ[t.s][t.n - 1];

let AC = null, master = null;
function ac(){
  if (!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
    const cv = AC.createConvolver(), len = AC.sampleRate * 1.3, ir = AC.createBuffer(2, len, AC.sampleRate);
    for (let c = 0; c < 2; c++){ const ch = ir.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    cv.buffer = ir; const w = AC.createGain(); w.gain.value = .18; master.connect(cv); cv.connect(w); w.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume(); return AC;
}
function tone(f, t, d, v, type = 'sine'){ const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05); }
function noise(t, d, v, f, q = 5){ const len = Math.max(1, Math.floor(AC.sampleRate * d)), b = AC.createBuffer(1, len, AC.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2); const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = b; fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = q; g.gain.value = v; s.connect(fl); fl.connect(g); g.connect(master); s.start(t); }
function sfx(k){
  if (!D.sound || !AC) return;
  try { const t = AC.currentTime;
    if (k === 'clack'){ noise(t, .022, .3, 2600 + Math.random() * 1400); tone(1500 + Math.random() * 700, t, .05, .015, 'triangle'); }
    else if (k === 'wash'){ for (let i = 0; i < 26; i++){ const tt = t + i * .055 + Math.random() * .04; noise(tt, .02, .12 + Math.random() * .12, 2000 + Math.random() * 2200); } }
    else if (k === 'flip'){ noise(t, .03, .45, 1900, 6); tone(900, t, .09, .03, 'triangle'); }
    else if (k === 'chime') [587.33, 783.99, 987.77].forEach((f, i) => tone(f, t + i * .14, 1.6, .03));
    else if (k === 'yaku') [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, t + i * .1, 1.4, .035, 'triangle'));
  } catch(e){}
}

const mat = $('mat');
let phase = 'idle', wall = [], picks = [], cursor = 0, lastReading = null;
function matSize(){ const r = mat.getBoundingClientRect(); return { w: r.width - 24, h: r.height - 24 }; }
function deck136(){ const d = []; TILES.forEach(t => { for (let k = 0; k < 4; k++) d.push(t); }); for (let i = d.length - 1; i > 0; i--){ const j = ri(i + 1); [d[i], d[j]] = [d[j], d[i]]; } return d; }
function place(el, x, y, r){ el._x = x; el._y = y; el._r = r; el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`; }

async function cut(){
  if (phase !== 'idle' && phase !== 'done') return;
  try { ac(); } catch(e){}
  phase = 'wash'; ui();
  picks = []; resetSpread(); $('reading').classList.remove('show');
  mat.querySelectorAll('.tile').forEach(t => t.remove());
  const { w, h } = matSize(), N = 22, deck = deck136().slice(0, N);
  wall = deck.map(t => { const el = tileEl(t); place(el, w / 2 - 26 + (rnd() - .5) * 60, h / 2 - 35 + (rnd() - .5) * 40, ri(360)); mat.append(el); return el; });
  $('msg').textContent = T('washing');
  // 洗牌：両手でかき混ぜるように数回散らす
  for (let k = 0; k < 4; k++){
    sfx('wash');
    await Promise.all(wall.map(el => {
      const cx = w / 2, cy = h / 2, a = rnd() * Math.PI * 2, rr = 60 + rnd() * Math.min(w * .42, 240);
      const x = cx + Math.cos(a) * rr * (w > 600 ? 1.5 : 1) - 26, y = cy + Math.sin(a) * rr * .45 - 35, r = el._r + (rnd() - .5) * 200;
      const from = el.style.transform; place(el, Math.max(0, Math.min(w - 52, x)), Math.max(0, Math.min(h - 80, y)), r);
      return el.animate([{ transform: from }, { transform: el.style.transform }], { duration: 620 + rnd() * 200, easing: 'cubic-bezier(.45,.05,.3,1)' }).finished;
    }));
  }
  // 一列に並べる（壁）
  const gap = Math.min(58, (w - 20) / N * 1.0), x0 = (w - gap * (N - 1) - 52) / 2, y0 = h / 2 - 40;
  sfx('wash');
  await Promise.all(wall.map((el, i) => {
    const from = el.style.transform; place(el, x0 + i * gap, y0 + Math.sin(i / (N - 1) * Math.PI) * -10, 0);
    return el.animate([{ transform: from }, { transform: el.style.transform }], { duration: 700, delay: i * 25, easing: EASE, fill: 'backwards' }).finished;
  }));
  wall.forEach((el, i) => { el.classList.add('pick'); el.onclick = () => choose(i); el.onmouseenter = () => setCursor(i); });
  phase = 'choose'; cursor = Math.floor(N / 2); setCursor(cursor); ui();
}
function setCursor(i){
  if (phase !== 'choose') return;
  const av = wall.map((el, k) => el.isConnected && !el._taken ? k : -1).filter(k => k >= 0); if (!av.length) return;
  if (!av.includes(i)) i = av.reduce((b, k) => Math.abs(k - i) < Math.abs(b - i) ? k : b, av[0]);
  cursor = i; wall.forEach((el, k) => el.classList.toggle('cur', k === i));
}
function moveCursor(d){
  const av = wall.map((el, k) => !el._taken ? k : -1).filter(k => k >= 0); if (!av.length) return;
  let idx = av.indexOf(cursor); idx = (idx + d + av.length) % av.length; setCursor(av[idx]);
}
async function choose(i){
  if (phase !== 'choose' || wall[i]._taken) return;
  const el = wall[i]; el._taken = true; el.classList.remove('pick', 'cur'); el.onclick = null;
  const k = picks.length; picks.push(el._t);
  const slot = $('slot' + k), a = el.getBoundingClientRect();
  sfx('clack');
  const big = tileEl(el._t, true); big.classList.add('big'); slot.append(big);
  const b = big.getBoundingClientRect();
  el.style.visibility = 'hidden';
  if (picks.length >= D.mode){ phase = 'reveal'; ui(); } else { moveCursor(1); }
  await big.animate([{ transform: `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width})` }, { transform: 'none' }], { duration: 650, easing: EASE }).finished;
  if (picks.length >= D.mode && k === D.mode - 1) await revealAll();
}
async function auto(){
  if (phase === 'idle' || phase === 'done'){ await cut(); }
  if (phase !== 'choose') return;
  while (phase === 'choose' && picks.length < D.mode){
    const av = wall.map((el, k) => !el._taken ? k : -1).filter(k => k >= 0);
    setCursor(pick(av)); await sleep(380); await choose(cursor); await sleep(250);
  }
}
async function revealAll(){
  await sleep(400);
  for (let k = 0; k < picks.length; k++){
    const slot = $('slot' + k), el = slot.querySelector('.tile');
    await el.animate([{ transform: 'none' }, { transform: 'scaleY(.04) translateY(40px)' }], { duration: 220, easing: 'ease-in', fill: 'forwards' }).finished;
    el.classList.remove('down');

function yaku(ts){
  if (ts.length < 3) return null;
  const ids = ts.map(t => t.id);
  if (['z5', 'z6', 'z7'].every(i => ids.includes(i))) return 'dragon';
  if (ids[0] === ids[1] && ids[1] === ids[2]) return 'pung';
  if (ts.every(t => t.s === 'z' && t.n <= 4) && new Set(ids).size === 3) return 'wind';
  if (ts.every(t => t.s === 'z')) return 'honor';
  if (ts.every(t => t.s === ts[0].s && t.s !== 'z')){ const n = ts.map(t => t.n).sort((a, b) => a - b); if (n[1] === n[0] + 1 && n[2] === n[1] + 1) return 'chow'; }
  if (new Set(ids).size < 3) return 'pair';
  return null;
}

const fxc = $('fx'), fx = fxc.getContext('2d'); let parts = [], fxOn = false;
function sparkle(n){
  fxc.width = innerWidth; fxc.height = innerHeight;
  for (let i = 0; i < n; i++) parts.push({ x: rnd() * innerWidth, y: innerHeight + 10, vy: -(1.2 + rnd() * 2.4), vx: (rnd() - .5) * .6, r: 1 + rnd() * 2.4, life: 1, d: .003 + rnd() * .004 });

    fx.globalCompositeOperation = 'lighter';
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= p.d; fx.globalAlpha = Math.max(0, p.life); fx.fillStyle = '#ffd98a'; fx.beginPath(); fx.arc(p.x, p.y, p.r, 0, 7); fx.fill(); });

let gPage = 0;
function renderGuide(){
  const G = GUIDE[D.lang];
  $('gT').textContent = G.title; $('gClose').textContent = G.close; $('gNoL').textContent = G.no; $('gNo').checked = !!D.noGuide;
  const tb = $('gTabs'); tb.replaceChildren();
  G.tabs.forEach((n, i) => { const b = H('button', 'tg' + (i === gPage ? ' on' : ''), n); b.onclick = () => { gPage = i; renderGuide(); }; tb.append(b); });
  $('gBody').innerHTML = `<div class="gpage">${G.pages[gPage]}</div>`;
  $('gPrev').disabled = gPage === 0; $('gNext').disabled = gPage === G.pages.length - 1;
}
function openGuide(p = 0){ gPage = p; renderGuide(); $('guide').classList.add('show'); }
function closeGuide(){ $('guide').classList.remove('show'); D.noGuide = $('gNo').checked; save(); }

/* ================= UI ================= */
function ui(){
  const m = $('bMain'), a = $('bAuto');
  m.textContent = phase === 'done' ? T('again') : T('cut');
  m.disabled = !(phase === 'idle' || phase === 'done');
  a.textContent = T('pickBtn'); a.disabled = !(phase === 'idle' || phase === 'done' || phase === 'choose');
  $('msg').textContent = phase === 'idle' || phase === 'done' ? (phase === 'idle' ? T('idle') : '') : phase === 'choose' ? T('choose', D.mode - picks.length) : phase === 'wash' ? T('washing') : '';
}
function apply(){
  document.documentElement.lang = D.lang;
  $('bT').textContent = T('title');
  $('tLang').textContent = D.lang === 'ja' ? '🌐 EN' : '🌐 日本語';
  $('tSound').textContent = D.sound ? '🔊' : '🔇'; $('tSound').classList.toggle('on', D.sound);
  $('tMode').textContent = T('mode', D.mode); $('tBook').textContent = T('book'); $('tGuide').textContent = GUIDE[D.lang].btn;
  if ($('guide').classList.contains('show')) renderGuide();
  $('qin').placeholder = T('q'); $('hint').textContent = T('hint');
  if (phase === 'idle' || phase === 'done'){ const keep = phase === 'done' ? picks.slice() : []; resetSpread(); if (phase === 'done'){ keep.forEach((t, k) => { const el = tileEl(t, false); el.classList.add('big'); $('slot' + k).append(el); fillPos(k, t); }); reading(); D.draws--; D.hist.shift(); save(); } }
  ui(); save();
}

/* ================= EVENTS ================= */
$('bMain').onclick = cut;
$('bAuto').onclick = () => { try { ac(); } catch(e){} auto(); };
$('tLang').onclick = () => { D.lang = D.lang === 'ja' ? 'en' : 'ja'; apply(); };
$('tSound').onclick = () => { D.sound = !D.sound; try { ac(); } catch(e){} apply(); sfx('clack'); };
$('tMode').onclick = () => { if (phase !== 'idle' && phase !== 'done') return; D.mode = D.mode === 3 ? 1 : 3; phase = 'idle'; picks = []; $('reading').classList.remove('show'); mat.querySelectorAll('.tile').forEach(t => t.remove()); apply(); };
$('tBook').onclick = openBook;
$('tGuide').onclick = () => openGuide(0);
$('gClose').onclick = closeGuide;
$('gPrev').onclick = () => { if (gPage > 0){ gPage--; renderGuide(); } };
$('gNext').onclick = () => { if (gPage < GUIDE[D.lang].pages.length - 1){ gPage++; renderGuide(); } };
$('guide').onclick = e => { if (e.target.id === 'guide') closeGuide(); };
$('mClose').onclick = () => $('modal').classList.remove('show');
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.remove('show'); };
$('mReset').onclick = () => { if (!confirm(T('confirm'))) return; D.got = {}; D.hist = []; D.draws = 0; D.ach = {}; save(); openBook(); };
$('qin').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); $('qin').blur(); if (phase === 'idle' || phase === 'done') cut(); } });
const KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
let buf = [];
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ($('guide').classList.contains('show')){
    if (k === 'escape' || k === 'enter'){ e.preventDefault(); closeGuide(); }
    else if (k === 'arrowright') $('gNext').click(); else if (k === 'arrowleft') $('gPrev').click();
    return;
  }
  if ($('modal').classList.contains('show')){ if (k === 'escape') $('modal').classList.remove('show'); return; }
  if (k === '?' || k === 'g'){ openGuide(0); return; }
  if (e.repeat && k !== 'arrowleft' && k !== 'arrowright') return;
  buf.push(k); if (buf.length > 12) buf.shift();
  const word = buf.filter(x => x.length === 1).join('');
  if (buf.slice(-10).join() === KONAMI.join()){ buf = []; document.body.classList.toggle('gold'); toast(T('gold')); sparkle(80); return; }
  if (word.endsWith('kokushi')){ buf = []; toast(T('kokushi')); sparkle(50); return; }
  if (phase === 'choose'){
    if (k === 'arrowleft'){ e.preventDefault(); moveCursor(-1); return; }
    if (k === 'arrowright'){ e.preventDefault(); moveCursor(1); return; }
    if (k === 'enter'){ e.preventDefault(); choose(cursor); return; }
  }
  if (k === ' '){ e.preventDefault(); try { ac(); } catch(err){} if (phase === 'idle' || phase === 'done') cut(); else if (phase === 'choose') auto(); }
  else if (k === 'enter' && (phase === 'idle' || phase === 'done')){ try { ac(); } catch(err){} cut(); }
  else if (k === 'm') $('tMode').click();
  else if (k === 'b') openBook();
});

/* ================= INIT ================= */
resetSpread(); apply();
if (!D.noGuide) setTimeout(() => openGuide(0), 400);
// 卓に飾りの牌を少し伏せて置く
(() => { const { w, h } = matSize(); for (let i = 0; i < 9; i++){ const el = tileEl(TILES[ri(34)]); place(el, w / 2 - 240 + i * 58, h / 2 - 40, (rnd() - .5) * 6); mat.append(el); } })();
})();
