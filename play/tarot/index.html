<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeridiPlay — 猫タロット占い Cat Tarot v1.0.0</title>
<style>
:root{--g:#39ff14;--c:#00d4ff;--gold:#e8c26a;--bg:#05050f;--E:cubic-bezier(.22,1,.36,1);--line:#39ff14;
  --serif:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--bg);color:#e4ecf2;font-family:var(--serif);overflow-x:hidden}
body.gold{--line:#ffd25a}
#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
header{position:relative;z-index:5;display:flex;align-items:center;gap:7px;padding:12px 20px;border-bottom:1px solid #39ff1422;flex-wrap:wrap;background:#0008}
.brand{margin-right:auto;display:flex;align-items:baseline;gap:12px}
.brand b{font:bold 18px 'Courier New',monospace;letter-spacing:5px;color:var(--g);text-shadow:0 0 10px #39ff1488}
.brand span{font-size:14px;letter-spacing:6px}
.tg{background:#000a;color:#cfe9d4;border:1px solid #39ff1440;border-radius:16px;padding:6px 12px;font:12px 'Courier New',monospace;cursor:pointer;transition:all .3s var(--E);white-space:nowrap}
.tg:hover{border-color:var(--g);color:var(--g)}
.tg.on{background:#39ff141c;border-color:var(--g);color:var(--g);box-shadow:0 0 8px #39ff1440}
.tg:disabled{opacity:.35;cursor:not-allowed}
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:14px 16px 40px}

/* table / fan */
.table{position:relative;height:300px;border-radius:18px;border:1px solid #39ff1430;overflow:hidden;
  background:radial-gradient(ellipse at 50% 110%,#12233a 0%,#0a0f22 50%,#05050f 100%);box-shadow:inset 0 0 60px #000c}
.table::after{content:'';position:absolute;left:50%;bottom:-120px;width:600px;height:240px;transform:translateX(-50%);border-radius:50%;border:1px solid #39ff1422;pointer-events:none}
.tlabel{position:absolute;top:12px;left:50%;transform:translateX(-50%);font:11px 'Courier New',monospace;letter-spacing:8px;color:#39ff1455;white-space:nowrap}
.fan .card{position:absolute;left:50%;bottom:-40px;margin-left:-42px;transform-origin:50% 260%;transform:var(--t,none);transition:transform .45s var(--E)}
.fan .card.pick{cursor:pointer}
.fan .card.cur{transform:var(--t,none) translateY(-26px)}
.fan .card.taken{visibility:hidden}

/* card */
.card{width:84px;height:140px;perspective:900px;user-select:none}
.ci{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,.2,.2,1)}
.card.down .ci{transform:rotateY(180deg)}
.cf,.cb{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cf{background:var(--cbg,#040a05);border:1px solid var(--line);box-shadow:0 0 14px color-mix(in srgb,var(--line) 35%,transparent),0 8px 18px #000c;overflow:hidden}
.cb{transform:rotateY(180deg);border:1px solid #39ff1466;box-shadow:0 8px 18px #000c;
  background:radial-gradient(circle at 50% 50%,#0f2a1a 0 18%,transparent 19%),repeating-conic-gradient(from 0deg at 50% 50%,#081a10 0 10deg,#04100a 10deg 20deg),#04100a}
.cb::before{content:'';position:absolute;inset:6px;border:1px solid #39ff1455;border-radius:5px}
.cb::after{content:'🐾';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;filter:grayscale(1) brightness(1.6) sepia(1) hue-rotate(60deg) saturate(4)}
body.gold .cb{border-color:#ffd25a88;background:radial-gradient(circle at 50% 50%,#3a2a08 0 18%,transparent 19%),repeating-conic-gradient(from 0deg at 50% 50%,#2a1e06 0 10deg,#1a1203 10deg 20deg)}
.art{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 4px 7px;transition:transform .6s var(--E)}
.card.rev .art{transform:rotate(180deg)}
.art .num{font:bold 11px Georgia,serif;letter-spacing:2px;color:var(--line)}
.art.cat{padding:0}.art.cat svg{width:100%;height:100%;display:block}
.art.old svg *{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.art.old svg .fl{fill:var(--line);stroke:none}
.art .nm{font-size:10px;letter-spacing:1px;color:#e9f6ea;text-align:center;line-height:1.2}
.card.big{width:104px;height:174px}
.card.big .art .num{font-size:13px}.card.big .art .nm{font-size:12px}

/* spread board */
.board{position:relative;margin:22px auto 0;transform-origin:top center}
.slot{position:absolute;width:104px;height:174px;border:1px dashed #39ff1430;border-radius:9px}
.slot .lb{position:absolute;left:-10px;right:-10px;top:-20px;text-align:center;font-size:11px;letter-spacing:2px;color:#9fd9a8;white-space:nowrap}
.slot .no{position:absolute;right:-8px;bottom:-8px;width:20px;height:20px;border-radius:50%;background:#000;border:1px solid #39ff1466;font:bold 10px 'Courier New',monospace;display:flex;align-items:center;justify-content:center;color:var(--g)}
.slot.cross{transform:rotate(90deg)}
.slot.cross .lb{display:none}
.slot .card{position:absolute;inset:0}
.slot.glow{border-color:var(--line);box-shadow:0 0 18px #39ff1444}

/* results */
.ctrl{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--g);background:radial-gradient(circle,#39ff1418,#000 75%);color:#fff;border-radius:24px;padding:11px 26px;font:15px var(--serif);letter-spacing:3px;cursor:pointer;transition:all .35s var(--E)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 18px #39ff1455}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.main{font-size:17px;padding:12px 36px}
.qin{display:block;margin:12px auto 0;width:min(440px,92%);background:#000a;border:1px solid #39ff1440;color:#eaf6ec;border-radius:22px;padding:9px 18px;font:14px var(--serif);text-align:center;letter-spacing:2px;outline:none}
.qin:focus{border-color:var(--g);box-shadow:0 0 10px #39ff1433}
.msg{text-align:center;font-size:14px;letter-spacing:3px;margin-top:12px;min-height:22px}
.results{max-width:900px;margin:26px auto 0;display:flex;flex-direction:column;gap:10px}
.rs{display:grid;grid-template-columns:150px 1fr;gap:14px;border:1px solid #39ff1422;border-radius:12px;padding:12px 14px;background:#050a12cc;animation:rIn .8s var(--E) both}
@keyframes rIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rs .p{font-size:12px;letter-spacing:2px;color:#9fd9a8}
.rs .p b{display:block;font-size:17px;color:#fff;letter-spacing:2px;margin-top:4px}
.rs .p i{font-style:normal;font-size:11px;display:inline-block;margin-top:5px;padding:2px 8px;border-radius:10px;border:1px solid}
.rs .p i.up{color:var(--g);border-color:#39ff1466}.rs .p i.rv{color:var(--c);border-color:#00d4ff66}
.rs .k{font:11px 'Courier New',monospace;letter-spacing:2px;color:#9fd9a8;opacity:.85}
.rs .m{font-size:14.5px;line-height:1.95;margin-top:3px}
@media(max-width:620px){.rs{grid-template-columns:1fr}}
.summary{border:1px solid #e8c26a55;border-radius:14px;padding:16px 20px;background:#0b0905cc;font-size:15px;line-height:2;animation:rIn .9s var(--E) both}
.summary h3{font-size:15px;letter-spacing:7px;color:var(--gold);text-align:center;margin-bottom:6px}
.hint{text-align:center;font:11px 'Courier New',monospace;opacity:.5;margin-top:16px;letter-spacing:1px}
.disc{text-align:center;font-size:11px;opacity:.45;margin-top:6px}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:#000c;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.modal.show{opacity:1;pointer-events:auto}
.mbox{width:min(820px,95vw);max-height:90vh;overflow:auto;background:linear-gradient(#081020,#04060d);border:1px solid #39ff1466;border-radius:14px;padding:22px 24px;box-shadow:0 0 40px #39ff1422;transform:translateY(12px);transition:transform .6s var(--E)}
.modal.show .mbox{transform:none}
.mbox h2{font-size:19px;letter-spacing:7px;color:var(--g);text-align:center}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0 16px}
.gpage{animation:rIn .5s var(--E);font-size:14.5px;line-height:2}
.gpage h4{font-size:15px;letter-spacing:4px;color:var(--gold);margin:14px 0 6px}
.gpage ol,.gpage ul{padding-left:1.4em}
.gpage b{color:#c9ffc0}
.gpage .note{font-size:12px;opacity:.65;margin-top:10px;line-height:1.8}
.gtbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.gtbl th,.gtbl td{border-bottom:1px solid #ffffff14;padding:6px;text-align:left;vertical-align:top}
.gtbl th{color:var(--gold);font-weight:normal;font-size:12px;letter-spacing:2px}
.gno{display:block;text-align:center;font-size:12px;opacity:.7;margin-top:14px;cursor:pointer}
.mrow{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:14px;justify-items:center}
.book .card{cursor:pointer;transition:transform .3s var(--E)}
.book .card:hover{transform:translateY(-4px)}
.book .card.lock .cf{filter:grayscale(1) brightness(.3)}
.bdet{margin-top:14px;min-height:70px;font-size:14px;line-height:1.9}
.bdet b{color:#fff}
.hist{margin-top:12px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.hist em{font-style:normal;opacity:.5;margin-right:8px;font-family:'Courier New',monospace;font-size:11px}
.prog{text-align:center;font-size:12px;letter-spacing:3px;opacity:.75;margin-top:6px}
.fly{position:fixed;z-index:30;pointer-events:none}
.toasts{position:fixed;right:16px;top:64px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#050c14ee;border:1px solid var(--g);border-radius:12px;padding:9px 14px;font-size:13px;letter-spacing:1px;animation:tin .6s var(--E) both;max-width:320px}
.toast.out{animation:tout .5s ease forwards}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
</style>
</head>

</div></div>

</div></div>

const C = [
 ['愚者','The Fool','新しい旅の始まり。計算より好奇心で、一歩を踏み出してみて。','勢いだけで飛び出す前に、足元を一度確かめて。準備が整えば道は開けます。','A new journey begins. Follow curiosity and take the first step.','Before you leap, check your footing. Once ready, the way opens.','自由・始まり','Freedom · Beginnings'],

 ['隠者','The Hermit','一人で考える時間が光を灯します。焦らず内省を。','閉じこもりすぎず、誰かに話してみると灯りが増えます。','Time alone lights the way. Reflect without hurry.','Don\'t isolate too long — sharing adds more light.','内省・探求','Reflection · Search'],
 ['運命の輪','Wheel of Fortune','流れが変わる好機。巡ってきたチャンスに乗って。','今は巡りが一休み。次の波に備えて力を蓄えて。','The tide is turning. Ride the chance that comes around.','The wheel is resting. Gather strength for the next wave.','転機・巡り','Cycles · Fortune'],
 ['正義','Justice','公平な判断が良い結果を呼びます。誠実さが鍵。','偏りがないか見直して。釣り合いを取り戻す時です。','Fair judgment brings good results. Honesty is the key.','Check for imbalance. It is time to restore fairness.','公正・均衡','Fairness · Balance'],

 ['塔','The Tower','思いがけない変化が、凝り固まったものを壊してくれます。再建のチャンス。','大きな崩れは避けられそう。小さな修正で乗り切れます。','A sudden change breaks what was stuck — a chance to rebuild.','A big collapse can be avoided. Small fixes will see you through.','変革・目覚め','Upheaval · Awakening'],
 ['星','The Star','希望の光が差します。願いを素直に持ち続けて。','希望が見えにくい時も、星は空にあります。小さな光を信じて。','A light of hope shines. Keep your wish close.','Even when hope is hard to see, the stars remain. Trust small lights.','希望・癒し','Hope · Healing'],
 ['月','The Moon','見えないものに不安を感じる時。想像より現実は穏やかです。','霧が晴れ始めます。少しずつ本当の姿が見えてきます。','Uncertainty may unsettle you; reality is gentler than imagined.','The fog begins to lift. The truth is coming into view.','不安・直感','Dreams · Intuition'],

 ['審判','Judgement','目覚めと復活の時。過去の努力が呼び覚まされます。','自分を責めすぎないで。もう一度やり直すチャンスはあります。','A time of awakening. Past efforts are called back to life.','Don\'t judge yourself too harshly. There is another chance.','復活・覚醒','Rebirth · Calling'],

       <path d="M${x - ex} ${ey - r * .14} L${x - ex} ${ey + r * .1} M${x + ex} ${ey - r * .14} L${x + ex} ${ey + r * .1}" stroke="${BG}" stroke-width="${r * (eye === 'sly' ? .05 : .09)}"/>`;
  return `<g transform="rotate(${rot} ${x} ${y})" stroke="${INK}" stroke-linecap="round" stroke-linejoin="round">
    <path d="M${x - r * .95} ${y - r * .1} L${x - r * .82} ${y - r * 1.35} Q${x - r * .55} ${y - r * 1.05} ${x - r * .25} ${y - r * .92}

    ${eyes}

let AC = null, master = null;
function ac(){
  if (!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
    const cv = AC.createConvolver(), len = AC.sampleRate * 2.2, ir = AC.createBuffer(2, len, AC.sampleRate);
    for (let c = 0; c < 2; c++){ const ch = ir.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    cv.buffer = ir; const w = AC.createGain(); w.gain.value = .3; master.connect(cv); cv.connect(w); w.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume(); return AC;
}
function tone(f, t, d, v, type = 'sine'){ const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05); }
function noise(t, d, v, f){ const len = Math.max(1, Math.floor(AC.sampleRate * d)), b = AC.createBuffer(1, len, AC.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len); const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = b; fl.type = 'highpass'; fl.frequency.value = f; g.gain.value = v; s.connect(fl); fl.connect(g); g.connect(master); s.start(t); }
function sfx(k){
  if (!D.sound || !AC) return;
  try { const t = AC.currentTime;
    if (k === 'riffle') for (let i = 0; i < 20; i++) noise(t + i * .022, .02, .06 + Math.random() * .05, 2600 + Math.random() * 2000);
    else if (k === 'slide') noise(t, .12, .08, 1800);
    else if (k === 'flip'){ noise(t, .05, .1, 3600); tone(880, t, .6, .015); }
    else if (k === 'pick') tone(659.25, t, .7, .02);
    else if (k === 'chime') [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * .18, 2.2, .022));
  } catch(e){}
}

function skySize(){ sky.width = innerWidth; sky.height = innerHeight; stars = Array.from({ length: 160 }, () => ({ x: rnd() * innerWidth, y: rnd() * innerHeight, r: .4 + rnd() * 1.2, p: rnd() * 6, s: .2 + rnd() * .4 })); }
function skyLoop(t){
  sx.clearRect(0, 0, sky.width, sky.height);
  const gr = sx.createRadialGradient(sky.width / 2, -100, 50, sky.width / 2, 0, sky.height); gr.addColorStop(0, '#0d1a36'); gr.addColorStop(1, '#05050f'); sx.fillStyle = gr; sx.fillRect(0, 0, sky.width, sky.height);
  stars.forEach(s => { const a = .35 + .3 * Math.sin(t / 1000 * s.s + s.p); sx.fillStyle = `rgba(210,255,215,${a})`; sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 7); sx.fill(); });
  requestAnimationFrame(skyLoop);
}

const table = $('table'), board = $('board');
let phase = 'idle', deck = [], fan = [], picks = [], cursor = 0;
function buildBoard(){
  const sp = SPREADS[D.sp], L = D.lang === 'ja' ? sp.ja : sp.en;
  board.replaceChildren(); board.style.width = sp.w + 'px'; board.style.height = (sp.h + 26) + 'px';
  sp.pos.forEach(([x, y, cr], k) => {
    const s = H('div', 'slot' + (cr ? ' cross' : '')); s.id = 'sl' + k; s.style.left = x + 'px'; s.style.top = (y + 22) + 'px';
    s.append(H('div', 'lb', L[k])); if (D.sp === 10) s.append(H('div', 'no', k + 1)); board.append(s);
  });
  fitBoard();
}
function fitBoard(){
  const sp = SPREADS[D.sp], avail = Math.min(1060, innerWidth - 40), sc = Math.min(1, avail / sp.w);
  board.style.transform = `scale(${sc})`; board.style.marginBottom = (-(sp.h + 26) * (1 - sc)) + 'px';
}
function layFan(){
  const N = fan.length, W = table.clientWidth, spreadDeg = Math.min(62, 40 + W / 30);
  fan.forEach((el, k) => {
    const a = N > 1 ? -spreadDeg / 2 + spreadDeg * k / (N - 1) : 0;
    el.style.setProperty('--t', `rotate(${a.toFixed(2)}deg)`);
  });
}
async function shuffle(){
  if (phase !== 'idle' && phase !== 'done') return;
  try { ac(); } catch(e){}
  phase = 'cut'; ui();
  picks = []; $('results').replaceChildren(); buildBoard();
  table.querySelectorAll('.card').forEach(c => c.remove());
  deck = Array.from({ length: 22 }, (_, i) => i); for (let i = 21; i > 0; i--){ const j = ri(i + 1); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  fan = deck.map(i => { const el = cardEl(i); el.style.setProperty('--t', 'rotate(0deg)'); table.append(el); return el; });
  // 切る：左右に分けて重ねる（リフル）を 3 回
  for (let r = 0; r < 3; r++){
    sfx('riffle');
    await Promise.all(fan.map((el, k) => el.animate([
      { transform: 'rotate(0deg)' },
      { transform: `translateX(${k % 2 ? 90 : -90}px) translateY(-30px) rotate(${k % 2 ? 6 : -6}deg)`, offset: .45 },
      { transform: `translateX(${(rnd() - .5) * 8}px) rotate(${(rnd() - .5) * 4}deg)` }
    ], { duration: 640, delay: k * 6, easing: 'cubic-bezier(.45,.05,.3,1)' }).finished));
  }
  // 扇状に広げる
  sfx('slide'); layFan();
  await sleep(600);
  fan.forEach((el, k) => { el.classList.add('pick'); el.onclick = () => take(k); el.onmouseenter = () => setCur(k); });
  phase = 'choose'; setCur(Math.floor(fan.length / 2)); ui();
}
function avail(){ return fan.map((el, k) => el._taken ? -1 : k).filter(k => k >= 0); }
function setCur(k){
  if (phase !== 'choose') return; const av = avail(); if (!av.length) return;
  if (!av.includes(k)) k = av.reduce((b, x) => Math.abs(x - k) < Math.abs(b - k) ? x : b, av[0]);
  cursor = k; fan.forEach((el, x) => el.classList.toggle('cur', x === k));
}
function move(d){ const av = avail(); let i = av.indexOf(cursor); i = (i + d + av.length) % av.length; setCur(av[i]); }
async function take(k){
  if (phase !== 'choose' || fan[k]._taken) return;
  const src = fan[k], idx = picks.length, i = src._i, rev = D.rev && rnd() < .35;
  src._taken = true; src.classList.remove('cur', 'pick'); picks.push({ i, rev });
  sfx('pick');
  const slot = $('sl' + idx), real = cardEl(i, { big: true, rev });
  slot.append(real);
  // 飛ばす（平面のクローンで移動 → 実物を表示）
  const a = src.getBoundingClientRect(), b = slot.getBoundingClientRect();
  const fly = cardEl(i); fly.classList.add('fly'); fly.style.left = a.left + 'px'; fly.style.top = a.top + 'px'; document.body.append(fly);
  real.style.visibility = 'hidden'; src.classList.add('taken');
  const cross = slot.classList.contains('cross');
  if (picks.length >= D.sp){ phase = 'reveal'; ui(); } else { move(1); ui(); }
  const sc = b.width / a.width;
  await fly.animate([{ transform: 'none' }, { transform: `translate(${b.left + b.width / 2 - a.left - a.width / 2}px,${b.top + b.height / 2 - a.top - a.height / 2}px) rotate(${cross ? 90 : 0}deg) scale(${cross ? b.height / a.width : sc})` }],
    { duration: 700, easing: EASE, fill: 'forwards' }).finished;
  fly.remove(); real.style.visibility = ''; sfx('slide');
  if (picks.length >= D.sp && idx === D.sp - 1) reveal();
}
async function auto(){
  if (phase === 'idle' || phase === 'done') await shuffle();
  while (phase === 'choose'){ const av = avail(); setCur(av[ri(av.length)]); await sleep(360); await take(cursor); await sleep(160); }
}
async function reveal(){
  await sleep(500);
  for (let k = 0; k < picks.length; k++){
    const s = $('sl' + k), el = s.querySelector('.card');
    el.classList.remove('down'); s.classList.add('glow'); sfx('flip');
    const p = picks[k];
    if (!D.got[p.i]){ D.got[p.i] = 0; toast(T('newC') + cName(p.i)); }
    D.got[p.i]++;
    addResult(k, p);
    await sleep(D.sp === 10 ? 650 : 1000);
  }
  summary(); sfx('chime');
  D.draws++; D.hist.unshift({ d: new Date().toISOString().slice(0, 16).replace('T', ' '), sp: D.sp, c: picks.map(p => [p.i, p.rev ? 1 : 0]), q: $('qin').value.trim() });

  phase = 'done'; ui();
}
function addResult(k, p){
  const sp = SPREADS[D.sp], L = D.lang === 'ja' ? sp.ja : sp.en, r = H('div', 'rs');
  r.innerHTML = `<div class="p">${k + 1}. ${esc(L[k])}<b>${esc(cName(p.i))}</b><i class="${p.rev ? 'rv' : 'up'}">${p.rev ? T('rv') : T('up')}</i></div><div><div class="k">${ROMAN[p.i]} · ${esc(cKey(p.i))}</div><div class="m">${esc(cMean(p.i, p.rev))}</div></div>`;
  $('results').append(r);
}
function summary(){
  const n = picks.length, rv = picks.filter(p => p.rev).length, q = $('qin').value.trim();
  let t = q ? T('q2', esc(q)) + '<br>' : '';
  t += rv === 0 || rv / n < .34 ? T('sumUp') : rv / n > .66 ? T('sumRv') : T('sumMix');
  const key = D.sp === 3 ? picks[1] : picks[0];
  if (D.sp > 1) t += '<br>' + T('key', esc(cName(key.i)), esc(cMean(key.i, key.rev)));
  if (D.sp > 1){ const last = picks[n - 1]; t += '<br>' + T('final', esc(cName(last.i))); }
  const s = H('div', 'summary'); s.innerHTML = `<h3>${T('sumT')}</h3>${t}`;
  $('results').prepend(s);
  setTimeout(() => s.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 200);
}

/* ================= GUIDE ================= */
const GUIDE = {
  ja: { title:'📜 タロット占いの手引き', close:'はじめる', no:'次回から自動で表示しない', tabs:['タロットとは','占い方','正位置と逆位置','引き方','22 枚の意味','怖いカード？','操作'],
  pages:[
`<h4>🔮 タロットとは</h4>
タロットは 78 枚のカードを使う占いで、15 世紀ごろのヨーロッパでカードゲームとして生まれ、のちに占いに使われるようになったと言われています。そのうち特に大切な <b>22 枚の「大アルカナ」</b>が、この占いで使うカードです。

<div class="note">※ この占いの図柄と解釈は MeridiPlay オリジナルです（伝統的なカードの絵柄を写したものではありません）。娯楽としてお楽しみください。</div>`,

<tr><td>3 根底</td><td>問題の奥にあるもの</td></tr><tr><td>4 過去</td><td>過ぎ去りつつある影響</td></tr>
<tr><td>5 目標</td><td>意識していること、目指すもの</td></tr><tr><td>6 近い未来</td><td>これから訪れること</td></tr>
<tr><td>7 自分自身</td><td>あなたの姿勢</td></tr><tr><td>8 周囲</td><td>まわりの人や環境</td></tr>
<tr><td>9 願いと不安</td><td>期待と心配は表裏一体</td></tr><tr><td>10 結末</td><td>このまま進んだときの行き先</td></tr>
</table>`,
`<h4>🃏 22 枚のキーワード</h4>
<table class="gtbl">
${C.map((c, i) => `<tr><td>${ROMAN[i]}</td><td><b>${c[0]}</b></td><td>${c[6]}</td></tr>`).join('')}
</table>
<div class="note">番号は「愚者（0）」から「世界（21）」までの旅の物語になっています。くわしい意味は「📖 カード図鑑」でいつでも読めます。</div>`,
`<h4>💀 怖そうなカードについて</h4>
「死神」「塔」「悪魔」は名前が怖いですが、<b>不吉な予言ではありません</b>。
<table class="gtbl">
<tr><td><b>死神</b></td><td>終わりと再生。古いものを手放すと新しいものが芽吹く</td></tr>
<tr><td><b>塔</b></td><td>突然の変化が、凝り固まったものを壊してくれる。再建のチャンス</td></tr>
<tr><td><b>悪魔</b></td><td>手放せない何かへの気づき。気づいた時点で自由への一歩</td></tr>
</table>
<div class="note">この占いでは、どのカードも前向きな助言として読めるように書いています。</div>`,

<tr><td><b>R</b></td><td>逆位置 あり ⇔ なし</td></tr>

<tr><td><b>G</b> または <b>?</b></td><td>この手引き</td></tr><tr><td><b>Esc</b></td><td>閉じる</td></tr>
</table>
<div class="note">🥚 隠しコマンドもあります……。</div>`]},
  en: { title:'📜 Tarot Guide', close:'Begin', no:"Don't show this automatically again", tabs:['What is tarot?','How to read','Upright & reversed','Spreads','The 22 cards','Scary cards?','Controls'],
  pages:[
`<h4>🔮 What is tarot?</h4>Tarot uses a deck of 78 cards. It is said to have begun as a card game in 15th-century Europe and later became a tool for divination. This app uses the most important <b>22 cards, the Major Arcana</b>.
<h4>A mirror, not a prophecy</h4>Tarot does not decide your fate. The images and meanings help you <b>reflect on your feelings and situation</b>. How you take a card is up to you.
<div class="note">Artwork and interpretations are original to MeridiPlay. For entertainment.</div>`,
`<h4>🙏 Four steps</h4><ol><li><b>Choose a question</b> — the more specific, the clearer.</li><li><b>Shuffle</b> — the cards fan out.</li><li><b>Pick by intuition</b>, or press "Pick for me".</li><li><b>Read</b> each position and the overall message.</li></ol>
<div class="note">Asking the same question again and again is said to blur the answer. Once per question is a good rule.</div>`,
`<h4>↕ Upright & reversed</h4><table class="gtbl"><tr><td>Upright</td><td>The card's meaning appears directly</td></tr><tr><td>Reversed</td><td>The meaning is overdone, lacking, or resting — <b>a point to re-balance, not a bad omen</b></td></tr></table>
<div class="note">Beginners can turn reversals off in the header.</div>`,
`<h4>🂠 Spreads</h4><table class="gtbl"><tr><td><b>One card</b></td><td>Daily advice</td></tr><tr><td><b>Three cards</b></td><td>Past · Present · Future</td></tr><tr><td><b>Celtic Cross</b></td><td>10 cards for deep questions</td></tr></table>
<h4>Celtic Cross positions</h4><table class="gtbl">${SPREADS[10].en.map((n, i) => `<tr><td>${i + 1}</td><td>${n}</td></tr>`).join('')}</table>`,
`<h4>🃏 Keywords</h4><table class="gtbl">${C.map((c, i) => `<tr><td>${ROMAN[i]}</td><td><b>${c[1]}</b></td><td>${c[7]}</td></tr>`).join('')}</table>
<div class="note">From The Fool (0) to The World (21), the cards tell the story of a journey.</div>`,
`<h4>💀 About the "scary" cards</h4><table class="gtbl"><tr><td><b>Death</b></td><td>Endings and rebirth</td></tr><tr><td><b>The Tower</b></td><td>Sudden change that breaks what was stuck</td></tr><tr><td><b>The Devil</b></td><td>Noticing what holds you — the first step to freedom</td></tr></table>
<div class="note">Every card here is written as positive advice.</div>`,
`<h4>⌨️ Controls</h4><table class="gtbl"><tr><td><b>Space</b></td><td>Shuffle / pick for me</td></tr><tr><td><b>← →</b></td><td>Choose</td></tr><tr><td><b>Enter</b></td><td>Take</td></tr><tr><td><b>1 / 3 / 0</b></td><td>Spread</td></tr><tr><td><b>R</b></td><td>Reversals</td></tr><tr><td><b>B</b></td><td>Card book</td></tr><tr><td><b>G</b> / <b>?</b></td><td>Guide</td></tr><tr><td><b>Esc</b></td><td>Close</td></tr></table>
<div class="note">🥚 There are hidden commands, too…</div>`]}
};
let gp = 0;
function renderGuide(){
  const G = GUIDE[D.lang];
  $('gT').textContent = G.title; $('gClose').textContent = G.close; $('gNoL').textContent = G.no; $('gNo').checked = !!D.noGuide;
  const tb = $('gTabs'); tb.replaceChildren();
  G.tabs.forEach((n, i) => { const b = H('button', 'tg' + (i === gp ? ' on' : ''), n); b.onclick = () => { gp = i; renderGuide(); }; tb.append(b); });
  $('gBody').innerHTML = `<div class="gpage">${G.pages[gp]}</div>`;
  $('gPrev').disabled = gp === 0; $('gNext').disabled = gp === G.pages.length - 1;
}
const openGuide = () => { gp = 0; renderGuide(); $('guide').classList.add('show'); };
const closeGuide = () => { $('guide').classList.remove('show'); D.noGuide = $('gNo').checked; save(); };

/* ================= BOOK ================= */
function openBook(){
  const n = Object.keys(D.got).length;
  $('bkT').textContent = T('bkT'); $('bkP').textContent = T('bkP', n, D.draws); $('bkReset').textContent = T('reset');
  const b = $('book'); b.replaceChildren(); $('bdet').textContent = '';
  C.forEach((c, i) => {
    const got = D.got[i] != null, el = cardEl(i, { down: false }); if (!got) el.classList.add('lock');
    el.onclick = () => { $('bdet').innerHTML = got ? `<b>${ROMAN[i]} ${esc(cName(i))}</b>（${esc(cKey(i))}）×${D.got[i]}<br>【${T('up')}】${esc(cMean(i, 0))}<br>【${T('rv')}】${esc(cMean(i, 1))}` : T('lock'); };
    b.append(el);
  });
  const h = $('hist'); h.replaceChildren();
  D.hist.forEach(x => { const d = H('div'); d.innerHTML = `<em>${x.d}</em>${x.c.map(([i, r]) => esc(cName(i)) + (r ? '↓' : '')).join(' ・ ')}${x.q ? ' — ' + esc(x.q) : ''}`; h.append(d); });
  $('bookM').classList.add('show');
}

/* ================= UI ================= */
function toast(m){ const t = H('div', 'toast', m); $('toasts').append(t); setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 550); }, 3200); }
function ui(){
  const m = $('bMain'), a = $('bAuto'), free = phase === 'idle' || phase === 'done';
  m.textContent = phase === 'done' ? T('again') : T('cut'); m.disabled = !free;
  a.textContent = T('auto'); a.disabled = !(free || phase === 'choose');
  ['tSp1', 'tSp3', 'tSp10'].forEach(id => $(id).disabled = !free);
  $('msg').textContent = phase === 'idle' ? T('idle') : phase === 'cut' ? T('cutting') : phase === 'choose' ? T('choose', D.sp - picks.length) : phase === 'reveal' ? T('reading') : '';
}
function apply(){
  document.documentElement.lang = D.lang;
  $('bT').textContent = T('title');
  $('tLang').textContent = D.lang === 'ja' ? '🌐 EN' : '🌐 日本語';
  $('tSound').textContent = D.sound ? '🔊' : '🔇'; $('tSound').classList.toggle('on', D.sound);
  [['tSp1', 1], ['tSp3', 3], ['tSp10', 10]].forEach(([id, n]) => { $(id).textContent = T('sp' + n); $(id).classList.toggle('on', D.sp === n); });
  $('tRev').textContent = T('rev', D.rev); $('tRev').classList.toggle('on', D.rev);
  $('tBook').textContent = T('book'); $('tGuide').textContent = T('guide');
  $('tPal').textContent = '🎨 ' + (PALS[D.pal] || PALS.matrix)[D.lang];
  $('qin').placeholder = T('q'); $('hint').textContent = T('hint'); $('disc').textContent = T('disc');
  if ($('guide').classList.contains('show')) renderGuide();
  ui(); save();
}
function setSpread(n){
  if (!(phase === 'idle' || phase === 'done')) return;
  D.sp = n; phase = 'idle'; picks = []; $('results').replaceChildren(); table.querySelectorAll('.card').forEach(c => c.remove()); buildBoard(); idleDeck(); apply();
}
function idleDeck(){ table.querySelectorAll('.card').forEach(c => c.remove()); for (let k = 0; k < 7; k++){ const el = cardEl(0); el.style.setProperty('--t', `rotate(${(k - 3) * 2}deg) translateY(${-k}px)`); table.append(el); } }

/* ================= EVENTS ================= */
$('bMain').onclick = shuffle;
$('bAuto').onclick = () => { try { ac(); } catch(e){} auto(); };
$('tLang').onclick = () => { D.lang = D.lang === 'ja' ? 'en' : 'ja'; apply(); refreshArt(); if (phase === 'idle' || phase === 'done'){ const keep = phase === 'done' ? picks.slice() : null; buildBoard(); $('results').replaceChildren(); if (keep){ keep.forEach((p, k) => { const el = cardEl(p.i, { big: true, rev: p.rev, down: false }); $('sl' + k).append(el); $('sl' + k).classList.add('glow'); addResult(k, p); }); summary(); } } };
$('tSound').onclick = () => { D.sound = !D.sound; try { ac(); } catch(e){} apply(); sfx('pick'); };
$('tSp1').onclick = () => setSpread(1); $('tSp3').onclick = () => setSpread(3); $('tSp10').onclick = () => setSpread(10);
$('tRev').onclick = () => { D.rev = !D.rev; apply(); };
$('tPal').onclick = () => { const k = Object.keys(PALS); D.pal = k[(k.indexOf(D.pal) + 1) % k.length]; refreshArt(); apply(); };
$('tBook').onclick = openBook; $('tGuide').onclick = openGuide;
$('gClose').onclick = closeGuide;
$('gPrev').onclick = () => { if (gp > 0){ gp--; renderGuide(); } };
$('gNext').onclick = () => { if (gp < GUIDE[D.lang].pages.length - 1){ gp++; renderGuide(); } };
$('guide').onclick = e => { if (e.target.id === 'guide') closeGuide(); };
$('bkClose').onclick = () => $('bookM').classList.remove('show');
$('bookM').onclick = e => { if (e.target.id === 'bookM') $('bookM').classList.remove('show'); };
$('bkReset').onclick = () => { if (!confirm(T('confirm'))) return; D.got = {}; D.hist = []; D.draws = 0; save(); openBook(); };
$('qin').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); $('qin').blur(); shuffle(); } });
const KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
let buf = [];
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ($('guide').classList.contains('show')){ if (k === 'escape' || k === 'enter'){ e.preventDefault(); closeGuide(); } else if (k === 'arrowright') $('gNext').click(); else if (k === 'arrowleft') $('gPrev').click(); return; }
  if ($('bookM').classList.contains('show')){ if (k === 'escape') $('bookM').classList.remove('show'); return; }
  buf.push(k); if (buf.length > 12) buf.shift();
  const word = buf.filter(x => x.length === 1).join('');
  if (buf.slice(-10).join() === KONAMI.join()){ buf = []; document.body.classList.toggle('gold'); toast(T('gold')); return; }
  if (word.endsWith('meridi')){ buf = []; toast(T('meridi')); return; }
  if (phase === 'choose'){
    if (k === 'arrowleft'){ e.preventDefault(); move(-1); return; }
    if (k === 'arrowright'){ e.preventDefault(); move(1); return; }
    if (k === 'enter'){ e.preventDefault(); take(cursor); return; }
  }
  if (e.repeat) return;
  if (k === ' '){ e.preventDefault(); try { ac(); } catch(err){} if (phase === 'idle' || phase === 'done') shuffle(); else if (phase === 'choose') auto(); }
  else if (k === 'enter' && (phase === 'idle' || phase === 'done')){ try { ac(); } catch(err){} shuffle(); }
  else if (k === '1') setSpread(1); else if (k === '3') setSpread(3); else if (k === '0') setSpread(10);
  else if (k === 'r') $('tRev').click(); else if (k === 'b') openBook(); else if (k === 'g' || k === '?') openGuide();
});
window.addEventListener('resize', () => { skySize(); fitBoard(); if (phase === 'choose') layFan(); });

/* ================= INIT ================= */
applyPal(); skySize(); requestAnimationFrame(skyLoop);
buildBoard(); idleDeck(); apply();
if (!D.noGuide) setTimeout(openGuide, 400);
})();
</script>
