    const list = GAMES.filter(g => g.c === c.id && (!qq || [g.ja, g.en, g.dj, g.de, g.id].join(' ').toLowerCase().includes(qq)));
    if (!list.length) return;
    const s = document.createElement('section');
    s.innerHTML = `<h2>${c.ic} ${c[lang]}<small>${list.length}</small></h2><div class="lead">${lang === 'ja' ? c.lj : c.le}</div><div class="grid"></div>`;
    const grid = s.querySelector('.grid');
    list.forEach(g => {
      const a = document.createElement('a'); a.className = 'card'; a.href = `./${g.id}/`; a.style.animationDelay = (k++ * 35) + 'ms';
      a.innerHTML = `${g.n ? '<span class="new">NEW</span>' : ''}<span class="ic">${g.ic}</span><b>${g[lang]}</b><p>${lang === 'ja' ? g.dj : g.de}</p><div class="meta">${(g.t || []).map(x => `<span>${x === '1' ? '👤 1' : x.includes('〜') ? '👥 ' + x : x}</span>`).join('')}</div><span class="go">${T('play')}</span>`;
      grid.append(a); shown++;
    });
    main.append(s);
  });
  $('empty').style.display = shown ? 'none' : 'block';
}
$('tLang').onclick = () => { lang = lang === 'ja' ? 'en' : 'ja'; lsSet('meridiplay_lang', lang); render(); };
$('tTheme').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; lsSet('meridiplay_theme', theme); render(); };
$('q').addEventListener('input', e => { q = e.target.value; render(); });

let toastT = null;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
const KON = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a']; let kb = [];
document.addEventListener('keydown', e => {
  if (e.target === $('q')) return;
  kb.push(e.key.toLowerCase()); if (kb.length > 10) kb.shift();
  if (kb.join() === KON.join()){ kb = []; const g = GAMES[Math.floor(Math.random() * GAMES.length)]; toast(`🐾 ${lang === 'ja' ? '猫のおすすめ' : 'The cats suggest'}: ${g.ic} ${g[lang]}`); setTimeout(() => location.href = `./${g.id}/`, 1600); }
  if (kb.slice(-3).join('') === 'neo'){ theme = 'dark'; lsSet('meridiplay_theme', theme); render(); toast('🟩 Wake up, Neo… follow the white cat.'); }
});
render();
})();
</script>
