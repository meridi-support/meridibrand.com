function extraApply(){
  $('tShare').textContent = J() ? '🔗 共有' : '🔗 Share'; $('tShare').title = J() ? '今の計算を URL にしてコピー' : 'Copy a link to this calculation';
  $('tPrint').textContent = J() ? '🖨 印刷' : '🖨 Print';
  $('dEx').textContent = J() ? '🔰 例（L 字の部屋）' : '🔰 Example (L-shaped room)';
  if (D.tab === 'shape'){
    ex('shCard', () => { const sh = SH.find(x => x.id === D.sh); sh.f.forEach(([k]) => setv(`#shCard input[data-k="${k}"]`, sh.id === 'pipe' ? { R:'0.05', r:'0.04', h:'2' }[k] : SHEX[k])); });
    ex('triCard', () => { ['A', 'B', 'C'].forEach(k => setv(`#triCard input[data-t="${k}"]`, '')); setv('#triCard input[data-t="a"]', '3'); setv('#triCard input[data-t="b"]', '4'); setv('#triCard input[data-t="c"]', '5'); });
    ex('slCard', () => setv('#slCard input[data-l="sun"]', '4'));
  }
  if (D.tab === 'num'){
    ex('calcCard', () => setv('#cIn', 'sin(30)+2^3'));
    ex('baseCard', () => setv('#baseCard input[data-b="10"]', '255'));
    ex('ratioCard', () => { setv('#ratioCard [data-r="ra"]', '2'); setv('#ratioCard [data-r="rb"]', '3'); setv('#ratioCard [data-r="rc"]', '10'); setv('#ratioCard [data-p="b"]', '1000'); setv('#ratioCard [data-p="p"]', '15'); });
    ex('scaleCard', () => setv('#scP', '25'));
    ex('dateCard', () => $('dateCard')._def());
  }
  if (D.tab === 'site'){
    ex('priceCard', () => { setv('#prT', '1000000'); setv('#prA', '100'); });
    ex('woodCard', () => { setv('#woodCard [data-w="w"]', '105'); setv('#woodCard [data-w="t"]', '105'); setv('#woodCard [data-w="l"]', '3000'); setv('#woodCard [data-w="n"]', '20'); });
    ex('concCard', () => { setv('#concCard [data-c="a"]', '3'); setv('#concCard [data-c="b"]', '4'); setv('#concCard [data-c="t"]', '0.1'); setv('#concCard [data-c="x"]', '5'); });
    ex('tileCard', () => { setv('#tileCard [data-t="a"]', '10'); setv('#tileCard [data-t="w"]', '300'); setv('#tileCard [data-t="h"]', '300'); setv('#tileCard [data-t="x"]', '10'); });
    ['stairCard', 'elecCard', 'paintCard'].forEach(id => ex(id, () => $(id)._def()));
  }
}
$('dEx').onclick = () => { DR.mode = 'poly'; renderMode(); DR.circ = null; DR.pts = [[2,2],[8,2],[8,6],[5,6],[5,9],[2,9]].map(([x, y]) => ({ x, y })); DR.closed = true; D.cell = 1; save(); $('dCell').value = '1'; $('dThick').value = '2.4'; fitView(); dCalc(); toast(J() ? '🔰 L 字の部屋（天井 2.4m）を描きました' : '🔰 Drew an L-shaped room (2.4 m ceiling)'); };

/* ---- 🔗 共有と 🖨 印刷 ---- */
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = t => JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g, '+').replace(/_/g, '/')))));
$('tShare').onclick = () => {
  const st = { tab:D.tab };
  if (D.tab === 'conv'){ st.c = D.cat; st.s = D.sel[D.cat]; st.v = $('val').value; }
  if (D.tab === 'draw') st.d = { m:DR.mode, p:DR.pts.map(q => [+q.x.toFixed(3), +q.y.toFixed(3)]), k:DR.closed ? 1 : 0, c:DR.circ && DR.circ.done ? [+DR.circ.c.x.toFixed(3), +DR.circ.c.y.toFixed(3), +DR.circ.r.toFixed(4)] : null, cell:D.cell, t:$('dThick').value };
  if (D.tab === 'shape'){ st.sh = D.sh; st.su = D.su; st.sv = D.sv[D.sh] || {}; st.tri = D.tri; st.sl = D.sl; }
  const url = location.origin + location.pathname + '#s=' + b64e(st);
  try { navigator.clipboard.writeText(url).then(() => toast(J() ? '🔗 リンクをコピーしました' : '🔗 Link copied'), () => prompt('URL', url)); } catch(e){ prompt('URL', url); }
};
let prTheme = null;
$('tPrint').onclick = () => window.print();
addEventListener('beforeprint', () => { prTheme = D.theme; if (D.theme !== 'light'){ D.theme = 'light'; document.body.classList.add('light'); dDraw(); } });
addEventListener('afterprint', () => { if (prTheme && prTheme !== 'light'){ D.theme = prTheme; document.body.classList.remove('light'); dDraw(); } prTheme = null; });
let shareThick = null;
if (location.hash.startsWith('#s=')){
  try {
    const st = b64d(location.hash.slice(3));
    if (st.tab) D.tab = st.tab;
    if (st.c){ D.cat = st.c; if (st.s) D.sel[st.c] = st.s; if (st.v != null){ D.v = st.v; $('val').value = st.v; } }
    if (st.d){ DR.mode = st.d.m || 'poly'; DR.pts = (st.d.p || []).map(([x, y]) => ({ x, y })); DR.closed = !!st.d.k; DR.circ = st.d.c ? { c:{ x:st.d.c[0], y:st.d.c[1] }, r:st.d.c[2], done:true } : null; if (st.d.cell) D.cell = st.d.cell; shareThick = st.d.t || ''; }
    if (st.sh){ D.sh = st.sh; D.su = st.su || D.su; D.sv[st.sh] = st.sv || {}; if (st.tri) D.tri = st.tri; if (st.sl) D.sl = st.sl; }
  } catch(e){}
}

apply();
if (shareThick != null){ $('dThick').value = shareThick; fitView(); dCalc(); }
})();
</script>
