}

}

function mkCard(id, title, F, comp, note){

  const go = () => { const v = {}; F.forEach(f => { const i = c.querySelector(`[data-f="${f[0]}"]`); v[f[0]] = f[5] === 'date' ? i.value : calc(i.value); }); c.querySelector('.out').innerHTML = comp(v) || ''; };
  c.querySelectorAll('input').forEach(i => i.addEventListener('input', go));
  c._def = () => { F.forEach(f => { c.querySelector(`[data-f="${f[0]}"]`).value = f[4]; }); go(); };
  go();
}
