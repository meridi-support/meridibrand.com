<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const lsGet = k => { try { return window.localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { window.localStorage.setItem(k, v); } catch(e){} };
const LS = 'merididepths_v1';
let D = { lang:((navigator.language || 'ja').startsWith('ja') ? 'ja' : 'en'), theme:'dark', unit:'m', max:0, tod:'noon' };
try { const s = JSON.parse(lsGet(LS) || 'null'); if (s) D = Object.assign(D, s); } catch(e){}
try { const th = lsGet('meridiplay_theme'); if (th === 'light' || th === 'dark') D.theme = th; } catch(e){}
const save = () => lsSet(LS, JSON.stringify(D));
const J = () => D.lang === 'ja';

/* ================= 深さ ================= */

  [0, '光の届く層', 'Sunlight Zone', '表層 · Epipelagic', 'EPIPELAGIC'],
  [200, '薄明かりの層', 'Twilight Zone', '中深層 · Mesopelagic', 'MESOPELAGIC'],
  [1000, '真っ暗な層', 'Midnight Zone', '漸深層 · Bathypelagic', 'BATHYPELAGIC'],
  [4000, '深海層', 'Abyssal Zone', '深海層 · Abyssopelagic', 'ABYSSOPELAGIC'],
  [6000, '超深海層（海溝）', 'Hadal Zone', '超深海層 · Hadal', 'HADAL']
];
const CATS = { life:['🐟 生き物','🐟 Life'], human:['🤿 人の記録','🤿 Human records'], wreck:['⚓ 沈没船','⚓ Shipwrecks'], cmp:['📏 くらべる','📏 Compare'], sci:['🔬 海のしくみ','🔬 Ocean science'], rec:['🏆 海の記録','🏆 Ocean records'], hist:['📜 歴史と探検','📜 History & exploration'], why:['🔎 なぜ？','🔎 Why?'] };

/* [深さ, 分類, アイコン, 名前JA, 名前EN, 説明JA, 説明EN] — 数字はだいたいの値です */
const E = [
 [0,'sci','🌊','海面','Sea surface','地球の表面の約 7 割は海です。ここから、海でいちばん深い場所まで、約 11km 潜っていきます。','About 70% of Earth\'s surface is ocean. From here we descend roughly 11 km to the deepest point.'],
 [2,'life','🪼','ミズクラゲ','Moon jellyfish','海面近くを漂うクラゲ。体の 95% 以上が水でできています。','Drifts near the surface; its body is over 95% water.'],
 [6,'sci','🔴','赤い色が消えはじめる','Red fades first','水は赤い光から先に吸い込みます。数 m でくすみ、10m を過ぎるころには赤がほとんど見えなくなります。','Water absorbs red light first — by about 10 m, red has almost vanished.'],
 [8,'life','🐠','カクレクマノミ','Clownfish','イソギンチャクの中で暮らす魚。サンゴ礁の浅い海にすみます。','Lives among sea anemones in shallow coral reefs.'],
 [10,'sci','🫧','2 気圧','2 atmospheres','10m 潜るごとに約 1 気圧ずつ増えます。ここでは地上の 2 倍。海面でふくらませた風船は、半分の大きさになります。','Pressure rises about 1 atm every 10 m. Here it is double — a balloon shrinks to half its size.'],
 [15,'life','🐢','アオウミガメ','Green sea turtle','海草や海藻を食べるウミガメ。浅い海で、数十分潜っていられます。','A grazing turtle of shallow seas that can stay under for tens of minutes.'],
 [18,'human','🤿','入門ダイバーの目安','Beginner diver limit','初めてのダイビング講習では、18m までを目安にすることが多いです。','Entry-level scuba courses usually set 18 m as the limit.'],

1\\u3055\\u003cb id=\\\"vD\\\">\\u003c/b>\\u003c/label>\\n  \\u003cinput type=\\\"range\\\" id=\\\"D\\\" min=\\\"0\\\" max=\\\"100\\\" value=\\\"60\\\">\\n  \\u003clabel>\\u6ce1\\u306e\\u91cf\\u003cb id=\\\"vF\\\">\\u003c/b>\\u003c/label>\\n  \\u003cinput type=\\\"range\\\" id=\\\"F\\\" min=\\\"0\\\" max=\\\"100\\\" value=\\\"70\\\">\\n  \\u003clabel>\\u56de\\u308b\\u901f\\u3055\\u003cb id=\\\"vV\\\">\\u003c/b>\\u003c/label>\\n  \\u003cinput type=\\\"range\\\" id=\\\"V\\\" min=\\\"0\\\" max=\\\"100\\\" value=\\\"50\\\">\\n  \\u003cdiv class=\\\"row\\\">\\u003cbutton id=\\\"bWeak\\\">\\u5f31\\u3044\\u003c/button>\\u003cbutton id=\\\"bMid\\\">\\u4e2d\\u003c/button>\\u003cbutton id=\\\"bStrong\\\">\\u5f37\\u3044\\uff08\\u5927\\u6f6e\\uff09\\u003c/button>\\u003c/div>\\n\\u003c/div>\\n\\u003cscript>\\nconst cv=document.getElementById('c');\\nconst gl=cv.getContext('webgl',{antialias:false});\\nif(!gl){document.getElementById('msg').style.display='flex';throw 0;}\\nconst vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;\\nconst fs=`precision highp float;\\nuniform vec2 R;uniform float T,S,D,F;\\nfloat h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}\\nfloat n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);\\n return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),\\n            mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}\\nfloat fbm(vec3 p){float s=0.,a=.5;for(int i=0;i\\u003c5;i++){s+=a*n3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}\\nvoid main(){\\n vec2 q=(gl_FragCoord.xy-.5*R)/R.y; q.y*=1.3;\\n float r=length(q)+1e-4, th=atan(q.y,q.x);\\n float R0=.04+.08*S*D;                      // funnel radius\\n // 2-layer flow (cross-fade) so the pattern never winds into rings\\n float L=log(r+.03);\\n float om=(.35+1.2*S)/(r*3.+.4);\\n float band=.5+.5*sin(th*2.-L*3.+S*.9*L*2.);\\n float ring=exp(-pow((r-R0*1.5)/(.05+.05*S),2.));\\n float outer=exp(-pow((r-.27)/.22,2.));\\n float foam=0., n2s=0.;\\n for(int i=0;i\\u003c2;i++){\\n  float fi=float(i);\\n  float ph=fract(T*.12+fi*.5);\\n  float cyc=floor(T*.12+fi*.5);\\n  float w=1.-abs(2.*ph-1.);\\n  float tw=th - S*.9*L + ph*om*1.6;\\n  float Lf=L + ph*.35*(.4+S);\\n  vec3 sd=vec3(cyc*3.7+fi*11.,cyc*1.9,0.);\\n  vec3 P=vec3(cos(tw)*1.6,sin(tw)*1.6,Lf*2.2)+sd;\\n  vec3 P2=vec3(cos(tw)*5.,sin(tw)*5.,Lf*7.)+sd;\\n  float n1=fbm(P), n2=fbm(P2+n1*1.5), blob=fbm(P*.6+vec3(3.));\\n  float bnd=.5+.5*sin(tw*2.-L*3.);\\n  float fA=clamp((bnd*.55+n1*.8-.78)*3.2,0.,1.)*(.5+outer);\\n  float fB=clamp((blob-.48)*4.,0.,1.)*clamp((n2-.35)*2.,0.,1.)*(.4+outer);\\n  float fC=clamp((n2-.42)*3.,0.,1.)*ring*1.2;\\n  foam+=w*(fA+fB+fC); n2s+=w*n2;\\n }\\n foam=pow(clamp(foam*S*(.4+1.2*F),0.,1.),.85);\\n float n2=n2s;\\n // emerald water, deeper toward centre, soft caustic shimmer\\n float dep=clamp(1.-r/.6,0.,1.);\\n vec3 col=mix(vec3(.10,.52,.50),vec3(.03,.28,.29),dep);\\n col*=.82+.36*fbm(vec3(q*9.,T*.4));\\n // funnel bowl: one wall lit, one in shadow (no black hole)\\n float bowl=clamp(1.-r/R0,0.,1.); bowl=bowl*bowl*(3.-2.*bowl);\\n float side=.5+.5*cos(th+2.4);\\n col=mix(col,mix(vec3(.02,.17,.18),vec3(.16,.55,.52),side),bowl*.85);\\n // no rim line: depth shown by darkening toward the centre\\n float dd=exp(-pow(r/(R0*2.2+.02),2.))*D*S;\\n col*=1.-.45*dd;\\n // thin foam lets green show through\\n vec3 fc=vec3(.95,.99,.98);\\n col=mix(col,fc*(1.-.35*dd),foam);\\n col+=clamp((n2-.5)*3.,0.,1.)*clamp(foam*3.,0.,1.)*(1.-foam)*.25;\\n float vig=1.-.35*dot(q,q);\\n gl_FragColor=vec4(col*vig,1.);\\n}`;\\nfunction sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}\\nconst pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);\\nconst b=gl.createBuffer(
