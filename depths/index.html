<script>
(() => {
'use strict';

const lsGet = k => { try { return window.localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { window.localStorage.setItem(k, v); } catch(e){} };
const LS = 'merididepths_v1';
let D = { lang:((navigator.language || 'ja').startsWith('ja') ? 'ja' : 'en'), theme:'dark', unit:'m', max:0, tod:'noon' };
try { const s = JSON.parse(lsGet(LS) || 'null'); if (s) D = Object.assign(D, s); } catch(e){}

const J = () => D.lang === 'ja';

/* ================= 深さ ================= */

  [0, '光の届く層', 'Sunlight Zone', '表層 · Epipelagic', 'EPIPELAGIC'],

  [4000, '深海層', 'Abyssal Zone', '深海層 · Abyssopelagic', 'ABYSSOPELAGIC'],
  [6000, '超深海層（海溝）', 'Hadal Zone', '超深海層 · Hadal', 'HADAL']
];
const CATS = { life:['🐟 生き物','🐟 Life'], human:['🤿 人の記録','🤿 Human records'], wreck:['⚓ 沈没船','⚓ Shipwrecks'], cmp:['📏 くらべる','📏 Compare'], sci:['🔬 海のしくみ','🔬 Ocean science'], rec:['🏆 海の記録','🏆 Ocean records'], hist:['📜 歴史と探検','📜 History & exploration'], why:['🔎 なぜ？','🔎 Why?'] };

/* [深さ, 分類, アイコン, 名前JA, 名前EN, 説明JA, 説明EN] — 数字はだいたいの値です */
const E = [
 [0,'sci','🌊','海面','Sea surface','地球の表面の約 7 割は海です。ここから、海でいちばん深い場所まで、約 11km 潜っていきます。','About 70% of Earth\'s surface is ocean. From here we descend roughly 11 km to the deepest point.'],

 [6,'sci','🔴','赤い色が消えはじめる','Red fades first','水は赤い光から先に吸い込みます。数 m でくすみ、10m を過ぎるころには赤がほとんど見えなくなります。','Water absorbs red light first — by about 10 m, red has almost vanished.'],
 [8,'life','🐠','カクレクマノミ','Clownfish','イソギンチャクの中で暮らす魚。サンゴ礁の浅い海にすみます。','Lives among sea anemones in shallow coral reefs.'],

 [18,'human','🤿','入門ダイバーの目安','Beginner diver limit','初めてのダイビング講習では、18m までを目安にすることが多いです。','Entry-level scuba courses usually set 18 m as the limit.'],

  [200, 1000, 4000, 6000, DMAX].filter(d => d <= DMAX).filter((d, i, a) => a.indexOf(d) === i).forEach(d => { const top = Math.pow(d / DMAX, 1 / P) * 100; const u = document.createElement('u'); u.style.top = top + '%'; const em = document.createElement('em'); em.style.top = Math.min(96, top) + '%'; em.textContent = d === DMAX ? fmtD(d).replace(' ', '') : fmtD(d).replace(' ', ''); m.append(u, em); });
}
$('mini').addEventListener('click', e => { const r = $('mini').getBoundingClientRect(), k = (e.clientY - r.top) / r.height; goTo(DMAX * Math.pow(Math.min(1, Math.max(0, k)), P)); });
function buildJumps(){
  const box = $('jumps'); box.replaceChildren();
  [0, 200, 1000, 4000, 6000, DMAX].forEach((d, i) => { if (i < 5 && d >= DMAX) return; const b = document.createElement('button'); b.textContent = T('jumps')[i]; b.onclick = () => goTo(d); box.append(b); });
}

function buildLook(){
  const tb = $('todB'); tb.replaceChildren();
  ['morn', 'noon', 'dusk'].forEach(k => { const b = document.createElement('button'); b.className = 'hb' + (D.tod === k ? ' on' : ''); b.textContent = T('tod')[k]; b.title = T('todT')[k]; b.onclick = () => { D.tod = k; save(); buildLook(); toast(T('todT')[k]); }; tb.append(b); });
}
function buildTr(){
  const sel = $('trSel'); sel.replaceChildren();
  TRENCHES.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = `${J() ? t.sj : t.se} · ${fmtD(t.d)}`; sel.append(o); });
  sel.value = TR.id;
  const box = $('trs'); box.replaceChildren();
  TRENCHES.forEach(t => { const b = document.createElement('button'); b.className = t.id === TR.id ? 'on' : ''; b.innerHTML = `${J() ? t.sj : t.se}<small>${fmtD(t.d)}</small>`; b.onclick = () => chooseTr(t.id); box.append(b); });
}
function chooseTr(id){ if (id === TR.id) return; setTrench(id); D.trench = id; save(); apply(); toast(`🌊 ${J() ? TR.j : TR.e} · ${fmtD(DMAX)}`); }
$('trSel').addEventListener('change', e => chooseTr(e.target.value));

/* ================= ヌルヌル移動 ================= */
let anim = null;
function goTo(d, flash){
  const target = Math.max(0, yOf(d) - EYE() + (d === 0 ? 2 : 0)), from = scrollY, dist = target - from;
  const dur = Math.min(4200, 700 + Math.sqrt(Math.abs(dist)) * 14), st = performance.now();
  cancelAnimationFrame(anim);
  const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const step = now => { const k = Math.min(1, (now - st) / dur); scrollTo(0, from + dist * ease(k)); if (k < 1) anim = requestAnimationFrame(step); else if (flash){ flash.classList.add('flash'); setTimeout(() => flash.classList.remove('flash'), 1800); } };
  anim = requestAnimationFrame(step);
}
['wheel', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => cancelAnimationFrame(anim), { passive:true }));

/* ================= 図鑑 ================= */
let dcat = 'all';
function renderBook(){
  $('dT').textContent = T('book'); $('dq').placeholder = T('q');
  const ch = $('dChips'); ch.replaceChildren();
  [['all', T('all')], ...Object.entries(CATS).map(([k, v]) => [k, v[J() ? 0 : 1]])].forEach(([k, l]) => { const b = document.createElement('button'); b.textContent = l; b.className = dcat === k ? 'on' : ''; b.onclick = () => { dcat = k; renderBook(); }; ch.append(b); });
  const q = $('dq').value.trim().toLowerCase(), list = $('dList'); list.replaceChildren();
  const hit = E.map((e, i) => [e, i]).filter(([e]) => (dcat === 'all' || e[1] === dcat) && (!q || (e[3] + e[4] + e[5] + e[6]).toLowerCase().includes(q)));
  $('dCnt').textContent = T('cnt')(hit.length);
  hit.forEach(([e, i]) => { const d = document.createElement('div'); d.className = 'it'; d.innerHTML = `<span class="ic">${e[7] && e[7].a ? `<span style="display:inline-block;width:34px;height:21px">${art(...e[7].a)}</span>` : e[2]}</span><span>${J() ? e[3] : e[4]}</span><em>${fmtD(e[0])}</em>`; d.onclick = () => { if (innerWidth <= 760) $('drawer').classList.remove('show'); goTo(e[0], cards[i]); }; list.append(d); });
}
$('dq').addEventListener('input', renderBook);
$('tBook').onclick = () => { $('drawer').classList.toggle('show'); renderBook(); };
$('dClose').onclick = () => $('drawer').classList.remove('show');

/* ================= そのほか ================= */
let toastT = null;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
function apply(){
  document.documentElement.lang = D.lang;
  document.body.classList.toggle('light', D.theme === 'light');
  document.body.classList.toggle('neo', !!D.neo);
  $('tLang').textContent = J() ? '🌐 EN' : '🌐 日本語';
  $('tTheme').textContent = D.theme === 'light' ? (J() ? '🌙 ダーク' : '🌙 Dark') : (J() ? '☀️ ノーマル' : '☀️ Normal');
  $('tUnit').textContent = T('unitT')[D.unit]; $('hU').textContent = T('unitT')[D.unit];
  $('skyP').innerHTML = T('sky'); $('bGo').textContent = T('go'); $('hint').textContent = T('hint');
  $('lP').textContent = T('p'); $('lK').textContent = T('k'); $('lT').textContent = T('t'); $('lL').textContent = T('l');
  $('bT').textContent = (J() ? TR.j : TR.e).toUpperCase(); $('bMap').href = mapURL(TR); $('bMap').textContent = J() ? '📍 Google マップで場所を見る（だいたいの位置）' : '📍 See it on Google Maps (approx.)'; $('bP').innerHTML = T('bp')(); $('bUp').textContent = T('up'); $('coffeeP').innerHTML = T('coffee'); $('footP').textContent = T('foot');
  $('bStats').innerHTML = T('stats')().map(([a, b]) => `<div><b>${a}</b><small>${b}</small></div>`).join('');
  const keep = dOf(scrollY + EYE());
  buildCards(); observe(); buildMini(); buildJumps(); buildLook(); buildTr(); lastZone = '';
  if ($('drawer').classList.contains('show')) renderBook();
  if (keep > 0) scrollTo(0, yOf(Math.min(keep, DMAX)) - EYE());
}
$('tLang').onclick = () => { D.lang = J() ? 'en' : 'ja'; save(); apply(); };
$('tTheme').onclick = () => { D.theme = D.theme === 'light' ? 'dark' : 'light'; save(); lsSet('meridiplay_theme', D.theme); apply(); };
$('tUnit').onclick = () => { D.unit = D.unit === 'm' ? 'ft' : D.unit === 'ft' ? 'fm' : 'm'; save(); apply(); };
$('bGo').onclick = () => goTo(2);
$('bUp').onclick = () => goTo(0);
let rT = null;
addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { const keep = dOf(scrollY + EYE()); size(); seed(); layout(); if (keep > 0) scrollTo(0, yOf(keep) - EYE()); }, 150); });
const KON = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a']; let kb = [];
addEventListener('keydown', e => {
  if (e.target === $('dq')) return;
  const k = e.key.toLowerCase(); kb.push(k); if (kb.length > 10) kb.shift();
  if (kb.join() === KON.join()){ kb = []; toast(J() ? '🐾 三匹の猫が、潜水艇の窓からあなたを見送っています' : '🐾 Three cats wave from a submarine porthole'); return; }
  if (kb.slice(-3).join('') === 'neo'){ D.neo = !D.neo; save(); apply(); toast(D.neo ? '🟩 Wake up, Neo… the ocean is code.' : '🌊 Back to the blue.'); return; }
  if (k === 'b' && !e.ctrlKey && !e.metaKey){ $('tBook').click(); }
  else if (k === 'home'){ e.preventDefault(); goTo(0); }
  else if (k === 'end'){ e.preventDefault(); goTo(DMAX); }
  else if (k === 'escape'){ $('drawer').classList.remove('show'); }
});

size(); seed(); apply(); requestAnimationFrame(draw);
setTimeout(layout, 400);
})();
</script>
