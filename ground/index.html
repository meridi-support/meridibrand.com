function cardHTML(a, i){
  const [v, ic, nj, ne, mj, me, dj, de, tj, te] = a;
  return `<section class="sec" data-v="${v}" style="justify-content:${i % 2 ? 'flex-end' : 'flex-start'}"><div class="card"><div class="h">${v >= 0 ? '▲ ' : '▼ '}${J() ? mj : me}</div><h2><span class="ic">${ic}</span>${J() ? nj : ne}</h2><p>${J() ? dj : de}</p>${(J() ? tj : te) ? `<div class="tip">${J() ? tj : te}</div>` : ''}${nj === '東京タワーとエッフェル塔' ? mapA([['Tokyo Tower', t('東京タワー','Tokyo Tower')], ['Eiffel Tower', t('エッフェル塔','Eiffel Tower')]]) : MAPQ[nj] ? mapA(MAPQ[nj]) : ''}</div></section>`;
}

function homeSVG(){
  const B = [['🗼', 333, t('東京タワー', 'Tokyo Tower')], ['🗼', 634, t('スカイツリー', 'Skytree')], ['🏙', 828, t('ブルジュ・ハリファ', 'Burj Khalifa')]];
  const M = [['', 3776, t('富士山', 'Fuji')], ['', 5895, t('キリマンジャロ', 'Kilimanjaro')], ['', 8849, t('エベレスト', 'Everest')]];
  const H = 150, base = 190;
  const tower = (x, h, w) => `<path d="M${x - w / 2} ${base} L${x - w / 8} ${base - h} L${x + w / 8} ${base - h} L${x + w / 2} ${base} Z"/>`;
  let b = '', m = '';
  B.forEach(([, hh, nm], i) => { const x = 60 + i * 85, h = Math.max(2, hh / 828 * H);
    b += tower(x, h, i === 2 ? 22 : 18);
    b += `<text x="${x}" y="${base - h - 6}" text-anchor="middle">${nm} ${hh}m</text>`; });
  const mt = (x, h, w, kind) => kind === 3 ? `<path d="M${x - w} ${base} L${x - 12} ${base - h + 10} L${x - 4} ${base - h} L${x + 6} ${base - h + 8} L${x + w} ${base} Z"/>` : kind === 2 ? `<path d="M${x - w} ${base} L${x - 14} ${base - h} L${x + 14} ${base - h} L${x + w} ${base} Z"/>` : kind === 1 ? `<path d="M${x - w} ${base} Q${x - 18} ${base - h * .7} ${x - 6} ${base - h} L${x + 6} ${base - h} Q${x + 18} ${base - h * .7} ${x + w} ${base} Z"/>` : `<rect x="${x - 1}" y="${base - h}" width="2" height="${h}"/>`;
  M.forEach(([, hh, nm], i) => { const x = 470 + i * 110, h = Math.max(1.5, hh / 8849 * H);
    m += mt(x, h, 20 + h * .45, i + 1); m += `<text x="${x}" y="${base - h - 6}" text-anchor="middle">${nm} ${hh.toLocaleString()}m</text>`; });
  return `<svg viewBox="0 0 760 230" aria-hidden="true">

   <g font-family="sans-serif" font-size="10" fill="#e8f3ff">${''}</g>
   <g fill="#0d1a24" stroke="#9cc3e0" stroke-width="1" opacity=".85">${m}</g>

function showPlace(k){
  const q = PLACES.find(x => x.k === k); if (!q) return;
  document.querySelectorAll('#plist button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  document.querySelectorAll('#wsvg .pin').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  const box = $('pinfo'); box.classList.remove('in');
  setTimeout(() => {
    box.innerHTML = `<div class="xs">${xsSVG(q.type)}${q.steps ? `<div class="steps">${STEPS.map(([c, , l]) => `<div style="background:${c}">${l}</div>`).join('')}</div>` : ''}</div>
     <div><div class="kind">${J() ? q.kind[0] : q.kind[1]}</div><h3>${q.ic} ${J() ? q.n[0] : q.n[1]}</h3>
     <div class="facts">${q.f.map(([a, b, v]) => `<b>${J() ? a : b}</b><span>${v}</span>`).join('')}</div>
     <p>${J() ? q.d[0] : q.d[1]}</p><div class="tip">${J() ? q.tip[0] : q.tip[1]}</div>${PMAP[q.k] ? mapA(PMAP[q.k]) : ''}${q.k === 'cp' ? `<div class="chipline" style="margin-top:6px">${[['Zion Canyon Visitor Center',t('ザイオン','Zion')],['Bryce Canyon Visitor Center',t('ブライス','Bryce')],['Arches National Park Visitor Center',t('アーチーズ','Arches')],['Antelope Canyon',t('アンテロープ','Antelope')],['Sand Caves Kanab Utah',t('サンド・ケーブ','Sand Caves')]].map(([q2, n]) => `<a class="map" style="margin:0" href="${GM(q2)}" target="_blank" rel="noopener">📍 ${n}</a>`).join(' ・ ')}</div>` : ''}</div>`;
    box.classList.add('in');
  }, 180);
}
function initWorld(){
  if (!$('pinfo')) return;
  document.querySelectorAll('#plist button, #wsvg .pin').forEach(b => b.addEventListener('click', () => showPlace(b.dataset.k)));
  showPlace('jp'); initPlates();
  document.querySelectorAll('.toWorld').forEach(b => b.onclick = e => { e.preventDefault(); const w = $('world'); glide(w.offsetTop - 60); });
}
