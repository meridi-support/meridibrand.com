er winters, La Ni\u00f1a the reverse (tendencies, not rules).',\n '<b>\ud83c\udf0f Climate zones<\/b>: rainforests hug the equator; deserts line the 20\u201330\u00b0 subtropical highs. The rain belt follows the seasons, giving South & Southeast Asia a wet summer <b>monsoon<\/b>. Move \u201cSeason\u201d to shift the belts.',\n '<b>\ud83c\udf00 Tropical cyclones<\/b>: <b>typhoons<\/b> in the NW Pacific, <b>hurricanes<\/b> in the N Atlantic & NE Pacific, <b>cyclones<\/b> in the Indian Ocean & S Pacific. They spin <b>counterclockwise<\/b> in the north, <b>clockwise<\/b> in the south, and almost never form right at the equator, where the Coriolis effect vanishes.',\n '<b>\ud83d\udd04 Seasons N vs S<\/b>: Earth\\'s axis is tilted ~23.4\u00b0, so the latitude with the Sun overhead swings from 23.4\u00b0N to 23.4\u00b0S. When it\\'s summer in the north it\\'s winter in the south \u2014 <b>Christmas is midsummer<\/b> in Australia and New Zealand.']};\nfunction stepText(){return DESC[L][MODE]}\nvar FACT={ja:[\n ['\ud83c\udfdc \u7802\u6f20\u304c\u7def\u5ea6 30\u00b0 \u306b\u4e26\u3076\u308f\u3051','<p>\u30b5\u30cf\u30e9\u30fb\u30a2\u30e9\u30d3\u30a2\u30fb\u30aa\u30fc\u30b9\u30c8\u30e9\u30ea\u30a2\u30fb\u30ab\u30e9\u30cf\u30ea\u30fb\u30e1\u30ad\u30b7\u30b3\u5317\u90e8\u306e\u7802\u6f20\u306f\u3001\u5317\u7def\u30fb\u5357\u7def 20\u301c30\u00b0 \u3042\u305f\u308a\u306b\u96c6\u307e\u3063\u3066\u3044\u307e\u3059\u3002\u8d64\u9053\u3067\u306e\u307c\u3063\u305f\u7a7a\u6c17\u304c\u4e0b\u308a\u3066\u304f\u308b\u6240\u3067\u3001\u4e0b\u308a\u308b\u7a7a\u6c17\u306f\u6696\u307e\u3063\u3066\u4e7e\u304f\u305f\u3081\u3001\u96f2\u304c\u3067\u304d\u306b\u304f\u3044\u304b\u3089\u3067\u3059\u3002\u26cf <b>MeridiGround<\/b> \u306e\u5730\u5f62\u3068\u3042\u308f\u305b\u3066\u898b\u308b\u3068\u3001\u5c71\u306e\u9670\uff08\u96e8\u9670\u7802\u6f20\uff09\u3084\u51b7\u305f\u3044\u6d77\u6d41\u306e\u6cbf\u5cb8\uff08\u6d77\u5cb8\u7802\u6f20\uff09\u306b\u3082\u3067\u304d\u308b\u3053\u3068\u304c\u308f\u304b w clouds.',\n kog:'<b>\ud83c\udf42 Kogarashi<\/b>: in late autumn, as the continental high starts to push out, a <b>cold, strong northerly<\/b> blows \u2014 named for stripping leaves from trees. JMA announces the season\\'s first, \u201cKogarashi No. 1\u201d, <b>only for Tokyo and Kinki<\/b>, often around ritt\u014d (~7 Nov). It signals the start of the winter pattern \u2014 the autumn counterpart of haru-ichiban.',\n spr:'<b>\ud83c\udf38 Haru-ichiban<\/b>: between early Feb and the equinox, a low crossing the Sea of Japan pulls in the year\\'s first <b>strong, warm south wind<\/b>.',\n bai:'<b>\u2614 Baiu (rainy-season) front<\/b>: forms between the cool Okhotsk High and the warm Pacific High. They balance, so the front <b>barely moves<\/b> \u2014 weeks of rain. Advance the month to see it creep <b>north from Okinawa to Kyushu to Honshu<\/b>. Hokkaido has no clear rainy season.',\n sum:'<b>\u2600\ufe0f Pacific High<\/b>: a huge high covers Japan, its <b>clockwise<\/b> winds bringing hot humid air from the south. Long muggy spells and afternoon \u26c8 storms.',\n aki:'<b>\ud83c\udf42 Autumn rain front<\/b>: as the Pacific High weakens and cooler air returns, a stationary front forms again and moves <b>south<\/b>. Nearby typhoons can boost its rain.',\n typ:'<b>\ud83c\udf00 Typhoon tracks<\/b>: typhoons are steered by surrounding winds.<ul><li><b>Jul\u2013Aug<\/b>: along the edge of the strong Pacific High, west and north<\/li><li><b>Sep<\/b>: the high weakens; they recurve northeast near Japan<\/li><li><b>Oct<\/b>: carried east by the westerlies, south of Japan<\/li><\/ul>Northern-hemisphere typhoons spin <b>counterclockwise<\/b>.',\n yam:'<b>\ud83c\udf2b Yamase<\/b>: in early summer the Okhotsk High sends <b>cold damp NE winds<\/b> onto Tohoku\\'s Pacific coast \u2014 fog, low cloud, cool summers, historically crop failures. The Sea of Japan side past the mountains is often sunny.',\n sen:'<b>\ud83c\udf27 Linear rain band<\/b>: when moist air keeps flowing into on 3067\u51b7\u305f\u3044\u7a7a\u6c17\u3068\u3076\u3064\u304b\u308b\u3068\u3001\u524d\u7dda\u304c\u3067\u304d\u3066\u6e29\u5e2f\u4f4e\u6c17\u5727\u306b\u5909\u308f\u308b\u3053\u3068\u304c\u3042\u308a\u307e\u3059\uff08\u6e29\u5e2f\u4f4e\u6c17\u5727\u5316\uff09\u3002<\/p>'],\n ['\ud83d\uddfa \u5929\u6c17\u56f3\u306e\u8a18\u53f7','<ul><li>\ud83d\udd34 <b>\u6e29\u6696\u524d\u7dda<\/b>\uff08\u534a\u5186\uff09\uff1a\u6696\u304b\u3044\u7a7a\u6c17\u304c\u9032\u3080\u5074\u306b\u534a\u5186<\/li><li>\ud83d\udd35 <b>\u5bd2\u51b7\u524d\u7dda<\/b>\uff08\u4e09\u89d2\uff09\uff1a\u51b7\u305f\u3044\u7a7a\u6c17\u304c\u9032\u3080\u5074\u306b\u4e09\u89d2<\/li><li>\ud83d\udfe3 <b>\u9589\u585e\u524d\u7dda<\/b>\uff1a\u534a\u5186\u3068\u4e09\u89d2\u304c\u540c\u3058\u5074\u306b\u4ea4\u4e92<\/li><li>\ud83d\udd34\ud83d\udd35 <b>\u505c\u6ede\u524d\u7dda<\/b>\uff1a\u534a\u5186\u3068\u4e09\u89d2\u304c\u53cd\u5bfe\u5074\u306b\u4ea4\u4e92\uff08\u6885\u96e8\u524d\u7dda\u30fb\u79cb\u96e8\u524d\u7dda\uff09<\/li><\/ul>'],\n ['\ud83e\udd75 \u71b1\u4e2d\u75c7\u3068\u6691\u3055\u6307\u6570','<p>\u590f\u306e\u592a\u5e73\u6d0b\u9ad8\u6c17\u5727\u306b\u304a\u304a\u308f\u308c\u308b\u3068\u3001\u84b8\u3057\u6691\u3044\u65e5\u304c\u7d9a\u304d\u307e\u3059\u3002\u71b1\u4e2d\u75c7\u306e\u5371\u306a\u3055\u306f\u3001\u6c17\u6e29\u3060\u3051\u3067\u306a\u304f\u3001\u6e7f\u5ea6\u30fb\u65e5\u3056\u3057\u30fb\u98a8\u3082\u5165\u308c\u305f<b>\u6691\u3055\u6307\u6570\uff08WBGT\uff09<\/b>\u3067\u898b\u307e\u3059\u3002\u6e7f\u5ea6\u304c\u9ad8\u3044\u3068\u6c57\u304c\u4e7e\u304b\u305a\u3001\u4f53\u304c\u51b7\u3048\u306b\u304f\u304f\u306a\u308b\u304b\u3089\u3067\u3059\u3002\u6691\u3055\u6307\u6570\u304c 33 \u4ee5\u4e0a\u3068\u4e88\u60f3\u3055\u308c\u308b\u3068<b>\u71b1\u4e2d\u75c7\u8b66\u6212\u30a2\u30e9\u30fc\u30c8<\/b>\u304c\u51fa\u307e\u3059\u3002\u3053\u307e\u3081\u306a\u6c34\u5206\u3068\u5869\u5206\u3001\u30a8\u30a2\u30b3\u30f3\u3001\u65e5\u304b\u3052\u3067\u4f11\u3080\u3053\u3068\u304c\u5927\u5207\u3067\u3059\u3002\ud83d\udcd6 \u56f3\u9451\u306b\u3082\u304f\u308f\u3057\u304f\u8f09\u305b\u3066\u3044\u307e\u3059\u3002<\/p>'],\n ['\ud83d\udd17 \u307b\u304b\u306e\u30bf\u30d6\u3068\u306e\u3064\u306a\u304c\u308a','<p>\u590f\u306e\u5348\u5f8c\u306e\u96f7\u96e8\u306f \u26c8 \u5915\u7acb\u3001\u5c71\u3092\u3053\u3048\u308b\u98a8\u306e\u6e29\u5ea6\u306f \ud83c\udfd4 \u30d5\u30a7\u30fc\u30f3\u3001\u51ac\u306e\u6674\u308c\u305f\u671d\u306e\u51b7\u3048\u8fbc\u307f\u306f \ud83c\udf19 \u653e\u5c04\u51b7\u5374\u3001\u96ea\u3068\u96e8\u306e\u5206\u304b\u308c\u76ee\u306f \ud83c\udf27 \u96e8\u3068\u96ea\u3067\u898b\u3089\u308c\u307e\u3059\u3002<\/p>']],\n en:[\n ['\u26f0 Mountains split the weather','<p>A spine of mountains runs down Japan (brown lines). In winter snow clouds pile into them, burying the Sea of Japan side while the Pacific side stays dry; in a yamase summer it\\'s the reverse. See how mountains form in \u26cf <b>MeridiGround<\/b>, and how air warms crossing them in \ud83c\udfd4 Foehn.<\/p>'],\n ['\u2744\ufe0f Why so much snow?','<p>The icy monsoon crosses the Sea of Japan, kept relatively warm by the <b>Tsushima Current<\/b>, and soaks up moisture. The bigger the sea\u2013air temperature gap, the stronger the snow clouds. That snow later feeds rivers and rice paddies as <b>meltwater<\/b>.<\/p>'],\n ['\u2614 Rainy-season timing','<p>On average the rainy season starts in Okinawa in early-to-mid May and in Kanto in early June, ending in Okinawa in late June and Kanto in mid-to-late July \u2014 but it varies a lot. Its rain also prevents summer water shortages.<\/p>'],\n ['\ud83c\udf00 Typhoons vs cyclones','<p>The Coriolis effect makes northern-hemisphere storms spin <b>counterclockwise<\/b> and southern ones <b>clockwise<\/b> (highs the opposite). They\\'re typhoons in the NW Pacific, <b>hurricanes<\/b> in the N Atlantic, <b>cyclones<\/b> in the Indian Ocean and S Pacific.<\/p>'],\n ['\ud83c\udf0f Upside-down seasons','<p>In Australia summer is Dec\u2013Feb and winter Jun\u2013Aug \u2014 Christmas at the beach. Northern Australia has a <b>wet season<\/b> from October to April and a dry season the rest of the year.<\/p>'],\n ['\ud83c\udf2c Weather comes from the west','<p>The <b>westerlies<\/b> carry highs and lows from west to east over Japan, hence the saying \u201cred sky at night, fair tomorrow\u201d (not always true).<\/p>'],\n ['\ud83c\udf42 Kogarashi No. 1 vs haru-ichiban','<p>A pair of season-marking winds: the cold northerly that opens winter (announced only for Tokyo and Kinki; about 8 m/s+ in Tokyo) and the warm southerly that closes it.<\/p>'],\n ['\ud83c\udf38 Defining haru-ichiban','<p>The first warm, strong southerly between the start of spring (risshun) and the equinox. JMA sets regional criteria; some years it never comes.<\/p>'],\n ['\ud83c\udf00 Extratropical lows vs typhoons','<p><b>Extratropical lows<\/b> feed on the temperature contrast between air masses and carry fronts. <b>Typhoons<\/b> feed on heat released as water vapour from warm seas condenses, with no fronts. A typhoon moving north into cold air can turn extratropical.<\/p>'],\n ['\ud83d\uddfa Weather-map symbols','<ul><li>\ud83d\udd34 <b>Warm front<\/b>: semicircles toward the direction of motion<\/li><li>\ud83d\udd35 <b>Cold front<\/b>: triangles<\/li><li>\ud83d\udfe3 <b>Occluded<\/b>: both, same side<\/li><li>\ud83d\udd34\ud83d\udd35 <b>Stationary<\/b>: alternating, opposite sides<\/li><\/ul>'],\n ['\ud83e\udd75 Heatstroke & WBGT','<p>Under the Pacific High, muggy days drag on. Heat risk is judged by <b>WBGT<\/b>, which adds humidity, sunshine and wind to temperature \u2014 humid air stops sweat from cooling you. A <b>Heatstroke Alert<\/b> is issued when WBGT 33+ is forecast. Drink, rest in shade, use air-conditioning.<\/p>'],\n ['\ud83d\udd17 Related tabs','<p>Afternoon storms in \u26c8 Cloudburst, mountain winds in \ud83c\udfd4 Foehn, frosty mornings in \ud83c\udf19 Night cooling, rain vs snow in \ud83c\udf27 Rain & snow.<\/p>']]};\nfunction render(){document.doc >1\u301c2 \u79d2\u307b\u3069\u7dd1\u306b\u5149\u308b<\/b>\u3053\u3068\u304c\u3042\u308a\u307e\u3059\u3002\u7a7a\u6c17\u304c\u30d7\u30ea\u30ba\u30e0\u306e\u3088\u3046\u306b\u5149\u3092\u66f2\u3052\u3001\u8272\u3054\u3068\u306b\u5c11\u3057\u305a\u308c\u308b\u305f\u3081\u3067\u3059\uff08\u7dd1\u3084\u9752\u306e\u50cf\u304c\u308f\u305a\u304b\u306b\u4e0a\u306b\u6765\u307e\u3059\uff09\u3002\u9752\u306f\u9014\u4e2d\u3067\u6563\u3089\u3070\u3063\u3066\u3057\u307e\u3046\u306e\u3067\u3001\u6b8b\u3063\u305f\u7dd1\u304c\u898b\u3048\u307e\u3059\u3002\u5730\u5e73\u7dda\u3084\u6c34\u5e73\u7dda\u304c\u304f\u3063\u304d\u308a\u898b\u3048\u308b\u3001\u7a7a\u6c17\u306e\u6f84\u3093\u3060\u65e5\u306b\u8d77\u304d\u3084\u3059\u3044\u73fe\u8c61\u3067\u3059\u3002<br>\u26a0\ufe0f \u9ad8\u304f\u6607\u3063\u305f\u592a\u967d\u306f\u3001\u7d76\u5bfe\u306b\u76f4\u63a5\u898b\u306a\u3044\u3067\u304f\u3060\u3055\u3044\u3002',\n '<b>\u2600\ufe0f \u8584\u660e\u5149\u7dda\uff08\u5929\u4f7f\u306e\u306f\u3057\u3054\uff09<\/b>\uff1a\u96f2\u306e\u3059\u304d\u9593\u304b\u3089\u5149\u306e\u7b4b\u304c\u5e83\u304c\u3063\u3066\u898b\u3048\u307e\u3059\u3002\u7a7a\u6c17\u4e2d\u306e\u7d30\u304b\u3044\u3061\u308a\u3084\u6c34\u306e\u7c92\u304c\u5149\u3092\u6563\u3089\u3070\u3089\u305b\u308b\u306e\u3067\u3001\u5149\u306e\u901a\u308a\u9053\u304c\u898b\u3048\u307e\u3059\u3002\u7b4b\u306f\u672c\u5f53\u306f<b>\u307b\u307c\u5e73\u884c<\/b>\u3067\u3059\u304c\u3001\u9060\u8fd1\u6cd5\u3067\u592a\u967d\u304b\u3089\u5e83\u304c\u3063\u3066\u898b\u3048\u307e\u3059\uff08\u7dda\u8def\u304c\u9060\u304f\u3067\u4e00\u70b9\u306b\u96c6\u307e\u308b\u306e\u3068\u540c\u3058\u3067\u3059\uff09\u3002\u300c\u30e4\u30b3\u30d6\u306e\u306f\u3057\u3054\u300d\u3068\u3082\u547c\u3070\u308c\u307e\u3059\u3002',\n '<b>\ud83c\udf38 \u30d3\u30fc\u30ca\u30b9\u30d9\u30eb\u30c8\u3068\u5730\u7403\u306e\u5f71<\/b>\uff1a\u65e5\u306e\u5165\u308a\u5f8c\u3084\u65e5\u306e\u51fa\u524d\u306b<b>\u592a\u967d\u3068\u53cd\u5bfe\u306e\u7a7a<\/b>\u3092\u898b\u308b\u3068\u3001\u5730\u5e73\u7dda\u306e\u4e0a\u306b<b>\u30d4\u30f3\u30af\u8272\u306e\u5e2f<\/b>\uff08\u30d3\u30fc\u30ca\u30b9\u30d9\u30eb\u30c8\uff09\u3001\u305d\u306e\u4e0b\u306b<b>\u9752\u9ed2\u3044\u5e2f<\/b>\u304c\u898b\u3048\u307e\u3059\u3002\u9752\u9ed2\u3044\u5e2f\u306f\u3001\u7a7a\u306b\u6620\u3063\u305f<b>\u5730\u7403\u305d\u306e\u3082\u306e\u306e\u5f71<\/b>\u3067\u3059\u3002\u592a\u967d\u304c\u3057\u305a\u3080\u306b\u3064\u308c\u3066\u3001\u5f71\u306f\u5c11\u3057\u305a\u3064\u9ad8\u304f\u4e0a\u304c\u308a\u3001\u30d4\u30f3\u30af\u306e\u5e2f\u3068\u898b\u5206\u3051\u306b\u304f\u304f\u306a\u3063\u3066\u3044\u304d\u307e\u3059\uff08\u81ea\u52d5\u3067\u9032\u307f\u307e\u3059\uff09\u3002',\n '<b>\ud83d\udd06 \u53cd\u8584\u660e\u5149\u7dda<\/b>\uff1a\u8584\u660e\u5149\u7dda\u306e\u7b4b\u306f\u3001\u7a7a\u3092\u6a2a\u5207\u3063\u3066\u3001<b>\u592a\u967d\u306e\u6b63\u53cd\u5bfe\u306e\u70b9\uff08\u5bfe\u65e5\u70b9\uff09<\/b>\u306b\u307e\u305f\u96c6\u307e\u308a\u307e\u3059\u3002\u5e73\u884c\u306a\u5149\u304c\u3001\u9060\u8fd1\u6cd5\u3067\u53cd\u5bfe\u5074\u3067\u3082\u4e00\u70b9\u306b\u96c6\u307e\u3063\u3066\u898b\u3048\u308b\u306e\u3067\u3059\u3002\u5915\u65b9\u3001\u592a\u967d\u3068\u53cd\u5bfe\u306e\u6771\u306e\u7a7a\u306b\u898b\u3048\u308b\u3053\u3068\u304c\u3042\u308a\u307e\u3059\u3002',\n '<b>\ud83c\udfdd \u8703\u6c17\u697c\u30fb\u9003\u3052\u6c34<\/b>\uff1a\u6e29\u5ea6\u306e\u3061\u304c\u3046\u7a7a\u6c17\u306e\u5c64\u3067\u5149\u304c\u66f2\u304c\u308b\u3068\u3001\u7269\u304c\u305a\u308c\u3066\u898b\u3048\u307e\u3059\u3002<ul><li><b>\u9003\u3052\u6c34<\/b>\uff08\u4e0b\u4f4d\u8703\u6c17\u697c\uff09\uff1a\u71b1\u3044\u30a2\u30b9\u30d5\u30a1\u30eb\u30c8\u306e\u4e0a\u306e\u7a7a\u6c17\u3067\u5149\u304c\u4e0a\u3078\u66f2\u304c\u308a\u3001\u7a7a\u304c\u9053\u8def\u306b\u6620\u3063\u3066\u6c34\u305f\u307e\u308a\u306e\u3088\u3046\u306b\u898b\u3048\u307e\u3059\u3002\u8fd1\u3065\u304f\u3068\u9003\u3052\u3066\u3044\u304d\u307e\u3059<\/li><li><b>\u6d6e\u304d\u4e0a\u304c\u308a<\/b>\uff08\u4e0a\u4f4d\u8703\u6c17\u697c\uff09\uff1a\u51b7\u305f\u3044\u6d77\u306e\u4e0a\u306b\u6696\u304b\u3044\u7a7a\u6c17\u304c\u4e57\u308b\u3068\u3001\u9060\u304f\u306e\u8239\u3084\u9678\u304c\u4e0a\u3078\u4f38\u3073\u305f\u308a\u3001\u9006\u3055\u306b\u91cd\u306a\u3063\u305f\u308a\u3057\u307e\u3059\u3002\u65e5\u672c\u3067\u306f\u3001\u6625\u306e<b>\u5bcc\u5c71\u6e7e<\/b>\u304c\u6709\u540d\u3067\u3059<\/li><\/ul>',\n '<b>\ud83e\udd0d \u767d\u8679\uff08\u9727\u8679\uff09<\/b>\uff1a\u96e8\u3088\u308a<b>\u305a\u3063\u3068\u5c0f\u3055\u3044\u9727\u306e\u7c92<\/b>\u3067\u8679\u304c\u3067\u304d\u308b\u3068\u3001\u8272\u304c\u91cd\u306a\u308a\u5408\u3063\u3066\u3001<b>\u767d\u304f\u592a\u3044\u8679<\/b>\u306b\u306a\u308a\u307e\u3059\u3002\u534a\u5f84\u306f\u666e\u901a\u306e\u8679\u3088\u308a\u5c11\u3057\u5c0f\u3055\u3081\u3067\u3059\u3002\u9727\u306e\u671d\u306b\u3001\u592a\u967d\u3092\u80cc\u306b\u3057\u3066\u898b\u3089\u308c\u307e\u3059\u3002',\n '<b>\ud83c\udf15 \u6708\u8679\uff08\u591c\u306e\u8679\uff09<\/b>\uff1a\u660e\u308b\u3044<b>\u6e80\u6708\u306e\u3053\u308d<\/b>\u3001\u6708\u3092\u80cc\u306b\u3057\u3066\u3001\u524d\u306b\u96e8\u3084\u6edd\u306e\u3057\u3076\u304d\u304c\u3042\u308b\u3068\u3001\u591c\u306b\u3082\u8679\u304c\u3067\u304d\u307e\u3059\u3002\u5149\u304c\u5f31\u3044\u306e\u3067\u3001\u76ee\u306b\u306f<b>\u767d\u3063\u307d\u304f<\/b>\u898b\u3048\u307e\u3059\u304c\u3001\u30ab\u30e1\u30e9\u3067\u9577\u304f\u5199\u3059\u3068\u8272\u304c\u51fa\u307e\u3059\u3002\u6708\u306e\u9ad8\u3055\u304c 42\u00b0 \u3088\u308a\u4f4e\u3044\u3053\u3068\u3082\u3001\u666e\u901a\u306e\u8679\u3068\u540c\u3058\u6761\u4ef6\u3067\u3059\u3002\u30a2\u30d5\u30ea\u30ab\u306e\u30d3\u30af\u30c8\u30ea\u30a2\u306e\u6edd\u306a\u3069\u304c\u6709\u540d\u3067\u3059\u3002'],\n en:[\n '<b>\ud83d\udc64 Brocken spectre<\/b>: on a mountain with the Sun <b>behind<\/b> you, your <b>shadow<\/b> is cast huge on mist ahead, ringed by colored circles \u2014 a <b>glory<\/b>, from light diffracted inside tiny droplets back toward its source. The rings center on <b>your<\/b> head, so each person sees only their own. Named after Germany\\'s Brocken; also seen around a plane\\'s shadow on clouds.',\n '<b>\ud83d\udc9a Green flash<\/b>: at the instant of sunset or sunrise the Sun\\'s rim can flash <b>green for 1\u20132 seconds<\/b>. The air bends light like a prism, lifting green and blue images slightly; blue is scattered away, leaving green. Best with a sharp, clear horizon.<br>\u26a0\ufe0f Never look directly at a high Sun.',\n '<b>\u2600\ufe0f Crepuscular rays<\/b>: shafts of light fanning through gaps in clouds, made visible by haze. The rays are really <b>almost parallel<\/b> \u2014 perspective makes them spread, like rail tracks meeting in the distance.',\n '<b>\ud83c\udf38 Belt of Venus & Earth\\'s shadow<\/b>: after sunset or before sunrise, look <b>away from the Sun<\/b>: a <b>pink band<\/b> above the horizon with a <b>dark blue band<\/b> below \u2014 the <b>shadow of the Earth itself<\/b>. It rises as the Sun sinks (animated).',\n '<b>\ud83d\udd06 Anticrepuscular rays<\/b>: the rays cross the sky and converge again at the <b>antisolar point<\/b>, directly opposite the Sun \u2014 perspective again.',\n '<b>\ud83c\udfdd Mirages<\/b>: light bends through air layers of different temperatures.<ul><li><b>Inferior mirage<\/b>: over hot roads light bends up, showing the sky as a \u201cpuddle\u201d that retreats as you approach<\/li><li><b>Superior mirage<\/b>: warm air over cold sea stretches or flips distant ships and coasts (Toyama Bay, Japan, in spring)<\/li><\/ul>',\n '<b>\ud83e\udd0d Fogbow<\/b>: made by <b>much smaller fog droplets<\/b>, the colors overlap into a broad <b>white bow<\/b>, a little smaller than a rainbow. Look for it on foggy mornings with the Sun behind you.',\n '<b>\ud83c\udf15 Moonbow<\/b>: near a bright <b>full Moon<\/b>, with the Moon behind you and rain or waterfall spray ahead. It looks <b>whitish<\/b> to the eye but shows color in long exposures 9\u51a0\uff09\u304c\u3067\u304d\u307e\u3059\u3002\u7c92\u306e\u5927\u304d\u3055\u304c\u305d\u308d\u3063\u3066\u3044\u306a\u3044\u3068\u3001\u96f2\u306e\u3075\u3061\u304c\u30d1\u30b9\u30c6\u30eb\u306e\u8679\u8272\u306b\u307e\u3060\u3089\u306b\u67d3\u307e\u308a\u307e\u3059\u3002\u3053\u308c\u304c<b>\u5f69\u96f2<\/b>\u3067\u3001\u6614\u304b\u3089\u300c\u826f\u3044\u3053\u3068\u306e\u524d\u3076\u308c\u300d\u3068\u8a00\u308f\u308c\u3066\u304d\u307e\u3057\u305f\u3002<\/p>'],\n ['\ud83d\udd06 \u8679\u3068\u30cf\u30ed\u306e\u3061\u304c\u3044','<ul><li><b>\u8679<\/b>\uff1a\u6c34\u306e\u7c92\uff08\u96e8\uff09\u30fb\u592a\u967d\u3092<b>\u80cc<\/b>\u306b\u3057\u3066\u898b\u308b\u30fb42\u00b0\u30fb\u5916\u5074\u304c\u8d64<\/li><li><b>\u30cf\u30ed<\/b>\uff1a\u6c37\u306e\u7c92\uff08\u5dfb\u5c64\u96f2\uff09\u30fb<b>\u592a\u967d\u306e\u65b9<\/b>\u3092\u898b\u308b\u30fb22\u00b0\u30fb\u5185\u5074\u304c\u8d64<\/li><li><b>\u5149\u51a0<\/b>\uff1a\u6c34\u306e\u7c92\uff08\u96f2\uff09\u30fb\u592a\u967d\u306e\u3059\u3050\u307e\u308f\u308a\u30fb\u5916\u5074\u304c\u8d64<\/li><\/ul><p>\u26a0\ufe0f \u592a\u967d\u306e\u307e\u308f\u308a\u306e\u73fe\u8c61\u306f\u3001\u592a\u967d\u3092\u624b\u3084\u5efa\u7269\u3067\u304b\u304f\u3057\u3066\u898b\u3066\u304f\u3060\u3055\u3044\u3002<\/p>'],\n ['\ud83d\udd34 \u706b\u661f\u306e\u5915\u713c\u3051\u306f\u9752\u3044','<p>\u706b\u661f\u3067\u306f\u3001\u7d30\u304b\u3044\u3061\u308a\u304c\u8d64\u3044\u5149\u3092\u591a\u304f\u6563\u3089\u3070\u3089\u305b\u308b\u305f\u3081\u3001\u663c\u306e\u7a7a\u306f\u9ec4\u571f\u8272\u3067\u3001\u5915\u713c\u3051\u306f<b>\u592a\u967d\u306e\u307e\u308f\u308a\u304c\u9752\u304f<\/b>\u306a\u308a\u307e\u3059\u3002NASA \u306e\u63a2\u67fb\u8eca\u30ad\u30e5\u30ea\u30aa\u30b7\u30c6\u30a3\u304c\u64ae\u5f71\u3057\u3066\u3044\u307e\u3059\u3002<\/p>']],\n en:[\n ['\ud83d\udc99 Why the sky is blue','<p>Sunlight is white light \u2014 all colors mixed. Air molecules are far smaller than light waves and <b>scatter short blue wavelengths much more<\/b> (Rayleigh scattering) \u2014 about 5\u00d7 more than red \u2014 so blue reaches you from all over the sky.<\/p>'],\n ['\ud83d\udfe3 Why not violet?','<p>Violet scatters even more, but sunlight has less of it, some is absorbed high up, and our eyes are less sensitive to it.<\/p>'],\n ['\ud83c\udf07 Why sunsets are red','<p>A low Sun\\'s light crosses much more air (see diagram) \u2014 about <b>38\u00d7<\/b> more at the horizon. Blue is scattered out on the way and red remains.<\/p>'],\n ['\u2601\ufe0f Why clouds are white','<p>Cloud droplets are as big as or bigger than light waves and <b>scatter all colors alike<\/b> (Mie scattering), so they look white. Thick cloud bases look grey because less light gets through.<\/p>'],\n ['\u2728 Afterglow & \ud83d\udc99 blue hour','<p>Right after sunset the hidden Sun lights clouds and the high sky softly. With the Sun 4\u20136\u00b0 below the horizon comes the deep-blue \u201cblue hour\u201d \u2014 loved by photographers.<\/p>'],\n ['\ud83c\udf08 When you see a rainbow','<ul><li>Sun <b>behind you<\/b>, rain in front<\/li><li>A circle ~42\u00b0 around your head\\'s shadow; invisible if the Sun is higher than 42\u00b0<\/li><li>The outer bow (~51\u00b0) has reversed colors; the dark gap is Alexander\\'s band<\/li><li>Inside the bow is a little brighter<\/li><\/ul>'],\n ['\ud83c\udf2b Dusty, hazy skies','<p>Large particles whiten the sky and spread glare around the Sun. After big volcanic eruptions, sunsets worldwide have been recorded as unusually red.<\/p>'],\n ['\u2b55 The 22\u00b0 halo','<p>Light passing through tiny hexagonal ice crystals in thin cirrostratus, bending through a 60\u00b0 prism angle, forms a ring <b>about 22\u00b0<\/b> from the Sun \u2014 about a spread hand at arm\\'s length. Red inside, whitish outside. Around the Moon it\\'s a lunar halo; the folk saying \u201cring around the Moon, rain soon\u201d comes from cirrostratus often arriving ahead of a front (not always true).<\/p>'],\n ['\ud83c\udf1e Sundogs & parhelic circle','<p>Plate crystals floating <b>horizontally<\/b> make bright spots level with the Sun on both sides \u2014 <b>sundogs<\/b>, ~22\u00b0 away when the Sun is low and farther as it rises; gone above ~61\u00b0. The white horizontal ring through the Sun is the parhelic circle.<\/p>'],\n ['\ud83d\ude43 Circumzenithal arc','<p>Light enters the top face of plate crystals and exits a side face, making a vivid arc round the zenith, bowed toward the Sun \u2014 only when the Sun is <b>below 32\u00b0<\/b>. Red is on the Sun side. Often called the \u201cupside-down rainbow\u201d.<\/p>'],\n ['\ud83c\udf08 Circumhorizontal arc','<p>The reverse path \u2014 in a side face, out the bottom \u2014 gives a band parallel to the horizon about 46\u00b0 below the Sun, only when the Sun is <b>above 58\u00b0<\/b>: spring\u2013summer midday in Japan, rare at high latitudes.<\/p>'],\n ['\ud83c\udf25 Corona & iridescence','<p>These come from <b>water droplets<\/b>, not ice. Diffraction around tiny drops makes small colored rings hugging the Sun or Moon (corona); mixed drop sizes paint cloud edges in pastel patches (iridescence).<\/p>'],\n ['\ud83d\udd06 Rainbow vs halo','<ul><li><b>Rainbow<\/b>: water (rain), Sun <b>behind<\/b> you, 42\u00b0, red outside<\/li><li><b>Halo<\/b>: ice (cirrostratus), <b>toward<\/b> the Sun, 22\u00b0, red inside<\/li><li><b>Corona<\/b>: water (cloud), hugging the Sun, red outside<\/li><\/ul><p>\u26a0\ufe0f Block the Sun with a hand or building.<\/p>'],\n ['\ud83d\udd34 Blue sunsets on Mars','<p>Fine Martian dust makes the daytime sky butterscotch and sunsets <b>blue around the Sun<\/b> \u2014 photographed by NASA\\'s Curiosity rover.<\/p>']]};\nfunction render(){document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(function(el){var v=TX[L][el.dataset.t];if(typeof v==='string')el.textContent=v});\n $('bLang').textContent=L==='ja'?'\ud83c\udf10 EN':'\ud83c\udf10 \u65e5\u672c\u8a9e';$('bPlay').textContent=play?t('stop'):t( \u671d\u306e\u9727\u3067\u898b\u901a\u3057\u304c\u60aa\u304f\u306a\u308b\u69d8\u5b50\u306f \ud83c\udf27 \u96e8\u3068\u96ea\u306e\u5b9f\u9a13\u3067\u3001\u9ad8\u3055\u3068\u6c17\u6e29\u306e\u95a2\u4fc2\u306f \u2b06 \u7a7a\u3092\u6607\u308b\u3067\u898b\u3089\u308c\u307e\u3059\u3002<\/p>']],\n en:[\n ['\ud83d\udecc Clouds are the sky\\'s blanket','<p>The ground always gives off heat as invisible infrared. On clear nights it escapes to space; clouds catch it and send it back down. That\\'s why cloudy nights are milder and clear nights are colder.<\/p>'],\n ['\ud83c\udf05 Coldest at sunrise','<p>Heat keeps escaping all night, so the lowest temperature usually comes around dawn, not midnight.<\/p>'],\n ['\ud83c\udf3f Dew, frost and fog','<ul><li><b>Dew<\/b>: water vapour condenses onto chilled grass and car windows<\/li><li><b>Frost<\/b>: below 0 \u00b0C it forms as ice instead<\/li><li><b>Radiation fog<\/b>: on calm nights the air near the ground itself cools into fog \u2014 common in basins and by rivers, burning off in the morning sun<\/li><\/ul>'],\n ['\ud83c\udf05 Why winter sunrises glow orange','<p>In winter the Sun sits low, so morning light crosses a long path through the air. Blue light is scattered away and <b>orange and red<\/b> remain. After a cold clear night, <b>mist<\/b> or fog pools near the ground, and its droplets glow golden in the low Sun. As the day warms, the mist burns off. Visibility under 1 km is fog; above that it is mist.<\/p>'],\n ['\u2744\ufe0f Those frosty winter mornings','<p>Clear skies, light winds and dry air make the strongest overnight cooling.<\/p>'],\n ['\ud83c\udfdc Cold desert nights','<p>Very dry air and few clouds let deserts lose heat fast at night \u2014 hot days, cold nights. Deserts are coming in the \ud83c\udf0d Earth tab.<\/p>'],\n ['\ud83d\udd3a Inversions','<p>Normally it gets colder with height, but on cooling nights only the ground layer chills \u2014 so it\\'s <b>colder below and warmer just above<\/b>, an inversion. In the small graph, a line leaning right means an inversion. Inversions trap smoke near the ground.<\/p>'],\n ['\ud83c\udf04 Sea of clouds','<p>Cold air is heavy and drains into basins and valleys overnight. If fog forms there, from a mountain it looks like a sea of clouds \u2014 often on clear, calm autumn mornings.<\/p>'],\n ['\ud83d\udcc8 The daily temperature curve','<p>It\\'s usually warmest around <b>2 pm<\/b>, after the ground has soaked up heat, and coldest around <b>sunrise<\/b>. See the 24-hour graph (rough guide).<\/p>'],\n ['\ud83d\udd17 Related tabs','<p>See fog cut visibility in \ud83c\udf27 Rain & snow, and height vs temperature in \u2b06 Climb.<\/p>']]};\nfunction render(){document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(function(el){var v=TX[L][el.dataset.t];if(typeof v==='string')el.textContent=v});\n $('bLang').textContent=L==='ja'?'\ud83c\udf10 EN':'\ud83c\udf10 \u65e5\u672c\u8a9e';$('bPlay').textContent=play?t('play'):t('pause');$('bSpd').textContent=t('spd')+' \u00d7'+spd;$('bRe').textContent=t('re');$('bCmp').textContent=t('vCmp');$('bUnk').textContent=t('vUnk');$('bG24').textContent=G24?t('vG12'):t('vG24');\n ['bCmp','bUnk'].forEach(function(id,k){$(id).classList.toggle('on',k?UNK:CMP)});$('bG24').classList.toggle('on',G24);\n $('pre').innerHTML=PRE.map(function(q,i){return'<button data-i=\"'+i+'\"><span class=\"e\">'+q[0]+'<\/span>'+(L==='ja'?q[1]:q[2])+'<\/button>'}).join('');\n var op=[].slice.call(document.querySelectorAll('#facts details')).map(function(d){return d.open});\n $('facts').innerHTML=FACT[L].map(function(f,i){return'<details'+((op.length?op[i]:i===0)?' open':'')+'><summary>'+f[0]+'<\/summary>'+f[1]+'<\/details>'}).join('');sync();$('step')._s=null}\nfunction sync(){$('C').value=S.C;$('W').value=S.W;$('RH').value=S.RH;$('T0').value=S.T0;$('vC').textContent=Math.round(S.C)+' %';$('vW').textContent=S.W.toFixed(1)+' m/s';$('vRH').textContent=Math.round(S.RH)+' %';$('vT0').textContent=S.T0.toFixed(1)+' u6c17\u304c\u4e0a\u7a7a\u307e\u3067\u6696\u304b\u3044\u307e\u307e\u3067\u3044\u3089\u308c\u308b\u307b\u3069\u3001\u96f2\u306f\u9ad8\u304f\u80b2\u3061\u307e\u3059\u3002\u307e\u308f\u308a\u306e\u7a7a\u6c17\u306f\u300c\u5730\u9762\u304b\u3089 1 km \u307e\u3067\u306f 100 m \u3067\u7d04 1 \u2103 \u4e0b\u304c\u308a\u3001\u4e0a\u7a7a 5 km \u306f\u590f\u306e\u76ee\u5b89\u306e\u7d04 \u22126 \u2103\u3001\u305d\u306e\u4e0a\u306f 100 m \u3067\u7d04 0.65 \u2103 \u4e0b\u304c\u308b\u300d\u3068\u3057\u3001\u306e\u307c\u308b\u7a7a\u6c17\u306f\u663c\u306e\u65e5\u5dee\u3057\u3067 1.5 \u2103 \u6e29\u307e\u3063\u305f\u3068\u3057\u3066\u8a08\u7b97\u3057\u3066\u3044\u307e\u3059\uff08\u3057\u304f\u307f\u3092\u898b\u305b\u308b\u305f\u3081\u306e\u76ee\u5b89\u3067\u3059\uff09\u3002'},\n info:'<b>\u26c8 \u5915\u7acb v0.2.0<\/b><p>\u590f\u306e\u5348\u5f8c\u306b\u30011 \u3064\u306e\u7a4d\u4e71\u96f2\u304c\u751f\u307e\u308c\u3066\u3001\u80b2\u3063\u3066\u3001\u5927\u96e8\u3092\u964d\u3089\u305b\u3066\u3001\u6d88\u3048\u3066\u3044\u304f\u307e\u3067\u3092\u3001\u304a\u663c\u304b\u3089\u5915\u65b9\u307e\u3067\u306e\u6642\u9593\u3067\u898b\u305b\u307e\u3059\u3002\u5149\u306f\u70b9\u6ec5\u3055\u305b\u307e\u305b\u3093\u3002<\/p><ul><li>\ud83c\udf21 \u663c\u306e\u6c17\u6e29\u30fb\ud83d\udca7 \u6e7f\u5ea6\u3067\u3001\u96f2\u304c\u3069\u3053\u307e\u3067\u80b2\u3064\u304b\u304c\u5909\u308f\u308b<\/li><li>\ud83d\udd50 \u6642\u523b\u306e\u3064\u307e\u307f\u3067\u3001\u597d\u304d\u306a\u5834\u9762\u306b\u9032\u3081\u308b<\/li><li>\u2601\ufe0f \u308f\u305f\u96f2 \u2192 \u7a4d\u4e71\u96f2 \u2192 \u304b\u306a\u3068\u3053\u96f2 \u2192 \u304f\u305a\u308c\u308b<\/li><li>\u2b06 \u4e0a\u6607\u6c17\u6d41\u30fb\u2b07 \u51b7\u305f\u3044\u5439\u304d\u51fa\u3057\u30fb\u2614 \u96e8\u30fb\ud83e\uddca \u96f9<\/li><li>\ud83d\udcc8 \u9ad8\u3055\u3068\u6e29\u5ea6\u306e\u30b0\u30e9\u30d5\uff08\u307e\u308f\u308a\u306e\u7a7a\u6c17\u3068\u306e\u307c\u308b\u7a7a\u6c17\uff09\u3001\u306e\u307c\u308b\u7a7a\u6c17\u306e\u304b\u305f\u307e\u308a\u3001\u6696\u304b\u3044\uff0f\u51b7\u305f\u3044\u7a7a\u6c17\u306e\u8272<\/li><\/ul><p class=\"note\">\u5e83\u544a\u306a\u3057\u30fb\u767b\u9332\u306a\u3057\u3002\u6642\u9593\u3084\u9ad8\u3055\u306f\u76ee\u5b89\u3067\u3059\u3002<\/p>'},\n en:{title:'Cloudburst (life of a thunderstorm)',hSl:'\ud83c\udf9a Controls',warmL:'\ud83d\udfe7 Near the ground: warm, light air',coldL:'\ud83d\udfe6 Aloft: cold, heavy air',envL:'surrounding air',parL:'rising parcel',topL:'can rise to',\n gNote:'\ud83d\udcc8 Left graph: grey is the surrounding air, orange / blue is the rising parcel. While the parcel is warmer (orange) it is lighter and keeps rising. Where the lines cross it stops \u2014 roughly the cloud top. The wider the orange gap, the more \"unstable\" the air and the taller the cloud.',\n sT:'\ud83c\udf21 Midday ground temperature',sRH:'\ud83d\udca7 Humidity',sP:'\ud83d\udd50 Time (drag to move)',hF:'\ud83d\udcd6 About summer storms',\n play:'\u23f8 Pause',pause:'\u25b6 Play',spd:'Speed',re:'\u21ba From noon',\n s0:'Clear',s1:'Forming',s2:'Growing',s3:'Mature (downpour)',s4:'Dissipating',\n st0:'<b>\u2600\ufe0f Sunny midday<\/b>: strong sunshine heats the ground and the air just above it. Warm air is lighter, so it starts to rise (an updraft).',\n st1:'<b>\u2601\ufe0f Cumulus forms<\/b>: the rising air cools, vapour condenses, and puffy \"cotton\" clouds appear.',\n st2:'<b>\u2b06 The cloud grows<\/b>: condensation releases heat, making the air in the cloud even lighter, so it towers upward. The top turns to ice.',\n st3:'<b>\u26c8 Downpour and thunder<\/b>: the top hits the \"ceiling\" of the weather (top of the troposphere) and spreads into an anvil. Heavy rain or hail falls at once and a cold gust spreads along the ground. If you hear thunder, go indoors or into a car.',\n st4:'<b>\ud83c\udf24 Dissipating<\/b>: cold falling rain chokes the updraft; the cloud rains itself out and breaks apart, leaving a cool evening breeze.',\n none:'<b>Not much growth today<\/b>: the ground isn\\'t warm enough or the air is too dry for a thunderstorm \u2014 just a few cotton clouds.',\n hud:function(c,tp,top,r){return '\ud83d\udd50 <b>'+c+'<\/b><br>\ud83c\udf21 ground \u2248 '+tp.toFixed(1)+' \u00b0C<br>\u2601\ufe0f cloud top \u2248 '+top.toFixed(1)+' km<br>\u2614 '+r}, r0:'none',r1:'light',r2:'heavy',r3:'very heavy',\n pow:function(p){return '\u26a1 Today\\'s storm energy: '+(p<0.3?'low (cotton clouds)':p<0.6?'moderate (showers)':p<0.85?'high (cloudburst)':'very high (violent storm, hail)')+'. The longer the rising parcel stays warmer than its surroundings, the taller the cloud. Surroundings: about 1 \u00b0C / 100 m up to 1 km, about \u22126 \u00b0C at 5 km (a summer guide), then 0.65 \u00b0C / 100 m; the parcel starts 1.5 \u00b0C warmer from the midday sun (illustrative).'},\n info:'<b>\u26c8 Cloudburst v0.2.0<\/b><p>Watch one thunderstorm be born, grow, pour and fade between noon and evening. Nothing flashes.<\/p><ul><li>\ud83c\udf21 Temperature and \ud83d\udca7 humidity decide how tall it grows<\/li><li>\ud83d\udd50 Drag the time to any stage<\/li><li>\u2601\ufe0f Cumulus \u2192 cumulonimbus \u2192 anvil \u2192 decay<\/li><li>\u2b06 Updraft, \u2b07 cold outflow, \u2614 rain, \ud83e\uddca hail<\/li><li>\ud83d\udcc8 Height\u2013temperature graph, rising parcel, warm / cold air shading<\/li><\/ul><p class=\"note\">No ads, no sign-up. Times and heights are rough guides.<\/p>'}};\nfunction t(k){return TX[L][k]}\n/* ---- \u7a7a\u6c17\u306e\u304b\u305f\u307e\u308a \u3068 \u307e\u308f\u308a\u306e\u7a7a\u6c17 ---- */\nvar HEAT=1.5;\nfunction dewPt(T,RH){var a=17.62,b=243.12,g=Math.log(Math.max(1,RH)/100)+a*T/(b+T);return b*g/(a-g)}\nfunction pres(h){return 1013.25*Math.pow(Math.max(0.01,1-0.0225577*h),5.25588)}\nvar T5=-6;function envT(h){var t1=S.T-9.8*Math.min(h,1);if(h<=1)return t1;if(h<=5)return t1+(T5-t1)*(h-1)/4;return T5-6.5*(Math.min(h,12)-5)}\nfunction gm(Tc,p){var Tk=Tc+273.15,es=6.112*Math.exp(17.67*Tc/(Tc+243.5)),rs=0.622*es/Math.max(1, n  <div style=\"display:flex;align-items:center\"><b style=\"color:#39ff14;font:bold 16px 'Courier New',monospace;margin-right:auto\">\u26a1 \u96f7\u306e\u8c46\u77e5\u8b58<\/b><button class=\"b\" id=\"iClose\">\u2715<\/button><\/div>\n  <h3>\u23f1 \u5149\u3063\u3066\u304b\u3089\u4f55\u79d2\uff1f<\/h3>\n  <p>\u5149\u306f\u4e00\u77ac\u3067\u5c4a\u304d\u307e\u3059\u304c\u3001\u97f3\u306f <b>1 \u79d2\u306b\u7d04 340m<\/b>\uff08\u6c17\u6e29 15\u2103 \u306e\u3068\u304d\uff09\u3057\u304b\u9032\u307f\u307e\u305b\u3093\u3002\u5149\u3063\u3066\u304b\u3089\u96f7\u9cf4\u307e\u3067\u306e\u79d2\u6570\u306b 340 \u3092\u304b\u3051\u308b\u3068\u3001\u3060\u3044\u305f\u3044\u306e\u8ddd\u96e2\uff08m\uff09\u304c\u308f\u304b\u308a\u307e\u3059\u3002<\/p>\n  <table><tr><td>3 \u79d2<\/td><td>\u7d04 1km<\/td><\/tr><tr><td>6 \u79d2<\/td><td>\u7d04 2km<\/td><\/tr><tr><td>10 \u79d2<\/td><td>\u7d04 3.4km<\/td><\/tr><tr><td>30 \u79d2<\/td><td>\u7d04 10km<\/td><\/tr><\/table>\n  <p>\u97f3\u306e\u901f\u3055\u306f\u6c17\u6e29\u3067\u5c11\u3057\u5909\u308f\u308a\u307e\u3059\uff08\u304a\u304a\u3088\u305d 331 \uff0b 0.6 \u00d7 \u6c17\u6e29\u3014\u2103\u3015 m\uff0f\u79d2\uff09\u3002\u590f\u306e 30\u2103 \u306a\u3089\u7d04 349m\u3001\u51ac\u306e 0\u2103 \u306a\u3089\u7d04 331m \u3067\u3059\u3002<\/p>\n  <h3>\ud83d\udd0a \u8fd1\u3044\u96f7\u3068\u9060\u3044\u96f7\u306e\u97f3<\/h3>\n  <p>\u8fd1\u3044\u96f7\u306f\u300c\u30d0\u30ea\u30d0\u30ea\u30c3\u300d\u3068\u9ad8\u304f\u92ed\u3044\u97f3\u3001\u9060\u3044\u96f7\u306f\u300c\u30b4\u30ed\u30b4\u30ed\u2026\u300d\u3068\u4f4e\u304f\u9577\u3044\u97f3\u306b\u306a\u308a\u307e\u3059\u3002\u9ad8\u3044\u97f3\u307b\u3069\u9014\u4e2d\u3067\u5f31\u307e\u308a\u3084\u3059\u304f\u3001\u7a32\u59bb\u306e\u3044\u308d\u3044\u308d\u306a\u5834\u6240\u304b\u3089\u97f3\u304c\u5c11\u3057\u305a\u3064\u9045\u308c\u3066\u5c4a\u304f\u306e\u3067\u3001\u9060\u3044\u307b\u3069\u9577\u304f\u4f4e\u304f\u97ff\u304d\u307e\u3059\u3002\u96f7\u9cf4\u306f\u3001\u3075\u3064\u3046 15\u301c20km \u \u7d04 1,000 km<\/b> \u306e\u6240\u307e\u3067\u5149\u3063\u3066\u3044\u305f\u305f\u3081\u3068\u3055\u308c\u3066\u3044\u307e\u3059\u3002\u307e\u305f\u3001\u8d64\u3067\u306f\u306a\u304f\u30de\u30bc\u30f3\u30bf\uff08\u8d64\u7d2b\uff09\u306b\u898b\u3048\u305f\u306e\u306f\u3001\u592a\u967d\u306e\u5149\u304c\u7a7a\u3067\u6563\u3089\u3070\u3063\u305f\u9752\u3044\u5149\u304c\u91cd\u306a\u3063\u3066\u3044\u305f\u305f\u3081\u3068\u8003\u3048\u3089\u308c\u3066\u3044\u307e\u3059\u3002<\/p>'],\n ['\ud83d\uddfa \u30aa\u30fc\u30ed\u30e9\u30d9\u30eb\u30c8\u3068\u306f','<p>\u30aa\u30fc\u30ed\u30e9\u304c\u3088\u304f\u51fa\u308b\u3001\u5730\u78c1\u6c17\u306e\u6975\u3092\u56f2\u3080\u8f2a\u306e\u5f62\u306e\u5730\u5e2f\u3092\u300c\u30aa\u30fc\u30ed\u30e9\u30d9\u30eb\u30c8\uff08\u30aa\u30fc\u30ed\u30e9\u5e2f\uff09\u300d\u3068\u547c\u3073\u307e\u3059\u3002\u82f1\u8a9e\u3067\u306f <i>auroral oval<\/i> \u3067\u3059\u3002\u5317\u534a\u7403\u3067\u306f\u3060\u3044\u305f\u3044\u5317\u7def 65\u00b0 \u3088\u308a\u5317\u3001\u65c5\u884c\u306e\u6848\u5185\u3067\u306f\u300c65\u301c80\u00b0\u300d\u3068\u3055\u308c\u308b\u3053\u3068\u3082\u3042\u308a\u307e\u3059\u3002\u5317\u6b27\u30fb\u30a2\u30a4\u30b9\u30e9\u30f3\u30c9\u30fb\u30ab\u30ca\u30c0\u30fb\u30a2\u30e9\u30b9\u30ab\u306a\u3069\u304c\u5165\u308a\u307e\u3059\u3002\u8f2a\u306e\u4e2d\u5fc3\u306f\u5730\u56f3\u306e\u5317\u6975\u3067\u306f\u306a\u304f\u5730\u78c1\u6c17\u306e\u6975\u306a\u306e\u3067\u3001\u30ab\u30ca\u30c0\u5074\u3067\u306f\u8f2a\u304c\u5357\u3078\u4e0b\u304c\u308a\u3001\u5317\u7def 62\u00b0 \u306e\u30a4\u30a8\u30ed\u30fc\u30ca\u30a4\u30d5\u3067\u3082\u3088\u304f\u898b\u3048\u307e\u3059\u3002<\/p>'],\n ['\ud83c\udfad \u3044\u308d\u3044\u308d\u306a\u898b\u3048\u65b9','<ul><li><b>\u5f27\uff08\u30a2\u30fc\u30af\uff09<\/b>\uff1a\u6a2a\u9577\u306e\u5e2f\u304c\u9759\u304b\u306b\u304b\u304b\u308b<\/li><li><b>\u30ab\u30fc\u30c6\u30f3<\/b>\uff1a\u3072\u3060\u306e\u3088\u3046\u306b\u6298\u308c\u3001\u7e26\u306e\u7b4b\u304c\u4e26\u3076<\/li><li><b>\u30b3\u30ed\u30ca<\/b>\uff1a\u771f\u4e0a\u306b\u51fa\u305f\u3068\u304d\u3001\u7b4b\u304c 1 \u70b9\u306b\u96c6\u307e\u3063\u3066\u898b\u3048\u308b<\/li><li><b>\u307c\u3093\u3084\u308a<\/b>\uff1a\u96f2\u306e\u3088\u3046\u306b\u6de1\u304f\u5e83\u304c\u308b<\/li><li><b>\u8108\u6253\u3064\u30aa\u30fc\u30ed\u30e9<\/b>\uff1a\u660e\u308b\u3055\u304c\u6570\u79d2\u3054\u3068\u306b\u5f37\u304f\u306a\u3063\u305f\u308a\u5f31\u304f\u306a\u3063\u305f\u308a\u3057\u307e\u3059\u3002\u70b9\u6ec5\u306b\u8fd1\u3044\u52d5\u304d\u306b\u306a\u308b\u305f\u3081\u3001\u3053\u306e\u753b\u9762\u3067\u306f\u63cf\u304b\u305a\u3001\u8aac\u660e\u3060\u3051\u306b\u3057\u3066\u3044\u307e\u3059<\/li><\/ul>'],\n ['\ud83d\udc40 \u898b\u308b\u3068\u304d\u306e\u30b3\u30c4','<ul><li>\u8857\u306e\u660e\u304b\u308a\u304b\u3089\u96e2\u308c\u305f\u3001\u6697\u3044\u5834\u6240\u3078\u884c\u304f<\/li><li>\u76ee\u3092\u6697\u3055\u306b\u6163\u3089\u3059\uff0820 \u5206\u304f\u3089\u3044\u304b\u304b\u308b\u3068\u8a00\u308f\u308c\u307e\u3059\uff09<\/li><li>\u3046\u3059\u3044\u30aa\u30fc\u30ed\u30e9\u306f\u3001\u76ee\u3067\u306f\u767d\u3063\u307d\u3044\u96f2\u306e\u3088\u3046\u306b\u898b\u3048\u308b\u3053\u3068\u304c\u3042\u308a\u307e\u3059\u3002\u30ab\u30e1\u30e9\u3067\u9577\u304f\u5149\u3092\u96c6\u3081\u308b\u3068\u3001\u7dd1\u3084\u8d64\u304c\u306f\u3063\u304d\u308a\u5199\u308a\u307e\u3059<\/li><li>\u5bd2\u3044\u5834\u6240\u306a\u306e\u3067\u3001\u3042\u305f\u305f\u304b\u3044\u670d\u3068\u624b\u888b\u3092<\/li><\/ul>'],\n ['\ud83d\udd17 \u307b\u304b\u306e\u30da\u30fc\u30b8\u3068\u306e\u3064\u306a\u304c\u308a','<p>\u30aa\u30fc\u30ed\u30e9\u304c\u5149\u308b\u306e\u306f\u3001\u5b87\u5b99\u3068\u306e\u5883\u76ee\u3068\u8a00\u308f\u308c\u308b <b>\u30ab\u30fc\u30de\u30f3\u30e9\u30a4\u30f3\uff08\u7d04 100 km\uff09<\/b> \u3088\u308a\u4e0a\u3067\u3059\u3002\u5730\u4e0a\u304b\u3089\u5b87\u5b99\u307e\u3067\u306e\u9ad8\u3055\u306f <a href=\"https://meridibrand.com/ground/\">\ud83e\udea8 MeridiGround<\/a> \u3067\u3001\u661f\u7a7a\u306f <a href=\"https://meridibrand.com/stars/\">\ud83c\udf0c MeridiStars<\/a> \u3067\u898b\u3089\u308c\u307e\u3059\u3002<\/p>']],\n en:[\n ['\ud83c\udfa8 Colour depends on height and gas','<p>Tiny particles from the Sun hit the upper air and make it glow.<\/p><table><tr><th>Colour<\/th><th>Gas<\/th><th>Height (approx.)<\/th><\/tr><tr><td><span class=\"sw\" style=\"background:#55ff99\"><\/span>Green<\/td><td>Oxygen<\/td><td>~100\u2013200 km<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#ff5050\"><\/span>Red<\/td><td>Oxygen<\/td><td>above ~200 km<\/td><\/tr><tr><td><span class=\"sw\" style=\"background:#c070ff\"><\/span>Pink / purple / blue<\/td><td>Nitrogen<\/td><td>lower edge (~100 km)<\/td><\/tr><\/table><p>Red light takes about two minutes to be emitted. Lower down, where the air is dense, the atom bumps into others first and can\\'t glow \u2014 so red only appears high up, where the air is thin.<\/p>'],\n ['\ud83c\udf0d Where can you see it?','<p>Auroras are most common under the ring around the magnetic poles (the auroral oval) \u2014 roughly 65\u201372\u00b0N in the north.<\/p><ul><li><b>North<\/b>: Troms\u00f8 (Norway), Abisko (Sweden), Finnish Lapland, Iceland, Fairbanks (Alaska), Yellowknife (Canada)<\/li><li><b>South<\/b>: Antarctica, Hobart in Tasmania (Australia), southern New Zealand \u2014 the aurora australis<\/li><\/ul><p>Farther from the oval, you need a strong geomagnetic storm.<\/p>'],\n ['\ud83c\uddef\ud83c\uddf5 Seen in Japan (May 2024)','<p>On the night of 11 May 2024, after a series of large solar flares, a red\u2013purple \"low-latitude aurora\" was seen across Japan, including Hokkaido.<\/p><p>A study found it was visible as far south as Hyogo because it glowed unusually high \u2014 up to <b>about 1,000 km<\/b>. It looked magenta rather than red because blue scattered sunlight overlapped it.<\/p>'],\n ['\ud83d\uddfa What is the auroral oval?','<p>The ring-shaped zone around each geomagnetic pole where auroras are most frequent. In the north it lies roughly beyond 65\u00b0N \u2014 travel guides sometimes say 65\u201380\u00b0N \u2014 covering the Nordic countries, Iceland, Canada and Alaska. Because it is centred on the geomagnetic pole, not the geographic one, it dips south over Canada, so Yellowknife (62\u00b0N) sees it often.<\/p>'],\n ['\ud83c\udfad Forms of aurora','<ul><li><b>Arc<\/b>: a calm band along the horizon<\/li><li><b>Curtain<\/b>: folds with vertical rays<\/li><li><b>Corona<\/b>: overhead rays converging on a point<\/li><li><b>Diffuse<\/b>: a faint, cloud-like glow<\/li><li><b>Pulsating aurora<\/b>: brightens and dims every few seconds. Because that is close to flashing, it is described here but not drawn<\/li><\/ul>'],\n ['\ud83d\udc40 Viewing tips','<ul><li>Get away from city lights<\/li><li>Let your eyes adjust to the dark (often said to take about 20 minutes)<\/li><li>A faint aurora can look like a pale whitish cloud to the eye; long camera exposures bring out the green and red<\/li><li>It\\'s cold \u2014 dress warmly<\/li><\/ul>'],\n ['\ud83d\udd17 Related pages','<p>Auroras glow above the <b>K\u00e1rm\u00e1n line (~100 km)<\/b>, often called the edge of space. Climb there in <a href=\"https://meridibrand.com/ground/\">\ud83e\udea8 MeridiGround<\/a>, and see the stars in <a href=\"https://meridibrand.com/stars/\">\ud83c\udf0c MeridiStars<\/a>.<\/p>']]};\n/* ---- \u753b\u9762 ---- */\nfunction render(){document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(function(el){var v=TX[L][el.dataset.t];if(typeof v==='string')el.textContent=v});\n var sm=innerWidth<=820;$('bLang').textContent=sm?(L==='ja'?'EN':'\u65e5\u672c\u8a9e'):(L==='ja'?'\ud83c\udf10 EN':'\ud83c\udf10 \u65e5\u672c\u8a9e');$('bLite').textContent=sm?(lite?'\u2728':'\ud83e\udeb6'):(lite?t('lite1'):t('lite0'));\n $('pl').innerHTML=PL.map(function(q){return'<button data-p=\"'+q[0]+'\"'+(q[0]===O.place?' class=\"on\"':'')+'><span class=\"e\">'+q[1]+'<\/span>'+(L==='ja'?q[2]:q[3]).rep var CL={ja:'<b style="color:#39ff14">☁️ MeridiSkies v1.0.0</b><p>Stars（星空）・Ground（陸）・Depths（海）と並ぶ、空と天気の図鑑と実験です。広告なし・登録なし。絵も音も、この端末の中だけで作っています。光は点滅させません。</p><p>☕ <a href="https://buymeacoffee.com/meridius" target="_blank" rel="noopener">Buy Me a Coffee</a> ・ <a href="https://meridibrand.com/">meridibrand.com</a></p><hr style="border:none;border-top:1px solid #1e3a1e"><b>📜 v1.0.0 — 2026-11-24（初公開）</b><ul><li>11 のタブ：⬆ 空を昇る・🌧 雨と雪・⚡ 雷・🌌 オーロラ・🏔 フェーン・⛈ 夕立・🌙 放射冷却・🌈 空の色・🗾 日本と地域・🌍 地球・📖 図鑑（79 項目）</li><li>広告なし・登録なし・1 つの HTML ファイル。数字は気象庁などの資料をもとにした目安です</li></ul><b>📜 v1.0.0-rc6 — 2026-11-20〜24</b><ul><li>🌙 放射冷却の雲と霧を本気に：夜の雲は底のもこもこと陰影を点ごとに計算し、朝夕は下から赤く照らされる。放射霧は地面をはうように広がり、上の縁がもこもこ、ゆっくり流れる。冬の靄の朝は朝日の近くが金色に光り、光の筋が差す</li><li>Fixed: 🌄 盆地の雲海で「熱を返す／熱が逃げる」の文字が山に隠れていたのを、谷の上に出すように</li><li>⚡ 雷の雲を本気に：夜の雷雲の底を点ごとに計算。もこもこに垂れ下がる底と陰影。稲妻が落ちると雲の底がその場所から青白く光り、雲の中だけの光はそこだけ内側からぼうっと光る（薄い所ほど透けて明るい）。雲はゆっくり流れる</li><li>🌧 雨と雪に本気の雨雲・雪雲：空を見上げた雲の底を点ごとに計算。遠くほど縮んで見え、風の強さで流れる。強い雨ほど空いっぱいに暗く垂れこめ、遠くには雨脚（雪はぼんやりした雪のカーテン）が垂れ下がる。霧・ホワイトアウトでは雲もかすむ</li><li>✈️ 空を昇るの旅客機が進む向きに頭を向けて飛ぶように</li><li>⬆ 空を昇るの雲を本気に：昇る高さに合わせて、晴れの日は大きさも間隔もばらばらな、底が平らでてっぺんがもこもこのわた雲（積雲）と、風に流される細い白いすじの巻雲（すじ雲）。雨・雪の日は霧のような層雲、暗い乱層雲、高層雲、うすい巻層雲。積乱雲の日はそびえる塔、まわりの積雲・高積雲、てっぺんのかなとこ。雲の厚みから明暗を計算し、雲の中に入ると白い霧に包まれる</li><li>🏔 フェーンの雲を本気に：風上の斜面をはい上がる雲を点ごとに光の計算で描く。てっぺんはもこもこ、雨の降る底は暗い灰色、山を越えた雲は風下の斜面を少し下りて消える「フェーンの壁」。高い山で湿った風のときは風下につるし雲。雲は風に乗って流れる</li><li>📖 図鑑に十種雲形の図：10種類の雲を高さの順に、雲ごとの形（もこもこ・すじ・うろこ・幕）と光の明暗で描いた図。上層・中層・下層の目安線つき。雲を押すとその雲の説明が開く</li><li>🌈 空の色の雲を本気に：雲の厚みから光を計算。昼は白く底が灰色、夕焼けは太陽が低いので下から照らされて底が赤・オレンジに光り、太陽の近くの縁が輝く。日没後はピンク〜紫に</li><li>☁️ 夕立の雲を本気に：雲を立体として計算し、日の当たる側は白く、反対側と底は灰色に。表面に小さなもこもこ、底は平ら。時刻とともに積雲→雄大積雲→積乱雲と育ち、てっぺんが空の天井にぶつかると平らなかなとこ雲が風下へ広がる</li><li>🌌 オーロラを本気に：画面の点ごとに計算して描く方式に。S字にうねる細いリボン、髪の毛のように細い筋、下の縁がいちばん明るい黄緑、上は紫へ溶ける。強い夜はすそがマゼンタに染まる。コロナは光の束と暗い隙間が1点に集まる形に（黒いトゲはなし）。🪶軽くする・WebGL が使えない端末は今までの描き方</li><li>⚡ 雷を本気に：細かく折れ曲がって枝分かれする稲妻、細い枝がカクッカクッと下りてくる「ステップトリーダー」、地面に届いた1本だけ太く光る「帰還雷撃」、同じ道が3〜5回光る（💡強い光ありのときだけピカッピカッ。なしは1回のやわらかい光にまとめる）、白い芯＋青紫のにじみ、目に残る残像、雲の中だけで光る雷（音なし）</li><li>🌅 冬の靄の朝：🌙 放射冷却の朝の場面に、低いオレンジの朝日と、朝日に照らされて金色に光る地面近くの靄（湿度が高く風が弱い朝ほど濃く、光の筋も出る）</li><li>例を追加：🌙 放射冷却「🌅 冬の靄の朝」、🌈 空の色「🌅 冬の靄の朝」（例 13、豆知識 15）</li><li>豆知識「🌅 冬の朝日はなぜオレンジ？」（霧と靄の見通しの境目 1 km も）</li></ul><b>📜 v1.0.0-rc5 — 2026-11-18</b><ul><li>世界の季節のことばの数字を資料で確認して修正：ハルマッタンの時期を「11 月下旬〜3 月中旬ごろ」に、インドのモンスーン入りを「平年 6 月 1 日ごろ（前後 1 週間ほど）」に</li><li>修正：オーストラリア北部の雨季を「12〜3 月」から、オーストラリア気象局の定義「10 月〜4 月（乾季 5〜9 月）」に（図鑑と 🗾 日本と地域の豆知識）</li><li>確認済み：北極圏は北緯 約 66.6°（66°34′）</li></ul><b>📜 v1.0.0-rc4 — 2026-11-18</b><ul><li>📖 図鑑 v0.2.0：新しい種類「🌐 世界の季節のことば」13 項目（インディアンサマー、ドッグデイズ、メイグレー・ジューングルーム、白夜と極夜、ミストラル、シロッコ、ハルマッタン、チヌーク、サンタアナ、ハブーブ、インドのモンスーン入り、雨季と乾季、サザリーバスター）。それぞれ日本で似た言葉（小春日和・土用・からっ風・黄砂・梅雨入りなど）も。計 79 項目</li></ul><b>📜 v1.0.0-rc3 — 2026-11-18</b><ul><li>🍂 木枯らしを追加：🗾 日本と地域の地図（10 月下旬〜11 月に冷たい北風とラベル・説明）、📆 1 年の目安に「木枯らし」の段、豆知識「木枯らし 1 号と春一番」、📖 図鑑に項目（計 66）。木枯らし 1 号は東京地方・近畿地方のみの発表</li></ul><b>📜 v1.0.0-rc2 — 2026-11-18</b><ul><li>📖 図鑑に 3 項目追加（計 65）：🥵 熱中症と暑さ指数（WBGT・熱中症警戒アラートは暑さ指数 33 以上の予想・特別警戒アラート・備え）、➰ シアーライン（収束線）、🌡 暑さ指数の目安</li><li>🗾 日本と地域：➰ シアーラインのボタン（北寄りと南寄りの風がぶつかる線・育つ雲・説明）、豆知識「熱中症と暑さ指数」</li></ul><b>📜 v1.0.0-rc — 2026-11-18</b><ul><li>📖 図鑑のタブを追加：雲 12・雨と雪と氷 6・風と気圧 7・嵐と雷 6・光の現象 8・日本の天気 8・地球の気候 8・単位とことば 7 の計 62 項目</li><li>ことばで探す（日本語・読み・英語、当たった所に印）、種類でしぼりこみ、カードを押すと詳しい説明と数字の表、関係するタブへ移動</li><li>数字は気象庁の予報用語に合わせて確認（雨の強さ 10/20/30/50/80 mm、雹は直径 5 mm 以上、爆弾低気圧の基準、線状降水帯の大きさ）</li><li>🗾 日本と地域・🌍 地球：説明の欄を、地図との間に少しすき間（約 26 px）を残す所まで広げる</li><li>これで 11 のタブがすべてそろいました</li></ul><b>📜 v0.9.1 — 2026-11-18</b><ul><li>🗾 日本と地域・🌍 地球：左下の説明の欄をスリムに（幅 300 px まで）し、地図と地球儀を大きく</li><li>画面の端で文字（「オホーツク海高気圧」など）が切れないよう、ラベルを画面の内側に収める</li><li>🌍 大気の大循環：地球儀の両はしに、ハドレー循環・フェレル循環・極循環の輪（地上と上空の風の向きを動く矢印で）と、のぼる・下りる緯度（0°・30°・60°）</li></ul><b>📜 v0.9.0 — 2026-11-18</b><ul><li>🌍 地球のタブを追加：ドラッグで回せる地球儀。🌐 大気の大循環（熱帯収束帯・亜熱帯高圧帯と砂漠の帯・貿易風・偏西風・極偏東風）、💨 ジェット気流の蛇行（寒気の南下・暖気の北上・ブロッキング高気圧・極渦）、🌊 エルニーニョ／ラニーニャ（海水温の偏差・貿易風・雲の位置、日本への影響の傾向）、🌏 世界の気候帯（季節で動く雨の帯・モンスーン）、🌀 世界の熱帯低気圧（台風・ハリケーン・サイクロンと回る向き）、🔄 南半球の季節（太陽が真上にくる緯度）、豆知識 6 つ</li><li>🗾 日本と地域 v0.2.0：🔬 前線と低気圧の実験室（温帯低気圧の一生 ①〜⑤、4 種類の前線の記号、✂️ 温暖前線と寒冷前線の断面図、💣 爆弾低気圧＝気象庁の基準 24 hPa×sin(緯度)/sin60° と緯度つまみ・24 時間の気圧低下の判定）、豆知識 2 つ追加</li></ul><b>📜 v0.8.1 — 2026-11-18</b><ul><li>🗾 日本と地域：小さめの PC 画面で、左下の説明と前線・台風が重ならないよう、地図を画面の右端に寄せる（大きさはそのまま）</li></ul><b>📜 v0.8.0 — 2026-11-18</b><ul><li>🗾 日本と地域のタブを追加：日本列島の地図に、月ごとの天気のしくみを重ねる（月のつまみ・▶ 1 年を動かす）</li><li>❄️ 冬型（西高東低の等圧線・すじ雲・JPCZ・日本海側の雪・からっ風）、🌸 春一番、☔ 梅雨前線（沖縄→本州へ北上）、☀️ 太平洋高気圧、🍂 秋雨前線（南下）、🌀 7〜10 月の台風の進路</li><li>🌫 やませ・🌧 線状降水帯（雨雲が次々に生まれるバックビルディング、気象庁の長さ 50〜300 km・幅 20〜50 km）のボタン</li><li>⛰ 山脈（奥羽・越後〜飛騨・中国）を描き、地形が天気を分けるしくみと MeridiGround へのつながり</li><li>流れる風の粒、📆 1 年の目安のカレンダー、例 8 つ、豆知識 8 つ（南半球の季節・サイクロン含む）</li></ul><b>📜 v0.7.2 — 2026-11-18</b><ul><li>🌈 空の色 v0.3.0：🔭 ハロ全体を見る（太陽が高くても 22°・46° の輪が画面に収まるよう、天頂の向こうまで空を広げる。ON/OFF）</li><li>幻日の離れ方を、空の上の本当の角度で表示（太陽 57° で約 38°）</li><li>✨ 光の現象 8 つ：👤 ブロッケン現象（影と光輪）、💚 グリーンフラッシュ（拡大して再生）、☀️ 薄明光線、🌸 ビーナスベルトと地球の影（自動で進む）、🔆 反薄明光線、🏝 蜃気楼・逃げ水（富山湾）、🤍 白虹、🌕 月虹</li></ul><b>📜 v0.7.1 — 2026-11-18</b><ul><li>🌈 空の色 v0.2.0：🔆 ハロとアークの見方を追加。22° ハロ（内側が赤）・46° ハロ、幻日（太陽の高さで離れ方が変わる・61° より上で消える）、幻日環、上部タンジェントアーク、環天頂アーク（32° より下）、環水平アーク（58° より上）、光冠・彩雲（水の粒）。位置は氷の六角板（屈折率 1.31）の屈折から計算</li><li>例 4 つ追加（幻日・環天頂アーク・環水平アーク・光冠と彩雲、計 12）、豆知識 6 つ追加（計 14）、太陽を直接見ない注意</li></ul><b>📜 v0.7.0 — 2026-11-18</b><ul><li>🌈 空の色のタブを追加：太陽の高さ（−12〜90°）・かすみ・雲・雨つぶで、青空・朝焼け・夕焼け・マジックアワー・ブルーアワー・夜まで変わる空</li><li>太陽の光の色、夕日に染まる雲、星、📏 光が空気を通る長さの図（真上の約何倍か）</li><li>🌈 太陽を背にすると虹：主虹 42°・副虹 51°（色が逆）・内側が明るい・アレキサンダーの暗帯、太陽が 42° より高いと見えない</li><li>▶ 日の入りまで動かす、例 8 つ、豆知識 8 つ（火星の青い夕焼けなど）</li><li>⛈ 夕立：雹を小さく（ピンポン玉 → 小粒）</li></ul><b>📜 v0.6.1 — 2026-11-17</b><ul><li>🌙 放射冷却 v0.2.0：🌌｜☁️ くらべるモード（左右に晴れとくもり）、✅ 冷え込みの 3 つの条件、🔺 逆転層のミニグラフ（地面・50 m・100 m・200 m）、🌄 山から見る雲海（例「盆地の雲海」）、📈 24 時間のグラフ（14 時ごろ最高・日の出ごろ最低）、豆知識 3 つ追加（計 9 つ）</li></ul><b>📜 v0.6.0 — 2026-11-17</b><ul><li>🌙 放射冷却のタブを追加：夕方 18 時〜朝 6 時の冷え込みを、雲の量・風・湿度・夕方の気温で比べる</li><li>地面から逃げる熱（赤外線）の波、雲が熱を返す様子、露・霜・放射霧、日の出</li><li>晴れ・くもりとくらべる気温のグラフ（露点の線つき）、朝 6 時の予想（目安）、例 8 つ（砂漠の夜・町の夜など）、豆知識 6 つ</li><li>⛈ 夕立：ノートパソコンの画面でグラフ・説明・文字が重なっていたのを直し、雹を大きく、地面で跳ねるように</li></ul><b>📜 v0.5.0 — 2026-11-17</b><ul><li>⛈ 夕立（積乱雲の一生）のタブを追加：お昼〜夕方の時間で、晴れ → わた雲 → 発達 → 大雨と雷 → おとろえるを再現</li><li>昼の気温・湿度で雲の育ち方が変わる（わた雲どまり〜雹まで）、時刻のつまみ、段階の帯</li><li>上昇気流・冷たい吹き出し・雨・雹・かなとこ雲。光は点滅させません</li><li>📈 高さと温度のグラフ（まわりの空気とのぼる空気）、のぼる空気のかたまり、暖かい／冷たい空気の色を追加。雲の高さは 2 本の線が交わる高さで決まります</li><li>豆知識 6 つ（大気が不安定とは・一生の短さ・夕立とゲリラ豪雨・急に涼しくなる理由・雹・雷が聞こえたら）</li></ul><b>📜 v0.4.0 — 2026-11-17</b><ul><li>🏔 フェーン現象のタブを追加：山を越える空気のかたまりのアニメ、温度のグラフ、雲ができ始める高さ、風上の雨</li><li>つまみ：山の高さ・風上の気温・湿度。例 8 つ（日本の夏・冬の季節風・アルプス・ロッキーなど）</li><li>豆知識 4 つ（なぜ暑くなる・日本の場面・世界の名前・雨の陰）</li></ul><b>📜 v0.3.0 — 2026-11-17</b><ul><li>4 つの試作を 1 つのページにまとめました（⬆ 空を昇る・🌧 雨と雪・⚡ 雷・🌌 オーロラ）</li><li>上の段・日英の切り替え・🪶 軽いモード・このボタンを共通に</li><li>開いているタブだけを動かすので、スマホでも重くなりにくい作り</li><li>「空を昇る」⇔「雨と雪」の行き来が、同じページの中でできるように</li></ul><b>これまで</b><ul><li>⬆ 空を昇る v0.1.0：0〜16 km、気温と気圧、0 ℃ の高さ、雲 10 種類、富士山・旅客機</li><li>🌧 雨と雪 v0.2.0：気温・量・風、ホワイトアウト、3 匹の猫、🎧 ASMR</li><li>⚡ 雷：光ってから音が届くまでの秒数で距離</li><li>🌌 オーロラ v0.2.0：8 か所、4 つの見え方、オーロラベルトの地図</li></ul>',
 en:'<b style="color:#39ff14">☁️ MeridiSkies v1.0.0</b><p>A sky & weather explorer alongside Stars, Ground and Depths. No ads, no sign-up. All drawing and sound happen on your device. Nothing flashes.</p><p>☕ <a href="https://buymeacoffee.com/meridius" target="_blank" rel="noopener">Buy Me a Coffee</a> · <a href="https://meridibrand.com/">meridibrand.com</a></p><hr style="border:none;border-top:1px solid #1e3a1e"><b>📜 v1.0.0 — 2026-11-24 (first release)</b><ul><li>11 tabs: Climb the Sky · Rain & Snow · Lightning · Aurora · Foehn · Cloudburst · Night Cooling · Sky Colors · Japan & Regions · Earth · Guide (79 entries)</li><li>No ads, no sign-up, one HTML file. Figures are rough guides based on JMA and similar sources</li></ul><b>📜 v1.0.0-rc6 — 2026-11-20–24</b><ul><li>🌙 Real clouds & fog in Radiative Cooling: night clouds shaded point by point with lumpy bases, lit red from below at dawn/dusk. Radiation fog creeps along the ground with a billowy top and drifts slowly; on hazy winter mornings it glows gold near the Sun with light rays</li><li>Fixed: in 🌄 Valley sea of clouds, the “heat sent back / escaping” label was hidden behind the mountain — now shown above the valley</li><li>⚡ Real thunderclouds: the night storm base is shaded point by point, with lumpy hanging lobes. A strike lights the base from where it leaves the cloud, and in-cloud flashes glow from inside (brighter where the cloud is thin). Clouds drift slowly</li><li>🌧 Real rain & snow clouds: the cloud base overhead is shaded point by point, shrinking toward the horizon and drifting with the wind. Heavier rain makes a darker, lower, fuller deck, with rain shafts (soft snow curtains) hanging in the distance. Clouds fade in fog and whiteouts</li><li>✈️ The airliner in Climb the Sky now faces the way it flies</li><li>⬆ Real clouds in Climb the Sky: by height — flat-based, lumpy-topped cumulus of varied sizes and spacing, and thin wind-blown streaks of cirrus on clear days; stratus, dark nimbostratus, altostratus and thin cirrostratus on rainy/snowy days; a towering cumulonimbus with surrounding cumulus, altocumulus and its anvil on storm days. Shading from cloud thickness; inside a cloud you are wrapped in white mist</li><li>🏔 Real clouds in Foehn: the windward cloud is shaded point by point — billowy tops, dark grey raining base, and a “foehn wall” that spills over the crest and evaporates on the lee slope. Lenticular cloud downwind of high mountains in moist air. Clouds drift with the wind</li><li>📖 Ten cloud types chart in the Sky Guide: all ten genera drawn by height with their own shapes (heaps, streaks, ripples, sheets) and shading, with high/middle/low guide lines. Tap a cloud to open its entry</li><li>🌈 Real clouds in Sky Colors: light computed through cloud thickness. White with grey bases by day; at sunset lit from below, bases glowing red-orange and rims shining near the Sun; pink to purple after sunset</li><li>☁️ Real storm clouds: computed as 3D shapes — sunlit sides white, far side and base grey, small cauliflower bumps, a flat base. They grow from cumulus to towering cumulus to cumulonimbus, and the top flattens into an anvil spreading downwind</li><li>🌌 Real aurora: drawn per pixel. Thin S-shaped ribbons, hair-fine rays, a lime-bright lower edge fading to purple above; on stormy nights the hem turns magenta. Corona: bundles of light and dark gaps converging to one point (no black spikes). Lite mode / no WebGL keeps the old drawing</li><li>⚡ Real lightning: finely forked bolts, a stepped leader creeping down in jumps, one thick return stroke to the ground, 3–5 re-strikes down the same channel (flickering only with 💡 bright flashes on; otherwise one soft flash), white core with violet glow, afterimage, and silent in-cloud flashes</li><li>🌅 Hazy winter mornings: the Night cooling sunrise now shows a low orange Sun and golden mist near the ground (thicker on damp, calm mornings, with rays)</li><li>New examples: 🌙 Night cooling "🌅 Hazy winter morning", 🌈 Sky colors "🌅 Hazy winter sunrise" (13 examples, 15 facts)</li><li>New fact: "🌅 Why winter sunrises glow orange" (incl. the 1 km fog / mist line)</li></ul><b>📜 v1.0.0-rc5 — 2026-11-18</b><ul><li>Checked & fixed: Harmattan late Nov–mid Mar; Kerala onset ~1 June; northern Australia wet season Oct–Apr (BoM)</li></ul><b>📜 v1.0.0-rc4 — 2026-11-18</b><ul><li>📖 Guide: new “World seasonal words” category (13 entries, with Japanese counterparts)</li></ul><b>📜 v1.0.0-rc3 — 2026-11-18</b><ul><li>🍂 Kogarashi added to Japan map, calendar, facts and Guide</li></ul><b>📜 v1.0.0-rc2 — 2026-11-18</b><ul><li>Guide +3 entries (heatstroke & WBGT, shear line); Japan tab shear-line view</li></ul><b>📜 v1.0.0-rc — 2026-11-18</b><ul><li>📖 New Guide tab: 62 searchable entries in 8 categories with detail cards and links to tabs; JMA-checked figures</li><li>Text boxes widen up to a small gap from the map / globe</li><li>All 11 tabs complete</li></ul><b>📜 v0.9.1 — 2026-11-18</b><ul><li>Slimmer text box, bigger map & globe, labels kept on screen; Hadley / Ferrel / Polar cell loops on the globe</li></ul><b>📜 v0.9.0 — 2026-11-18</b><ul><li>🌍 New Earth tab: turnable globe with general circulation, jet stream waves & blocking, El Niño / La Niña, climate zones, tropical cyclones worldwide, N vs S seasons, 6 facts</li><li>🗾 Japan v0.2.0: fronts & lows lab (life cycle, symbols, cross-sections, bomb-cyclone criterion by latitude)</li></ul><b>📜 v0.8.1 — 2026-11-18</b><ul><li>🗾 Map shifted right on smaller PC screens so the text box no longer covers fronts and typhoons</li></ul><b>📜 v0.8.0 — 2026-11-18</b><ul><li>🗾 New Japan seasons tab: month-by-month map with winter monsoon, JPCZ, spring gale, baiu & autumn fronts, Pacific High, typhoon tracks, yamase, linear rain bands, mountains, flowing winds, year calendar, 8 examples, 8 facts</li></ul><b>📜 v0.7.2 — 2026-11-18</b><ul><li>🌈 Sky colors v0.3.0: fit whole halo on screen; true sundog distance; 8 light shows (Brocken spectre, green flash, crepuscular & anticrepuscular rays, Belt of Venus, mirages, fogbow, moonbow)</li></ul><b>📜 v0.7.1 — 2026-11-18</b><ul><li>🌈 Sky colors v0.2.0: Halos & arcs view (22°/46° halos, sundogs, parhelic circle, tangent arc, circumzenithal & circumhorizontal arcs, corona, iridescence) computed from ice-crystal refraction; 4 examples, 6 facts</li></ul><b>📜 v0.7.0 — 2026-11-18</b><ul><li>🌈 New Sky colors tab: blue sky to sunset, afterglow, blue hour and night; light-path diagram; rainbow view (42°/51°, dark band); 8 examples, 8 facts</li><li>⛈ Cloudburst: smaller hail</li></ul><b>📜 v0.6.1 — 2026-11-17</b><ul><li>🌙 Night cooling v0.2.0: compare mode, 3 conditions checklist, inversion mini-graph, sea of clouds view, 24-hour graph, 3 more facts</li></ul><b>📜 v0.6.0 — 2026-11-17</b><ul><li>🌙 New Night cooling tab: 6 pm–6 am cooling vs cloud, wind, humidity; infrared heat waves, clouds sending heat back, dew / frost / radiation fog, sunrise; comparison graph; 8 examples; 6 facts</li><li>⛈ Cloudburst: fixed overlaps on laptop screens; bigger, bouncing hail</li></ul><b>📜 v0.5.0 — 2026-11-17</b><ul><li>⛈ New Cloudburst tab: one thunderstorm from noon to evening — clear, cumulus, growing, downpour & thunder, decay; temperature / humidity / time controls; updraft, cold outflow, rain, hail, anvil (no flashing); 5 facts</li></ul><b>📜 v0.4.0 — 2026-11-17</b><ul><li>🏔 New Foehn tab: moving air parcel, temperature graph, cloud base, windward rain; height / temperature / humidity controls; 8 examples; 4 facts</li></ul><b>📜 v0.3.0 — 2026-11-17</b><ul><li>Four prototypes combined in one page (Climb, Rain & snow, Thunder, Aurora)</li><li>Shared top bar, language, lite mode and this panel</li><li>Only the open tab runs — lighter on phones</li><li>Climb ⇔ Rain & snow now link within the page</li></ul>'};
