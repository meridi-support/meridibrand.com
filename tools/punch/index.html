<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridi Punch — 1回押すだけの勤怠と時給計算 | One-tap Timecard & Pay Calculator</title>
<meta name="description" content="📇 Punch：時給と働いた日・時間を入れるだけで、深夜割増・残業割増を自動で分けて、1か月の給料の目安を計算。掛け持ちもOK。世界の32通貨に対応。広告なし・登録なし・通信なし。📇 Punch: an ad-free one-tap timecard & pay calculator with night and overtime premiums, in 32 currencies. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📇</text></svg>">
<style>
:root{--E:cubic-bezier(.22,1,.36,1);--bg:#030805;--ink:#d8ffd0;--sub:#8fbf8a;--line:#39ff1433;--card:#06120acc;--acc:#39ff14;--warn:#ffcf5a;--night:#7fa8ff;--ot:#ff9a6a}
body.light{--bg:#f2efe8;--ink:#1f2a20;--sub:#5a6a58;--line:#2a6a3e33;--card:#ffffffdd;--acc:#1f7a3a;--warn:#a86a00;--night:#2f56b8;--ot:#b8502a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;min-height:100vh;transition:background .6s var(--E),color .6s var(--E)}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:7px;padding:10px 16px;flex-wrap:wrap}
.home{font:12px 'Courier New',monospace;opacity:.7;color:inherit;text-decoration:none}.home:hover{opacity:1;color:var(--acc)}
.sp{margin-right:auto}
.tg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 11px;font:12px 'Courier New',monospace;cursor:pointer;white-space:nowrap;transition:border-color .3s}
.tg:hover{border-color:var(--acc)}
h1{text-align:center;font:bold clamp(22px,4.4vw,34px) 'Courier New',monospace;letter-spacing:5px;color:var(--acc);margin-top:10px}
.lead{text-align:center;color:var(--sub);font-size:13px;line-height:1.8;margin:6px 16px 0}
.wrap{max-width:980px;margin:16px auto 40px;padding:0 12px;display:grid;grid-template-columns:1fr 340px;gap:14px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(6px)}
.panel h2{font:bold 13px 'Courier New',monospace;letter-spacing:3px;color:var(--acc);margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
label.s{font-size:11px;color:var(--sub);min-width:62px}
input[type=text],input[type=number],input[type=time],select{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:14px;outline:none;transition:border-color .3s}
input:focus,select:focus{border-color:var(--acc)}
select option{background:var(--bg);color:var(--ink)}
input[type=number]{width:96px}
.btn{background:transparent;border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:7px 13px;cursor:pointer;font-size:13px;transition:all .3s var(--E)}
.btn:hover{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.btn.solid{background:var(--acc);color:var(--bg);font-weight:bold}
.btn.ghost{border-color:var(--line);color:var(--sub)}
.btn.del{border-color:#ff6a6a66;color:#ff8a8a}
/* jobs */
.jobs{display:flex;flex-direction:column;gap:8px}
.job{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}
.job .dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid #0004}
.job .nm{display:flex;flex-direction:column;gap:5px}
.job .nm input[type=text]{width:100%}
.wage{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wage select{min-width:118px}
/* calendar */
.calh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calh b{font:bold 18px 'Courier New',monospace;letter-spacing:2px;flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font:11px 'Courier New',monospace;text-align:center;color:var(--sub);padding:2px 0}
.dow.sun{color:#ff8a8a}.dow.sat{color:var(--night)}
.day{min-height:62px;border:1px solid var(--line);border-radius:9px;padding:4px;cursor:pointer;position:relative;transition:border-color .25s,transform .25s var(--E);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day:hover{border-color:var(--acc);transform:translateY(-1px)}
.day.out{opacity:.25;pointer-events:none}
.day.today{box-shadow:inset 0 0 0 1px var(--acc)}
.day.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.day .n{font:12px 'Courier New',monospace}
.day.sun .n{color:#ff8a8a}.day.sat .n{color:var(--night)}
.day .tag{font-size:9px;border-radius:5px;padding:1px 3px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .moon{position:absolute;right:4px;top:3px;font-size:9px}
.day.msel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent);box-shadow:inset 0 0 0 1px var(--acc)}
.day .tag.plan{opacity:.45;border:1px dashed #0006}
.day .hw{position:absolute;left:3px;bottom:2px;font-size:9px}
.multibar{display:none;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding:8px;border:1px dashed var(--acc);border-radius:10px;animation:fi .4s var(--E)}
.multibar.on{display:flex}
.multibar b{font-size:12px;margin-right:4px}
.tg.on{border-color:var(--acc);color:var(--acc)}
.today{margin-top:12px;border:1px solid var(--acc);border-radius:12px;padding:10px;display:none;animation:fi .5s var(--E)}
.today.on{display:block}
.today h3{font-size:13px;margin-bottom:6px;color:var(--acc)}
.today .ent{margin-bottom:6px}
.btn.big{font-size:16px;padding:10px 18px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;cursor:pointer}
.sum .two{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sum .two .s2{font:bold 16px 'Courier New',monospace;color:var(--sub)}
@media (max-width:520px){.day{min-height:48px}.day .tag{font-size:8px}}
/* editor */
.ed{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:none}
.ed.on{display:block;animation:fi .5s var(--E)}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ed h3{font-size:14px;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 11px;cursor:pointer;font-size:12px;color:var(--sub)}
.seg button.on{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--ink)}
.entries{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ent{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px}
.ent .c{width:10px;height:10px;border-radius:50%}
.ent .t{flex:1}
.ent .y{font:bold 13px 'Courier New',monospace}
.split{font:11px 'Courier New',monospace;color:var(--sub);margin-top:4px;line-height:1.7}
.split .nt{color:var(--night)}.split .ov{color:var(--ot)}
/* shifts */
.shifts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;background:transparent}
.chip:hover{border-color:var(--acc)}
.chip i{font-style:normal;opacity:.55;margin-left:4px;cursor:pointer}
/* summary */
.sum .big{font:bold 34px 'Courier New',monospace;color:var(--acc);letter-spacing:1px}
.sum .big small{font-size:14px;margin-left:4px;color:var(--sub)}
.sum table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.sum td{padding:5px 2px;border-bottom:1px dashed var(--line)}
.sum td:last-child{text-align:right;font-family:'Courier New',monospace}
.sum .jobsum{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.sum .js{display:flex;align-items:center;gap:6px;font-size:12px}
.sum .js .c{width:10px;height:10px;border-radius:50%}
.sum .js b{margin-left:auto;font-family:'Courier New',monospace}
.note{font-size:11px;color:var(--sub);line-height:1.8;margin-top:10px}
.note b{color:var(--warn)}
details{margin-top:8px}
summary{cursor:pointer;font-size:12px;color:var(--sub)}
.rates{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin-top:8px;font-size:12px}
.rates input{width:70px}
.proj .ptwrap{max-height:340px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:10px}
.pt{width:100%;border-collapse:collapse;font-size:12px}
.pt th{position:sticky;top:0;background:var(--bg);font-weight:normal;color:var(--sub);padding:6px 6px;text-align:right;border-bottom:1px solid var(--line)}
.pt th:first-child,.pt td:first-child{text-align:left}
.pt td{padding:6px 6px;text-align:right;font-family:'Courier New',monospace;border-bottom:1px dashed var(--line)}
.pt tr.yr td{font-weight:bold;color:var(--acc)}
.pt .up{color:var(--acc)}.pt .dn{color:#ff8a8a}
.pnote{font-size:11px;color:var(--warn);line-height:1.7;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:var(--card);border:1px solid var(--acc);padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:all .5s var(--E);pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.info{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;pointer-events:none;transition:opacity .45s var(--E)}
.info.show{opacity:1;pointer-events:auto}
.ibox{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--bg);border:1px solid var(--acc);border-radius:16px;padding:18px 20px;transform:translateY(12px);transition:transform .5s var(--E)}
.info.show .ibox{transform:none}
.ih{display:flex;align-items:center;gap:10px;margin-bottom:6px}.ih b{font:bold 16px 'Courier New',monospace;color:var(--acc)}.ih span{margin-right:auto;font:12px 'Courier New',monospace;color:var(--sub)}
.ilead{font-size:13px;line-height:1.9;color:var(--ink);margin:8px 0 10px}
.itag{text-align:center;font:bold 13px 'Courier New',monospace;color:var(--acc);letter-spacing:2px;margin-bottom:12px}
.icl{font-size:12px;color:var(--sub);line-height:1.8;border-top:1px solid var(--line);padding-top:10px}
.exbar{position:fixed;left:50%;top:10px;transform:translate(-50%,-80px);z-index:45;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--warn);color:var(--ink);border-radius:20px;padding:6px 8px 6px 16px;font-size:13px;transition:transform .6s var(--E);backdrop-filter:blur(6px)}
.exbar.on{transform:translate(-50%,0)}
body.ex .wrap{outline:2px dashed color-mix(in srgb,var(--warn) 55%,transparent);outline-offset:8px;border-radius:14px}
footer{text-align:center;font:11px 'Courier New',monospace;color:var(--sub);padding:20px 10px 30px}
</style>
</head>
<body>
<header>
  <a class="home" href="../">← Meridi Tools</a><span class="sp"></span>
  <button class="tg" id="tInfo">v1.0.0</button>
  <button class="tg" id="tEx">🔰</button>
  <button class="tg" id="tLang">🌐 EN</button>
  <button class="tg" id="tTheme">☀️</button>
</header>
<h1>📇 <span id="tTitle"></span></h1>
<p class="lead" id="tLead"></p>

<div class="wrap">
  <div>
    <div class="panel">
      <h2 id="hJobs"></h2>
      <div class="row"><label class="s" id="lCur"></label><select id="eCur"></select></div>
      <div class="jobs" id="jobs"></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="bAddJob"></button></div>
    </div>

    <div class="panel" style="margin-top:14px">
      <div class="calh">
        <button class="btn ghost" id="bPrev">◀</button>
        <b id="mLabel"></b>
        <button class="btn ghost" id="bNext">▶</button>
        <button class="btn ghost" id="bToday"></button>
      </div>
      <div class="row" style="margin:-2px 0 6px;justify-content:flex-end"><button class="tg" id="bMulti"></button><span style="font-size:10px;color:var(--sub)" id="multiHint"></span></div>
      <div class="cal" id="cal"></div>
      <div class="multibar" id="multibar">
        <b id="mbCount"></b>
        <button class="btn ghost" id="mbNoWeekend"></button>
        <button class="btn ghost" id="mbWeekday"></button>
        <button class="btn ghost" id="mbWeekend"></button>
        <span class="sp"></span>
        <button class="btn ghost" id="mbClear"></button>
      </div>
      <div class="today" id="todayBox"><h3 id="tdTitle"></h3><div id="tdList"></div></div>

      <div class="ed" id="ed">
        <h3 id="edTitle"></h3>
        <div class="entries" id="entries"></div>
        <div class="row" id="rJob"><label class="s" id="lJob"></label><select id="eJob"></select></div>
        <div class="row"><label class="s" id="lKind"></label>
          <div class="seg"><button id="kDone" class="on"></button><button id="kPlan"></button></div>
          <label class="chk"><input type="checkbox" id="eHol"><span id="lHol"></span></label></div>
        <div class="row"><label class="s" id="lMode"></label>
          <div class="seg"><button id="mTime" class="on"></button><button id="mHours"></button></div>
        </div>
        <div id="fTime">
          <div class="row"><label class="s" id="lStart"></label><input type="time" id="eStart" value="09:00">
            <label class="s" id="lEnd" style="min-width:auto"></label><input type="time" id="eEnd" value="18:00"></div>
          <div class="row"><label class="s" id="lBreak"></label><input type="number" id="eBreak" value="60" min="0" step="5"><span class="s" id="lMin" style="font-size:12px"></span></div>
          <div class="shifts" id="shifts"></div>
        </div>
        <div id="fHours" style="display:none">
          <div class="row"><label class="s" id="lHours"></label><input type="number" id="eHours" value="6" min="0" step=".25"><span style="font-size:12px" id="lH1"></span></div>
          <div class="row"><label class="s" id="lNightH"></label><input type="number" id="eNightH" value="0" min="0" step=".25"><span style="font-size:12px" id="lH2"></span></div>
        </div>
        <div class="split" id="preview"></div>
        <div class="row" style="margin-top:8px">
          <button class="btn solid" id="bSave"></button>
          <button class="btn ghost" id="bSaveShift"></button>
          <button class="btn ghost" id="bClose"></button>
        </div>
      </div>
    </div>
  </div>

  <div>
    <div class="panel sum">
      <h2 id="hSum"></h2>
      <div class="two"><div class="big"><span id="sTotal">0</span><small id="sYen"></small></div><div class="s2" id="sPlan"></div></div>
      <div style="font-size:11px;color:var(--sub)" id="sMeta"></div>
      <table id="sTable"></table>
      <div class="jobsum" id="sJobs"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="bCsv"></button>
        <button class="btn ghost" id="bClearM"></button>
      </div>
      <div class="row" style="margin-top:14px"><label class="s" id="lRule"></label>
        <div class="seg"><button id="ruleJP"></button><button id="ruleC"></button></div></div>
      <div class="rates" id="ratesJP"></div>
      <details id="dC">
        <summary id="sRates"></summary>
        <div class="rates">
          <span id="lrNW"></span><span><input type="time" id="rNS" style="width:96px"> 〜 <input type="time" id="rNE" style="width:96px"></span>
          <span id="lrN"></span><span><input type="number" id="rN" min="0" step="1"> %</span>
          <span id="lrB"></span><span><select id="rB"></select></span>
          <span id="lrLim"></span><span id="limBox"><input type="number" id="rDay" min="0" step=".5"><input type="number" id="rWk" min="0" step="1"> h</span>
          <span id="lrWs"></span><span id="wsBox"><select id="rWs"></select></span>
          <span id="lrO"></span><span><input type="number" id="rO" min="0" step="1"> %</span>
          <span id="lrH"></span><span><input type="number" id="rH" min="0" step="1"> %</span>
          <span id="lrHd"></span><span><select id="rHd"></select></span>
        </div>
      </details>
      <div class="row" id="rowJPHd" style="margin-top:6px"><label class="s" id="lJPHd" style="min-width:auto"></label><select id="rJPHd"></select></div>
      <p class="note" id="sNote"></p>
    </div>
    <div class="panel proj" style="margin-top:14px">
      <h2 id="hProj"></h2>
      <div class="row"><label class="s" id="lNew" style="min-width:auto"></label>
        <div class="seg"><button id="nMonthly"></button><button id="nHourly"></button></div></div>
      <div class="row" id="rNewM"><span id="lNewCur" style="font-size:12px;white-space:nowrap"></span><input type="number" id="nMonth" min="0" step="1000" style="flex:1;min-width:150px"></div>
      <div class="row" id="rNewH" style="display:none"><input type="number" id="nWage" min="0" step="1" style="width:110px"><span id="lNewCur2" style="font-size:12px"></span>
        <span style="font-size:12px">×</span><input type="number" id="nHrs" min="0" step="1" style="width:70px"><span id="lNewH" style="font-size:12px"></span></div>
      <div class="ptwrap"><table class="pt" id="pTable"></table></div>
      <p class="pnote" id="pNote"></p>
      <details id="dP"><summary id="sP"></summary>
        <div class="rates">
          <span id="lpStep"></span><span><select id="pStep"></select></span>
          <span id="lpLen"></span><span><select id="pLen"></select></span>
          <span id="lpBase"></span><span><select id="pBase"></select></span>
          <span id="lpMH"></span><span><input type="number" id="nMH" min="0" step="1" style="width:80px"> h</span>
        </div>
      </details>
    </div>
  </div>
</div>
<div class="info" id="info"><div class="ibox">
  <div class="ih"><b>📇 Meridi Punch</b><span>v1.0.0</span><button class="tg" id="iClose">✕</button></div>
  <p class="ilead" id="iLead"></p>
  <div class="itag">No Ads. No Sign-up. Just Punch.</div>
  <div class="icl" id="iCl"></div>
</div></div>
<div class="info" id="exBox"><div class="ibox">
  <div class="ih"><b id="exT"></b><span></span><button class="tg" id="exClose">✕</button></div>
  <p class="ilead" id="exLead"></p>
  <div class="row" style="margin-top:12px;justify-content:center"><button class="btn solid" id="exGo"></button><button class="btn ghost" id="exNo"></button></div>
</div></div>
<div class="exbar" id="exBar"><span id="exBarT"></span><button class="btn solid" id="exBack"></button></div>
<div class="toast" id="toast"></div>
<footer>© 2026 Meridi Brand · <span id="fVer">Meridi Punch v1.0.0</span> · 🐾 Built by one person and three cats</footer>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const LS = 'meridi_punch_v1';
const COLORS = ['#39ff14','#5ac8ff','#ffb347','#ff6ad5','#b28cff','#ffe066','#6affc4','#ff7a7a'];
let lang = lsGet('meridiplay_lang') || ((navigator.language || 'en').startsWith('ja') ? 'ja' : 'en');
let theme = lsGet('meridiplay_theme') === 'light' ? 'light' : 'dark';
const J = () => lang === 'ja';
const t = (ja, en) => J() ? ja : en;

let D = { jobs:[{ id:1, name:'', wage:1200, color:COLORS[0] }], days:{}, shifts:[], rates:{ night:0, ot:0, otBasis:'day', day:8, week:40, wkStart:0, hol:0, holDow:-1, nS:'22:00', nE:'05:00' }, rule:null, cur:null, nextId:2 };
try { const s = JSON.parse(lsGet(LS) || 'null'); if (s && s.jobs) D = Object.assign(D, s); } catch(e){}
D.rates = Object.assign({ night:0, ot:0, otBasis:'day', day:8, week:40, wkStart:0, hol:0, holDow:-1, nS:'22:00', nE:'05:00' }, D.rates || {});
/* 🇯🇵 JP = Labor Standards Act minimums (fixed). Custom = whatever the user enters. */
const JP = { night:25, ot:25, ot60:50, otBasis:'day', day:8, hol:35, nS:'22:00', nE:'05:00' };
const RR = () => D.rule === 'jp' ? Object.assign({}, D.rates, JP, { holDow:D.rates.jpHolDow == null ? 0 : D.rates.jpHolDow }) : D.rates;
/* currencies: [code, ja name, en name, preset min, max, step] */
const CUR = [

function splitShift(e){

/* ---- calendar ---- */
function renderCal(){
  $('mLabel').textContent = J() ? `${Y}年 ${M + 1}月` : new Date(Y, M, 1).toLocaleDateString('en-US', { year:'numeric', month:'long' });
  const cal = $('cal'); cal.replaceChildren();
  const dn = J() ? ['日','月','火','水','木','金','土'] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  dn.forEach((d, i) => { const e = document.createElement('div'); e.className = 'dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : ''); e.textContent = d; cal.append(e); });
  const first = new Date(Y, M, 1).getDay(), days = new Date(Y, M + 1, 0).getDate(), tk = key(now.getFullYear(), now.getMonth(), now.getDate());
  for (let i = 0; i < first; i++){ const e = document.createElement('div'); e.className = 'day out'; cal.append(e); }
  for (let d = 1; d <= days; d++){
    const k = key(Y, M, d), w = (first + d - 1) % 7, list = D.days[k] || [];
    const e = document.createElement('div');
    e.className = 'day' + (w === 0 ? ' sun' : w === 6 ? ' sat' : '') + (k === tk ? ' today' : '') + (MULTI.has(k) ? (MULTI.size > 1 ? ' msel' : ' sel') : '');
    let html = `<span class="n">${d}</span>`, hasNight = false, hasHol = false;
    list.forEach(x => { const j = job(x.job), sp = splitShift(x); if (sp.night) hasNight = true; if (x.hol) hasHol = true; html += `<span class="tag${x.plan ? ' plan' : ''}" style="background:${j.color}">${x.plan ? '📅' : ''}${hrs(sp.work)}h</span>`; });
    if (hasNight) html += '<span class="moon">🌙</span>'; if (hasHol) html += '<span class="hw">🏖</span>';
    e.innerHTML = html;
    e.onclick = ev => pick(k, ev);
    cal.append(e);
  }
  renderMultibar(); renderToday();
}
function monthKeys(){ const n = new Date(Y, M + 1, 0).getDate(), o = []; for (let d = 1; d <= n; d++) o.push(key(Y, M, d)); return o; }
function pick(k, ev){
  const add = ev && (ev.ctrlKey || ev.metaKey) || MTOG, range = ev && ev.shiftKey && ANCHOR;
  if (range){ const ks = monthKeys(), a = ks.indexOf(ANCHOR), b = ks.indexOf(k); if (a >= 0 && b >= 0){ if (!add && !MTOG) MULTI.clear(); ks.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => MULTI.add(x)); } else { MULTI = new Set([k]); } }
  else if (add){ MULTI.has(k) ? MULTI.delete(k) : MULTI.add(k); ANCHOR = k; }
  else { MULTI = new Set([k]); ANCHOR = k; }
  SEL = MULTI.size ? [...MULTI].sort()[0] : null;
  if (MULTI.size > 1) KIND = 'plan';
  renderCal(); renderEditor(); texts();
  if (SEL) setTimeout(() => $('ed').scrollIntoView({ behavior:'smooth', block:'nearest' }), 50);
}

/* ---- summary ---- */
/* ---- 📈 projection: "if you keep working like this" ---- */
function monthTotal(y, m){ const keepY = Y, keepM = M; Y = y; M = m; const r = calcMonth(); Y = keepY; M = keepM; return r; }
function baseMonth(){
  // average of months that have worked records (up to the last 12), or this month only
  if (PJ.base === 'this'){ const r = monthTotal(Y, M); return { pay:r.tot.total, hrs:r.tot.work / 60, n:r.tot.days.size ? 1 : 0, label:t('今月の分', 'this month') }; }
  const ms = [...new Set(Object.keys(D.days).filter(k => (D.days[k] || []).some(e => !e.plan)).map(k => k.slice(0, 7)))].sort().slice(-12);
  if (!ms.length) return { pay:0, hrs:0, n:0, label:t('記録した月の平均', 'average of recorded months') };
  let p = 0, h = 0; ms.forEach(s => { const [a, b] = s.split('-').map(Number), r = monthTotal(a, b - 1); p += r.tot.total; h += r.tot.work / 60; });
  return { pay:p / ms.length, hrs:h / ms.length, n:ms.length, label:t(`記録した ${ms.length} か月の平均`, `average of ${ms.length} recorded month${ms.length > 1 ? 's' : ''}`) };
}
function projSteps(){
  const L = +PJ.len || 12;
  if (PJ.step === 'm') return Array.from({ length:L }, (_, i) => i + 1);
  if (PJ.step === 'q') return Array.from({ length:Math.floor(L / 3) }, (_, i) => (i + 1) * 3);
  return [1, 3, 6, 12, 24, 36, 60].filter(n => n <= L);
}
function newMonthly(){ return PJ.nmode === 'month' ? (+PJ.nmonth || 0) : (+PJ.nwage || 0) * (+PJ.nhrs || 0); }
function renderProj(){
  const b = baseMonth(), nm = newMonthly(), has = nm > 0;
  $('rNewM').style.display = PJ.nmode === 'month' ? '' : 'none'; $('rNewH').style.display = PJ.nmode === 'hour' ? '' : 'none';
  $('nMonthly').classList.toggle('on', PJ.nmode === 'month'); $('nHourly').classList.toggle('on', PJ.nmode === 'hour');
  const lenOK = n => n === 12 ? t('（年収の目安）', ' (yearly)') : n % 12 === 0 ? t(`（${n / 12}年）`, ` (${n / 12} yr)`) : '';
  let html = `<tr><th>${t('先', 'Ahead')}</th><th>${t('今の働き方', 'Current')}</th>${has ? `<th>${t('転職先', 'New job')}</th><th>${t('差', 'Difference')}</th>` : ''}</tr>`;
  if (!b.n && !(PJ.base === 'this')){
    html += `<tr><td colspan="${has ? 4 : 2}" style="text-align:left;color:var(--sub);font-family:inherit">${t('「✅ 働いた」記録を入れると、見込みが出ます。🔰 の見本でも試せます。', 'Add some ✅ worked records to see the projection — or try the 🔰 sample.')}</td></tr>`;
  } else projSteps().forEach(n => {
    const cur = b.pay * n, nw = nm * n, d = nw - cur;
    html += `<tr class="${n % 12 === 0 ? 'yr' : ''}"><td>${n}${t('か月', n > 1 ? ' months' : ' month')}<span style="font-size:10px;opacity:.7">${lenOK(n)}</span></td><td>${money(cur)}</td>${has ? `<td>${money(nw)}</td><td class="${d >= 0 ? 'up' : 'dn'}">${d >= 0 ? '+' : '−'}${money(Math.abs(d))}</td>` : ''}</tr>`;
  });
  $('pTable').innerHTML = html;
  let hr = '';
  if (has && b.hrs > 0){
    const mh = PJ.nmode === 'month' ? (+PJ.mh || 0) : (+PJ.nhrs || 0);
    if (mh > 0){ const nh = nm / mh, ch = b.pay / b.hrs; hr = '<br>' + t(`時給に直すと：今 ${money(ch)} ／ 転職先 ${money(nh)}（月 ${mh} 時間として）`, `Per hour: now ${money(ch)} / new job ${money(nh)} (at ${mh} h/month)`); }
  }
  $('pNote').innerHTML = t('⚠️ 額面（税引き前）の目安です。税金・社会保険料は引かれていません。ボーナス・昇給・手当も入っていません。', '⚠️ Gross (before tax) estimate. Tax and social insurance are not deducted. Bonuses, raises and allowances are not included.')
    + '<br>' + t(`もとにしたもの：${b.label}（1か月 ${money(b.pay)}・${Math.round(b.hrs * 10) / 10} 時間）`, `Based on: ${b.label} (${money(b.pay)} · ${Math.round(b.hrs * 10) / 10} h per month)`)
    + (has ? '<br>' + t('転職先は、エージェントさんや求人票（JD）の情報をもとに、ご自身で入れた金額です。', 'The new job figure is what you entered from the recruiter or job description.') : '') + hr;
}
function renderSum(){ renderSum0(); try { renderProj(); } catch(e){} }
function renderSum0(){
  const { per, tot, all } = calcMonth();
  animateNum($('sTotal'), Math.round(tot.total * 10 ** decs()) / 10 ** decs());
  $('sPlan').textContent = all.total > tot.total + .5 ? t(`予定も入れると ${money(all.total)}`, `with plans ${money(all.total)}`) : '';
  $('sMeta').textContent = t(`${tot.days.size}日 ・ ${hrs(tot.work)}時間（うち深夜 ${hrs(tot.night)}時間）`, `${tot.days.size} days · ${hrs(tot.work)} h (night ${hrs(tot.night)} h)`);
  const r = RR();
  $('sTable').innerHTML = `<tr><td>${t('基本（時給×時間）', 'Base (wage × hours)')}</td><td>${money(tot.base)}</td></tr>
    <tr><td>🌙 ${t('深夜割増', 'Night premium')}（${r.night}%）</td><td>${money(tot.nightPay)}</td></tr>
    <tr><td>🏖 ${t('休日出勤の割増', 'Holiday premium')}（${r.hol}%・${hrs(tot.hol)}h）</td><td>${money(tot.holPay)}</td></tr>

function sample(){
  const y = now.getFullYear(), m = now.getMonth(), k = d => key(y, m, d), jpy = D.cur === 'JPY', w1 = jpy ? 1200 : defWage(), w2 = jpy ? 1350 : Math.round(defWage() * 1.12 / wStep()) * wStep();
  const S = { jobs:[{ id:1, name:t('コンビニ', 'Corner shop'), wage:w1, color:COLORS[0] }, { id:2, name:t('倉庫', 'Warehouse'), wage:w2, color:COLORS[1] }],
    days:{}, shifts:[{ job:1, start:'18:00', end:'01:00', brk:60 }], rates:Object.assign({}, D.rates), rule:D.rule, cur:D.cur, nextId:3 };
  const n = new Date(y, m + 1, 0).getDate(), today = now.getDate();
  for (let d = 1; d <= n; d++){ const w = new Date(y, m, d).getDay(), past = d <= today;
    if (w === 1 || w === 3 || w === 5) S.days[k(d)] = [Object.assign({ job:1, mode:'time', start:'18:00', end:'01:00', brk:60 }, past ? {} : { plan:true })];
    else if (w === 6) S.days[k(d)] = [Object.assign({ job:2, mode:'time', start:'09:00', end:'18:00', brk:60 }, past ? {} : { plan:true })];
    else if (w === 0 && d > 7 && d <= 14) S.days[k(d)] = [Object.assign({ job:2, mode:'time', start:'09:00', end:'18:00', brk:60, hol:true }, past ? {} : { plan:true })];
  }
  if (!S.days[k(today)]) S.days[k(today)] = [{ job:1, mode:'time', start:'18:00', end:'01:00', brk:60, plan:true }];
  return S;
}
