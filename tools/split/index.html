 if(pos===1||pos===n-1){var cr=[],db=[];v.forEach(function(x,k){if(x>0)cr.push(k);else db.push(k)});groups=[v.map(function(_,k){return k})];n=0}
 else if(n<=18){var F=(1<<n)-1,sum=new Array(F+1),dp=new Array(F+1),m,b;sum[0]=0;dp[0]=0;
  for(m=1;m<=F;m++){b=m&-m;sum[m]=sum[m^b]+v[Math.log2(b)|0];var best=0;
   for(i=0;i<n;i++)if(m>>i&1){if(dp[m^(1<<i)]>best)best=dp[m^(1<<i)]}
   dp[m]=best+(sum[m]===0?1:0)}
  var mask=F,cur=[];
  while(mask){var add=sum[mask]===0?1:0,pick=-1;
   for(i=0;i<n;i++)if(mask>>i&1&&dp[mask^(1<<i)]===dp[mask]-add){pick=i;break}
   cur.push(pick);mask^=1<<pick;if(sum[mask]===0){groups.push(cur);cur=[]}}
 }else groups=[v.map(function(_,k){return k})];
 var pays=[];
 groups.forEach(function(g){var cr=[],db=[];g.forEach(function(k){if(v[k]>0)cr.push([idx[k],v[k]]);else db.push([idx[k],-v[k]])});
  cr.sort(function(a,b){return b[1]-a[1]});db.sort(function(a,b){return b[1]-a[1]});
  var a=0,c=0;while(a<db.length&&c<cr.length){var x=Math.min(db[a][1],cr[c][1]);pays.push([db[a][0],cr[c][0],x]);
   db[a][1]-=x;cr[c][1]-=x;if(db[a][1]===0)a++;if(cr[c][1]===0)c++}});
 return{pays:pays,exact:n<=18}}

 var n=Math.max(1,S.people.length);
 $("tout").innerHTML=esc(T[L].tipOut(fmtv(b*p/100,c),fmtv(b*(1+p/100),c)))+'<span class="note">　'+T[L].per+" "+esc(fmtv(b*(1+p/100)/n,c))+"</span>"}

 document.querySelectorAll("[data-t]").forEach(function(el){var v=t[el.dataset.t];if(typeof v=="string")el.textContent=v});
 opts($("qc"),S.base);var qd=dec(S.base),QU=qd===0?[0,10,100,500,1000]:[0,Math.pow(10,qd),5*Math.pow(10,qd),10*Math.pow(10,qd)],qv=+$("qr").value||0;
 $("qr").innerHTML=QU.map(function(u){return'<option value="'+u+'"'+(u==qv?' selected':'')+'>'+(u?t.up(fmt(u,S.base)):t.nornd)+'</option>'}).join("");renderQuick();
 $("newp").placeholder=L=="ja"?"名前":"Name";$("ed").placeholder=t.dflt;$("ea").placeholder=L=="ja"?"金額":"Amount";
 opts($("base"),S.base);
 var tcv=$("tc").value;$("tc").innerHTML=TIPS.map(function(r){return'<option value="'+r[0]+'">'+r[1]+" "+(L=="ja"?r[2]:r[3])+'</option>'}).join("");if(tcv)$("tc").value=tcv;
 $("people").innerHTML=S.people.map(function(p,i){return'<span class="chip">'+esc(p)+' <button class="x" data-dp="'+i+'">×</button></span>'}).join("");
 var ep=$("ep").value;$("ep").innerHTML=S.people.map(function(p,i){return'<option value="'+i+'">'+esc(p)+'</option>'}).join("");if(ep&&ep<S.people.length)$("ep").value=ep;
 $("ew").innerHTML=(L=="ja"?"割る人：":"Split: ")+S.people.map(function(p,i){return'<label class="chk"><input type="checkbox" checked data-w="'+i+'">'+esc(p)+'</label>'}).join("");
 $("elist").innerHTML=S.ex.map(function(e,i){return'<tr><td>'+esc(e.d)+'</td><td>'+esc(fmtv(e.a,S.base))+(e.t?' <span class="note">+'+e.t+'%</span>':'')+'</td><td>'+esc(S.people[e.p]||"?")+'</td><td>'+e.w.map(function(x){return esc(S.people[x]||"?")}).join(", ")+'</td><td><button class="x" data-de="'+i+'">×</button></td></tr>'}).join("");
 document.querySelectorAll(".curl").forEach(function(el){el.textContent=S.base});
 var d=dec(S.base),RU=d===0?[0,10,100,500,1000]:[0,Math.pow(10,d),5*Math.pow(10,d),10*Math.pow(10,d)];
 if(RU.indexOf(+S.rnd)<0)S.rnd=0;
 $("rnd").innerHTML=RU.map(function(u){return'<option value="'+u+'"'+(u==S.rnd?' selected':'')+'>'+(u?t.up(fmt(u,S.base)):t.nornd)+'</option>'}).join("");
 renderTip();renderSettle();save()}
function renderSettle(){var t=T[L],B=balances(),n=S.people.length,rows="",bal=[],i;
 for(i=0;i<n;i++){bal[i]=B.paid[i]-B.owe[i];
  rows+='<tr><td>'+esc(S.people[i])+'</td><td>'+fmt(B.paid[i],S.base)+'</td><td>'+fmt(B.owe[i],S.base)+'</td><td class="'+(bal[i]>0?"pos":bal[i]<0?"neg":"")+'">'+(bal[i]>0?"+":"")+fmt(bal[i],S.base)+'</td></tr>'}
 $("bal").innerHTML=rows;
 var R=settle(bal),U=+S.rnd||0,extra=0,keys=[],rest=0,nd=0;
 var P=R.pays.map(function(p){var a=U>1?Math.ceil(p[2]/U)*U:p[2];extra+=a-p[2];var k=p[0]+">"+p[1]+":"+a;keys.push(k);return{f:p[0],to:p[1],a:a,o:p[2],k:k}});
 var before=S.done.length;S.done=S.done.filter(function(k){return keys.indexOf(k)>=0});
 var changed=before>S.done.length;
 $("pays").innerHTML=P.length?'<div id="plist"'+(S.fold?' style="display:none"':'')+'>'+P.map(function(x){var d=S.done.indexOf(x.k)>=0;if(d)nd++;else rest+=x.a;
  return'<label class="pay'+(d?' done':'')+'"><input type="checkbox" data-pk="'+x.k+'"'+(d?' checked':'')+'> '+esc(t.payfmt(S.people[x.f],S.people[x.to],fmt(x.a,S.base)))+(x.a!==x.o?' <span class="note">('+fmt(x.o,S.base)+')</span>':'')+'</label>'}).join("")+'</div>'
  +'<div class="sum">'+t.sum(nd,P.length,fmt(rest,S.base))+'</div>'
  +(extra?'<div class="note">'+t.extra(fmt(extra,S.base))+'</div>':'')
  +(changed?'<div class="warn">'+t.changed+'</div>':'')
  :(S.ex.length?'<div class="pay">'+t.none+'</div>':"");
 $("paynote").textContent=P.length?(R.exact?t.exact(P.length):t.approx(P.length)):"";
 S._txt=P.map(function(x){return(S.done.indexOf(x.k)>=0?"✅ ":"⬜ ")+t.payfmt(S.people[x.f],S.people[x.to],fmt(x.a,S.base))}).join("\n")}
function renderQuick(){var t=T[L],c=S.base,U=Math.pow(10,dec(c)),tot=Math.round((parseFloat($("qa").value)||0)*U),n=Math.max(1,Math.floor(+$("qn").value||1)),R=+$("qr").value||0,x=$("qx").checked&&n>1;
 if(!(tot>0)){$("qout").textContent="";$("qsub").textContent="";return}
 var per=Math.ceil(tot/n);if(R>1)per=Math.ceil(per/R)*R;var payers=x?n-1:n,extra=per*n-tot;
 $("qout").textContent=t.qper(fmt(per,c));$("qsub").textContent=t.qsum(payers,fmt(per*payers,c),x)+(extra>0?" ・ "+t.qex(fmt(extra,c)):"")}
function save(){var o={v:1,base:S.base,people:S.people,rates:S.rates,ex:S.ex,rnd:S.rnd,done:S.done};ss("meridi_split",JSON.stringify(o))}

 S.rates=o.rates||{};S.rnd=+o.rnd||0;S.done=Array.isArray(o.done)?o.done.map(String):[];S.ex=(o.ex||[]).filter(function(e){return e&&isFinite(e.a)&&Array.isArray(e.w)})}
