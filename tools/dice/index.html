<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const LS = 'meridice_v1';
let S = { lang: (navigator.language || 'ja').startsWith('ja') ? 'ja' : 'en', snd: true, mode: 'dice', expr: '2d6+3', cnt: 1, skill: 50, macros: null, hist: [], nyan: false, look: '3d' };
try { const x = JSON.parse(lsGet(LS) || 'null'); if (x) S = Object.assign(S, x); } catch(e){}
let theme = lsGet('meridiplay_theme') === 'light' ? 'light' : 'dark';
if (!S.macros) S.macros = [['Fireball', '8d6'], ['Longsword', '1d8+3'], ['Sanity', '1d100'], ['Stats', '4d6kh3']];
const save = () => lsSet(LS, JSON.stringify(S));
const J = () => S.lang === 'ja';
const t = (ja, en) => J() ? ja : en;

/* ===== 公平な乱数（暗号用の乱数＋偏りを除く） ===== */
function rnd(n){
  const buf = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n;
  try { do { crypto.getRandomValues(buf); } while (buf[0] >= lim); return buf[0] % n + 1; }
  catch(e){ return Math.floor(Math.random() * n) + 1; }
}

/* ===== 式を読む ===== */
// 対応：NdM、d%、dF、!（爆発）、kh/kl/k、dh/dl、rN（N 以下を 1 回振り直し）、>=N など（成功数）、定数、＋−
const TERM = /^([+\-]?)(?:(\d*)d(\d+|%|f)((?:!|kh\d+|kl\d+|k\d+|dh\d+|dl\d+|r\d+|(?:>=|<=|>|<)\d+)*)|(\d+))/;
function parse(src){
  let s = (src || '').normalize('NFKC').toLowerCase().replace(/\s+/g, '').replace(/[ｄ]/g, 'd').replace(/[−–—]/g, '-').replace(/×/g, 'x');
  if (!s) throw t('式を入れてください', 'Please enter an expression');
  const terms = []; let first = true;
  while (s.length){
    const m = s.match(TERM);
    if (!m || (!first && !m[1])) throw t('読めない所があります：', "Can't read: ") + s.slice(0, 12);
    first = false; s = s.slice(m[0].length);
    const sign = m[1] === '-' ? -1 : 1;
    if (m[5] !== undefined){ terms.push({ k: 'n', sign, v: +m[5] }); continue; }
    const n = m[2] === '' ? 1 : +m[2];
    const sides = m[3] === '%' ? 100 : m[3] === 'f' ? 'F' : +m[3];
    if (n < 1 || n > 100) throw t('ダイスの数は 1〜100 個です', 'Dice count must be 1–100');
    if (sides !== 'F' && (sides < 2 || sides > 1000)) throw t('面の数は 2〜1000 です', 'Sides must be 2–1000');
    const T = { k: 'd', sign, n, sides, ex: false, keep: null, re: 0, succ: null, raw: m[0].replace(/^[+\-]/, '') };
    const mods = m[4].match(/!|kh\d+|kl\d+|k\d+|dh\d+|dl\d+|r\d+|(?:>=|<=|>|<)\d+/g) || [];
    for (const md of mods){
      if (md === '!'){ if (sides === 'F' || sides < 3) throw t('爆発は 3 面以上で使えます', 'Exploding needs 3+ sides'); T.ex = true; }
      else if (/^kh?\d/.test(md)) T.keep = ['h', +md.replace(/\D/g, '')];
      else if (/^kl/.test(md)) T.keep = ['l', +md.slice(2)];
      else if (/^dh/.test(md)) T.keep = ['l', n - +md.slice(2)];
      else if (/^dl/.test(md)) T.keep = ['h', n - +md.slice(2)];
      else if (/^r/.test(md)) T.re = +md.slice(1);
      else { const mm = md.match(/(>=|<=|>|<)(\d+)/); T.succ = [mm[1], +mm[2]]; }
    }
    if (T.keep && (T.keep[1] < 1 || T.keep[1] > n)) throw t('残す数が多すぎるか、少なすぎます', 'Keep/drop count out of range');
    if (sides !== 'F' && T.re >= sides) throw t('振り直しの数が大きすぎます', 'Reroll value too high');
    terms.push(T);
  }
  if (terms.filter(x => x.k === 'd').reduce((a, x) => a + x.n, 0) > 200) throw t('ダイスは合計 200 個までです', 'Max 200 dice in total');
  return terms;
}
const cmp = (v, [op, x]) => op === '>=' ? v >= x : op === '<=' ? v <= x : op === '>' ? v > x : v < x;
function rollTerm(T, R = rnd){
  if (T.k === 'n') return { value: T.sign * T.v, dice: [] };
  const one = () => T.sides === 'F' ? R(3) - 2 : R(T.sides);
  let dice = [];
  for (let i = 0; i < T.n; i++){
    let v = one(), d = { v, sides: T.sides, kept: true, tag: '' };
    if (T.re && v <= T.re){ d.tag = 'r'; d.from = v; d.v = v = one(); }
    dice.push(d);
    if (T.ex){ let c = 0; while (v === T.sides && c++ < 30){ v = one(); dice.push({ v, sides: T.sides, kept: true, tag: '!' }); } }
  }
  if (T.keep){
    const idx = dice.map((d, i) => i).sort((a, b) => T.keep[0] === 'h' ? dice[b].v - dice[a].v : dice[a].v - dice[b].v);
    idx.forEach((i, r) => { if (r >= T.keep[1]) dice[i].kept = false; });
  }
  const kept = dice.filter(d => d.kept);
  const value = T.succ ? kept.filter(d => cmp(d.v, T.succ)).length : kept.reduce((a, d) => a + d.v, 0);
  if (T.succ) kept.forEach(d => d.hit = cmp(d.v, T.succ));
  return { value: T.sign * value, dice };
}
function rollAll(terms, R){ const parts = terms.map(T => rollTerm(T, R)); return { parts, total: parts.reduce((a, p) => a + p.value, 0) }; }

/* ===== 確率の分布 ===== */
function distribution(terms){
  const plain = terms.every(T => T.k === 'n' || (!T.ex && !T.keep && !T.re && !T.succ));
  if (plain){
    let dist = new Map([[0, 1]]);
    for (const T of terms){

      for (let i = 0; i < T.n; i++){
        const nd = new Map();
        dist.forEach((p, v) => faces.forEach(f => { const k = v + T.sign * f; nd.set(k, (nd.get(k) || 0) + p / faces.length); }));
        dist = nd;

}
function drawChart(terms, result){
  let D; try { D = distribution(terms); } catch(e){ $('chart').innerHTML = ''; $('cstat').textContent = ''; return; }

  const pm = Math.max(...D.dist.values()), w = 300, h = 140, n = max - min + 1, bw = w / n;
  let mean = 0; D.dist.forEach((p, v) => mean += p * v);
  let ge = 0; if (result != null) D.dist.forEach((p, v) => { if (v >= result) ge += p; });
  let bars = '';
  for (let v = min; v <= max; v++){
    const p = D.dist.get(v) || 0, bh = p / pm * (h - 18), hit = v === result;
    bars += `<rect x="${(v - min) * bw + bw * .1}" y="${h - 14 - bh}" width="${Math.max(1, bw * .8)}" height="${bh}" rx="${Math.min(3, bw / 4)}" fill="${hit ? 'var(--gold)' : 'var(--acc)'}" opacity="${hit ? 1 : .45}"><title>${v}: ${(p * 100).toFixed(2)}%</title></rect>`;
  }
  const lab = (v, a) => `<text x="${(v - min + .5) * bw}" y="${h - 2}" font-size="10" fill="var(--sub)" text-anchor="${a}" font-family="Courier New">${v}</text>`;
  $('chart').innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}${lab(min, 'start')}${n > 2 ? lab(Math.round(mean), 'middle') : ''}${lab(max, 'end')}</svg>`;
  $('cstat').innerHTML = (J() ? `最小 <b>${min}</b> ／ 平均 <b>${mean.toFixed(2)}</b> ／ 最大 <b>${max}</b>` : `min <b>${min}</b> / avg <b>${mean.toFixed(2)}</b> / max <b>${max}</b>`)
    + (result != null ? '<br>' + t(`この目（${result}）以上が出る確率：`, `Chance of ${result} or more: `) + `<b>${(ge * 100).toFixed(ge < .01 ? 2 : 1)}%</b>` : '')
    + (D.exact ? '' : `<br><span style="opacity:.7">${t('※ 20,000 回振ったときの近い値です', '* Estimated from 20,000 simulated rolls')}</span>`);
}

let AC = null;
function ac(){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){} }
function clack(n){
  if (!S.snd || !AC) return;
  try {
    const hits = Math.min(14, 4 + n * 2);
    for (let i = 0; i < hits; i++){
      const t0 = AC.currentTime + i * (0.045 + Math.random() * 0.05) + Math.pow(i / hits, 2) * 0.25;
      const len = 0.03, buf = AC.createBuffer(1, AC.sampleRate * len, AC.sampleRate), ch = buf.getChannelData(0);
      for (let j = 0; j < ch.length; j++) ch[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / ch.length, 3);
      const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 2400; f.Q.value = 3;
      g.gain.value = 0.35 * (1 - i / hits * .7);
      src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t0);
    }
  } catch(e){}
}
function chime(good){ if (!S.snd || !AC) return; try { (good ? [784, 988, 1319] : [330, 262]).forEach((fr, i) => { const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + 0.6 + i * 0.13; o.type = 'triangle'; o.frequency.value = fr; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6); o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + 0.7); }); } catch(e){} }

function addHist(expr, total, note){ S.hist.unshift([expr, total, note || '', Date.now()]); S.hist = S.hist.slice(0, 40); save(); renderHist(); }

  const r = rollAll(terms); const all = r.parts.flatMap(p => p.dice);

/* ===== クトゥルフ（d100 判定） ===== */
function cocRoll(){
  ac(); const sk = Math.max(1, Math.min(99, +$('skill').value || 50)); S.skill = sk; save();
  const bp = +$('bp').value, ones = rnd(10) - 1, tens = [];
  for (let i = 0; i <= Math.abs(bp); i++) tens.push(rnd(10) - 1);
  const val = t2 => { const v = t2 * 10 + ones; return v === 0 ? 100 : v; };
  const cands = tens.map(val), pick = bp > 0 ? Math.min(...cands) : bp < 0 ? Math.max(...cands) : cands[0];
  const dice = tens.map(t2 => ({ sides: 100, v: t2 * 10 === 0 ? 100 : t2 * 10, kept: val(t2) === pick, tag: '' }));
  let seen = false; dice.forEach(d => { if (d.kept){ if (seen) d.kept = false; seen = true; } });
  dice.push({ sides: 10, v: ones === 0 ? 10 : ones, kept: true, tag: '' });
  const allD = dice.map(d => d.sides === 10 ? Object.assign({}, d, { v: ones }) : Object.assign({}, d, { v: d.v === 100 ? 0 : d.v }));
  showDice(allD.map(d => d.sides === 10 ? { sides: 10, v: d.v, kept: true } : { sides: 100, v: d.v === 0 ? 100 : d.v, kept: d.kept }));
  clack(dice.length);
  const lv = pick === 1 ? 0 : pick <= Math.floor(sk / 5) ? 1 : pick <= Math.floor(sk / 2) ? 2 : pick <= sk ? 3 : (pick === 100 || (sk < 50 && pick >= 96)) ? 5 : 4;
  const NAMES = J() ? ['クリティカル', 'イクストリーム成功', 'ハード成功', 'レギュラー成功', '失敗', 'ファンブル'] : ['CRITICAL', 'EXTREME SUCCESS', 'HARD SUCCESS', 'REGULAR SUCCESS', 'FAILURE', 'FUMBLE'];
  const badge = lv === 0 ? ['crit', '✨ ' + NAMES[0]] : lv === 5 ? ['fum', '💀 ' + NAMES[5]] : lv <= 3 ? ['ok', NAMES[lv]] : ['ng', NAMES[4]];
  if (lv === 0) chime(true); if (lv === 5) chime(false);
  setTotal(String(pick).padStart(2, '0'), t(`技能 ${sk}`, `SKILL ${sk}`) + (bp ? (bp > 0 ? t(` ・ボーナス ${bp}`, ` · BONUS ${bp}`) : t(` ・ペナルティ ${-bp}`, ` · PENALTY ${-bp}`)) : ''), t('十の位 ', 'tens ') + tens.map(x => x * 10 || '00').join(' / ') + t(' ＋ 一の位 ', ' + ones ') + ones, badge);
  renderLv(sk, lv);
  addHist(`CoC ${sk}${bp ? (bp > 0 ? '+B' + bp : '+P' + -bp) : ''}`, pick, NAMES[lv]);
  const T = [{ k: 'd', sign: 1, n: 1, sides: 100, ex: false, keep: null, re: 0, succ: null, raw: 'd100' }]; drawChart(T, pick);
}

  const bpo = $('bp').options; ['ペナルティ 2', 'ペナルティ 1', 'なし', 'ボーナス 1', 'ボーナス 2'].forEach((l, i) => bpo[i].textContent = J() ? l : ['Penalty 2', 'Penalty 1', 'None', 'Bonus 1', 'Bonus 2'][i]);
  $('bCoc').textContent = t('🎲 判定する', '🎲 ROLL'); renderLv(S.skill, -1);
  $('hDnd').textContent = t('⚔️ ダンジョンズ＆ドラゴンズ', '⚔️ DUNGEONS & DRAGONS');
  $('bAdv').textContent = t('⬆ 有利で振る', '⬆ Advantage'); $('bNorm').textContent = t('d20 で振る', 'Normal d20'); $('bDis').textContent = t('⬇ 不利で振る', '⬇ Disadvantage');
  $('lMod').textContent = t('修正', 'Mod'); $('bAbil').textContent = t('🧙 能力値を 6 つ作る（4d6 で低い 1 個を捨てる）', '🧙 Roll 6 ability scores (4d6 drop lowest)');
  $('hChart').textContent = t('📊 確率のグラフ', '📊 PROBABILITY'); $('hPre').textContent = t('🔰 よく使う振り方', '🔰 COMMON ROLLS');
  $('hMac').textContent = t('⭐ マイ・マクロ', '⭐ MY MACROS'); $('hHist').textContent = t('📜 履歴', '📜 HISTORY');
  $('mName').placeholder = t('名前（例：剣の攻撃）', 'Name (e.g. Sword)'); $('bMac').textContent = t('＋ 今の式を保存', '+ Save current');
  $('pre').innerHTML = ''; PRE.forEach(([e, l, dj, de]) => { const b = document.createElement('button'); b.innerHTML = `<b style="font-family:Courier New">${l}</b> <small>${J() ? dj : de}</small>`; b.onclick = () => { $('expr').value = S.expr = e; save(); rollExpr(e); }; $('pre').append(b); });
  renderMacs(); renderHist();
  $('iP').textContent = t('広告なし・登録なし・通信なし。ダイスは、暗号にも使われる乱数で、偏りなく振っています。履歴とマクロは、この端末の中だけに保存されます。', 'No ads, no sign-up, no network. Dice use a cryptographic random generator with no bias. History and macros stay on this device.');
  $('iCof').textContent = t('ひとりで作っています。卓が盛り上がったら、コーヒー 1 杯分の応援がうれしいです。', 'Made by one person. If your table had fun, a coffee would mean a lot.');
  $('iCl').innerHTML = '📜 <b>v1.0.0 — 2026-11-16</b><br>' + t('・最初の公開：式の入力（NdM・kh/kl・dh/dl・爆発・振り直し・成功数・dF）、8 種類のダイスの絵と転がる動き、6 面ダイスの立体表示（桃鉄風・切り替え可）、確率のグラフ、クトゥルフ第 7 版の判定（ボーナス・ペナルティダイス）、D&D の有利・不利と DC、能力値づくり、マクロ、履歴、説明書き', '• First release: dice notation (NdM, kh/kl, dh/dl, exploding, reroll, success counting, dF), 8 animated dice, probability chart, Call of Cthulhu 7e rolls with bonus/penalty dice, D&D advantage / disadvantage & DC, ability scores, macros, history, guide');
  $('guide').innerHTML = J() ? GUIDE_JA : GUIDE_EN;
  if (lastTerms) drawChart(lastTerms, S.hist[0] ? +S.hist[0][1] : null); else { try { drawChart(parse(S.expr), null); } catch(e){} }
  if (!$('tray').children.length) setTotal('—', t('ダイスを振ってください', 'ROLL SOME DICE'), t('Enter キーでも振れます', 'Press Enter to roll'), null);
}
function renderMacs(){
  $('macs').innerHTML = '';
  S.macros.forEach(([n, e], i) => { const d = document.createElement('div'); d.className = 'mac';
    d.innerHTML = `<button class="m">${n.replace(/[<>&]/g, '')}<small>${e}</small></button><button class="x" title="${t('消す', 'Delete')}">✕</button>`;
    d.querySelector('.m').onclick = () => { $('expr').value = S.expr = e; save(); rollExpr(e, { note: n }); };
    d.querySelector('.x').onclick = () => { S.macros.splice(i, 1); save(); renderMacs(); };
    $('macs').append(d); });
}
function renderHist(){
  $('hist').innerHTML = S.hist.length ? S.hist.map(([e, v, n], i) => `<div data-i="${i}" title="${t('もう一度振る', 'Roll again')}"><span>${e}${n ? ' <small style="opacity:.6">' + String(n).replace(/[<>&]/g, '') + '</small>' : ''}</span><span>${v}</span></div>`).join('') : `<span style="opacity:.6;font-size:12px">${t('まだありません', 'Nothing yet')}</span>`;
  $('hist').querySelectorAll('div').forEach(d => d.onclick = () => { const e = S.hist[+d.dataset.i][0]; if (/^CoC|×6/.test(e)) return; $('expr').value = S.expr = e; save(); rollExpr(e); });
}

const GUIDE_JA = `<h3>📖 説明書き（ちょっと高度）</h3>
<details open><summary>🔰 はじめての方へ：TRPG とダイス</summary><p>TRPG（テーブルトーク RPG）は、紙とサイコロで遊ぶ、会話で進める RPG です。「扉を開けてみます」と言葉で行動を決め、うまくいくかどうかをダイスで決めます。<b>d6</b> は 6 面、<b>d20</b> は 20 面のダイスという意味です。</p></details>
<details><summary>✍️ 式の書き方</summary><table><tr><th>書き方</th><th>意味</th></tr>
<tr><td><code>2d6+3</code></td><td>6 面を 2 個振って、3 を足す</td></tr>
<tr><td><code>d20</code>・<code>1d20</code></td><td>20 面を 1 個（1 は省略できます）</td></tr>
<tr><td><code>d%</code>・<code>d100</code></td><td>1〜100（百分率）</td></tr>
<tr><td><code>4d6kh3</code></td><td>4 個振って、<b>高い</b> 3 個を残す（keep highest）</td></tr>
<tr><td><code>2d20kl1</code></td><td>2 個振って、<b>低い</b> 1 個を残す（keep lowest）</td></tr>
<tr><td><code>4d6dl1</code></td><td>低い 1 個を捨てる（drop lowest）。<code>kh3</code> と同じ結果</td></tr>
<tr><td><code>3d6!</code></td><td>爆発ダイス：最大の目が出たら、もう 1 個振り足す（💥 の印）</td></tr>
<tr><td><code>2d6r1</code></td><td>1 が出たら、1 回だけ振り直す（↻ の印）</td></tr>
<tr><td><code>5d10&gt;=8</code></td><td>8 以上が出た<b>個数</b>を数える（成功数）</td></tr>
<tr><td><code>4dF</code></td><td>FATE ダイス：＋・０・− の 3 種類の面</td></tr>
<tr><td><code>1d8+2d6-1</code></td><td>組み合わせもできます</td></tr></table><p>全角で入れても大丈夫です（<code>２ｄ６＋３</code> も読めます）。</p></details>
<details><summary>⚔️ D&D：有利と不利</summary><p>第 5 版では、状況が良いと <b>有利（Advantage）</b>：d20 を 2 回振って高いほう、悪いと <b>不利（Disadvantage）</b>：低いほうを使います。式で書くと <code>2d20kh1</code> と <code>2d20kl1</code> です。DC（難しさ）を入れると、成功か失敗かを出します。d20 で 20 が出ると ✨ クリティカル、1 が出ると 💀 ファンブルです。</p><p>有利だと、平均はおよそ 10.5 から 13.8 に上がります。右のグラフで、形が右にかたよるのが見られます。</p></details>
<details><summary>🐙 クトゥルフ神話 TRPG（第 7 版）の判定</summary><p>d100 を振って、<b>技能値以下</b>なら成功です。成功の度合いは 4 段階あります。</p><table><tr><td>クリティカル</td><td>01</td></tr><tr><td>イクストリーム成功</td><td>技能値の 1/5 以下</td></tr><tr><td>ハード成功</td><td>技能値の 1/2 以下</td></tr><tr><td>レギュラー成功</td><td>技能値以下</td></tr><tr><td>ファンブル</td><td>100（技能値が 50 未満なら 96〜100）</td></tr></table><p><b>ボーナス・ダイス</b>は十の位を余分に振って<b>小さいほう</b>、<b>ペナルティ・ダイス</b>は<b>大きいほう</b>を使います。一の位は共通です。（ルールの細かい所は、遊んでいるルールブックに合わせてください）</p></details>
<details><summary>📊 確率のグラフの読み方</summary><p><code>1d12</code> はどの目も同じくらい出ますが、<code>2d6</code> は 7 がいちばん出やすく（約 16.7%）、2 と 12 は 1/36（約 2.8%）しか出ません。ダイスの数が増えるほど、グラフは真ん中が高い「山の形」になります。これが、同じ「2〜12」でも <code>2d6</code> と <code>1d11+1</code> で遊び心地が違う理由です。</p><p>金色の棒が今の目で、「この目以上が出る確率」も出します。爆発や振り直しなど複雑な式は、20,000 回振ってみた近い値です。</p></details>
<details><summary>🔒 公平さについて</summary><p>ダイスは、暗号にも使われる乱数（<code>crypto.getRandomValues</code>）で振っています。さらに、どの目も同じ確率になるように、わずかな偏りも取り除いています。前の結果が次の結果に影響することはありません。「さっき 1 が出たから次は大きい目」ということもありません。</p></details>
<details><summary>🎲 立体と平らの切り替え</summary><p>右上の「🎲 立体」を押すと、6 面ダイスだけが角の丸い立体のサイコロになり、ころんと転がって止まります。「🔷 平ら」は軽いので、古いスマホやダイスをたくさん振るときに向いています。ダイスが 25 個以上のときは、自動で平らな絵になります。4・8・10・12・20 面は、どちらでも平らな絵です。</p></details>
<details><summary>⌨️ キーボード</summary><p><b>Enter</b>：振る ／ <b>A</b>：d20 有利 ／ <b>D</b>：d20 不利 ／ <b>R</b>：もう一度 ／ <b>Esc</b>：閉じる</p></details>`;
const GUIDE_EN = `<h3>📖 GUIDE</h3>
<details open><summary>🔰 New to tabletop RPGs?</summary><p>In a TRPG you describe what your character does, and dice decide whether it works. <b>d6</b> = six-sided die, <b>d20</b> = twenty-sided.</p></details>
<details><summary>✍️ Dice notation</summary><table>
<tr><td><code>2d6+3</code></td><td>two d6, add 3</td></tr><tr><td><code>d%</code></td><td>1–100</td></tr>
<tr><td><code>4d6kh3</code></td><td>keep highest 3</td></tr><tr><td><code>2d20kl1</code></td><td>keep lowest 1</td></tr>
<tr><td><code>4d6dl1</code></td><td>drop lowest 1</td></tr><tr><td><code>3d6!</code></td><td>exploding (roll again on max) 💥</td></tr>
<tr><td><code>2d6r1</code></td><td>reroll 1s once ↻</td></tr><tr><td><code>5d10&gt;=8</code></td><td>count successes</td></tr>
<tr><td><code>4dF</code></td><td>Fate / Fudge dice</td></tr></table></details>
<details><summary>⚔️ D&D advantage</summary><p>Advantage = <code>2d20kh1</code>, disadvantage = <code>2d20kl1</code>. Advantage raises the average from 10.5 to about 13.8. Set a DC to see success or failure.</p></details>
<details><summary>🐙 Call of Cthulhu 7e</summary><p>Roll d100 ≤ skill. Extreme ≤ skill/5, Hard ≤ skill/2, Critical = 01, Fumble = 100 (96+ if skill &lt; 50). Bonus dice keep the lower tens die, penalty dice the higher.</p></details>
<details><summary>📊 Reading the chart</summary><p><code>2d6</code> rolls 7 most often (16.7%); 2 and 12 only 2.8%. More dice → a bell curve. The gold bar is your roll.</p></details>
<details><summary>🔒 Fairness</summary><p>Rolls use <code>crypto.getRandomValues</code> with rejection sampling — every face is exactly equally likely, and past rolls never affect the next.</p></details>
<details><summary>⌨️ Keys</summary><p>Enter roll · A advantage · D disadvantage · R reroll · Esc close</p></details>`;

/* ===== 操作 ===== */
const doRoll = () => { const e = $('expr').value.trim(); if (/^nyan$/i.test(e)){ S.nyan = !S.nyan; save(); $('expr').value = S.expr = '6d6'; toast(S.nyan ? '🐾 にゃんこダイス ON' : '🐾 にゃんこダイス OFF'); rollExpr('6d6'); return; } S.expr = e; save(); rollExpr(e); };
$('bRoll').onclick = doRoll;
$('expr').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); doRoll(); } });
$('expr').addEventListener('input', () => { try { drawChart(parse($('expr').value), null); $('err').textContent = ''; } catch(e){} });
$('bCoc').onclick = cocRoll;
const dnd = e => { const m = +$('mod').value || 0, dc = $('dc').value === '' ? null : +$('dc').value; const ex = e + (m ? (m > 0 ? '+' : '') + m : ''); $('expr').value = S.expr = ex; save(); rollExpr(ex, { dc }); };
$('bAdv').onclick = () => dnd('2d20kh1'); $('bNorm').onclick = () => dnd('1d20'); $('bDis').onclick = () => dnd('2d20kl1');
$('bAbil').onclick = abilities;
$('bMac').onclick = () => { const e = $('expr').value.trim(); try { parse(e); } catch(er){ $('err').textContent = '⚠ ' + er; return; } const n = $('mName').value.trim() || e; S.macros.push([n.slice(0, 24), e]); $('mName').value = ''; save(); renderMacs(); toast(t('保存しました ⭐', 'Saved ⭐')); };
$('tLang').onclick = () => { S.lang = J() ? 'en' : 'ja'; save(); render(); };
$('tTheme').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; lsSet('meridiplay_theme', theme); render(); };
$('tSnd').onclick = () => { S.snd = !S.snd; ac(); save(); render(); };
$('tLook').onclick = () => { S.look = S.look === '3d' ? 'flat' : '3d'; save(); render(); toast(S.look === '3d' ? t('🎲 6 面ダイスを立体にしました', '🎲 3D d6 on') : t('🔷 平らな絵にしました（軽い）', '🔷 Flat dice (lighter)')); if (S.hist[0] && !/^CoC|×6/.test(S.hist[0][0])) rollExpr(S.expr); };
const info = $('info'); $('tInfo').onclick = () => info.classList.add('show'); $('iClose').onclick = () => info.classList.remove('show');
info.addEventListener('pointerdown', e => { if (e.target === info) info.classList.remove('show'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ info.classList.remove('show'); return; }
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'enter'){ e.preventDefault(); S.mode === 'coc' ? cocRoll() : doRoll(); }
  else if (k === 'a') dnd('2d20kh1'); else if (k === 'd') dnd('2d20kl1');
  else if (k === 'r'){ S.mode === 'coc' ? cocRoll() : doRoll(); }
});
let tt; function toast(m){ const e = $('toast'); e.textContent = m; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('show'), 2000); }
window.__dice = { parse, rollAll, distribution };
render();
})();
</script>
