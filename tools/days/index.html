<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridi Days — あと何日・記念日・うちの子・和暦 | Countdown, Anniversaries & Dates</title>
<meta name="description" content="📅 Days：大会や旅行まであと何日、お付き合いや結婚の記念日、うちの子（ペット）のお家記念日・誕生日、月命日、2つの日付の間の日数、和暦・年齢・干支を1ページで。広告なし・登録なし・通信なし。📅 Days: countdowns, anniversaries, pet birthdays, memorial days, days between dates and Japanese era years — ad-free, nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<style>
:root{--E:cubic-bezier(.22,1,.36,1);--bg:#030805;--ink:#d8ffd0;--sub:#8fbf8a;--line:#39ff1433;--card:#06120acc;--acc:#39ff14;--pink:#ff8ac8;--gold:#ffd36a;--calm:#9fb8d8}
body.light{--bg:#f2efe8;--ink:#1f2a20;--sub:#5a6a58;--line:#2a6a3e33;--card:#ffffffdd;--acc:#1f7a3a;--pink:#c23c86;--gold:#9a6a00;--calm:#4a6a8a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;min-height:100vh;transition:background .6s var(--E),color .6s var(--E)}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:7px;padding:10px 16px;flex-wrap:wrap}
.home{font:12px 'Courier New',monospace;opacity:.7;color:inherit;text-decoration:none}.home:hover{opacity:1;color:var(--acc)}
.sp{margin-right:auto}
.tg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 11px;font:12px 'Courier New',monospace;cursor:pointer;white-space:nowrap;transition:border-color .3s}
.tg:hover{border-color:var(--acc)}
h1{text-align:center;font:bold clamp(22px,4.4vw,34px) 'Courier New',monospace;letter-spacing:5px;color:var(--acc);margin-top:10px}
.lead{text-align:center;color:var(--sub);font-size:13px;line-height:1.8;margin:6px 16px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:980px;margin:16px auto 0;padding:0 12px}
.tab{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:13px;transition:all .3s var(--E)}
.tab:hover{border-color:var(--acc)}
.tab.on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:bold}
.wrap{max-width:980px;margin:14px auto 40px;padding:0 12px;display:grid;grid-template-columns:340px 1fr;gap:14px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(6px)}
.panel h2{font:bold 13px 'Courier New',monospace;letter-spacing:3px;color:var(--acc);margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
label.s{font-size:11px;color:var(--sub);min-width:70px}
input[type=text],input[type=date],input[type=time],input[type=number],select{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:14px;outline:none;transition:border-color .3s}
input:focus,select:focus{border-color:var(--acc)}
input[type=text]{flex:1;min-width:140px}
select option{background:var(--bg);color:var(--ink)}
.btn{background:transparent;border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:7px 13px;cursor:pointer;font-size:13px;transition:all .3s var(--E)}
.btn:hover{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.btn.solid{background:var(--acc);color:var(--bg);font-weight:bold}
.btn.ghost{border-color:var(--line);color:var(--sub)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 10px;font-size:12px;cursor:pointer}
.seg button.on{border-color:var(--acc);color:var(--acc)}
.hint{font-size:11px;color:var(--sub);line-height:1.6;margin-top:4px}
.preset{display:flex;flex-wrap:wrap;gap:5px;margin:-2px 0 10px}
.preset button{border:1px solid var(--line);background:transparent;border-radius:14px;padding:3px 9px;font-size:11px;cursor:pointer;color:var(--sub);transition:all .2s}
.preset button:hover{border-color:var(--pink);color:var(--pink)}
.card .soon{display:inline-block;font-size:10px;border:1px solid var(--pink);color:var(--pink);border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.timeline{font-size:11px;color:var(--sub);margin:-2px 0 8px;text-align:right}
.cards{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:30px 10px;line-height:1.8}
.card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;position:relative;transition:border-color .3s,box-shadow .3s}
.card .nm{font-weight:bold;font-size:15px;padding-right:90px}
.card .big{font:bold clamp(26px,5vw,38px) 'Courier New',monospace;color:var(--acc);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.card .big small{font-size:14px;margin-left:4px;color:var(--sub)}
.card .sub{font-size:12px;color:var(--sub);line-height:1.7}
.card .acts{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.card .acts button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 7px;font-size:11px;cursor:pointer;color:var(--sub)}
.card .acts button:hover{border-color:var(--acc);color:var(--acc)}
.card.k-anniv .big{color:var(--pink)}
.card.k-pet .big{color:var(--gold)}
.card.k-mem{border-color:color-mix(in srgb,var(--calm) 40%,transparent)}
.card.k-mem .big{color:var(--calm)}
.card.mile{border-color:var(--gold);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent),0 6px 22px color-mix(in srgb,var(--gold) 20%,transparent)}
.card .badge{display:inline-block;font-size:10px;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.res{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:4px}
.res .big{font:bold clamp(24px,4.5vw,34px) 'Courier New',monospace;color:var(--acc);font-variant-numeric:tabular-nums}
.res .sub{font-size:13px;color:var(--sub);line-height:1.9;margin-top:6px}
.res table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.res td{border-bottom:1px solid var(--line);padding:6px 4px}
.res td:first-child{color:var(--sub);width:42%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--acc);color:var(--bg);padding:8px 16px;border-radius:20px;font-weight:bold;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:11px;color:var(--sub);padding:20px 10px 30px}
</style>
</head>
<body>
<header>
  <a class="home" href="../">← Meridi Tools</a><span class="sp"></span>
  <button class="tg" id="tInfo">v1.0.0</button>
  <button class="tg" id="tLang">🌐 EN</button>
  <button class="tg" id="tTheme">☀️</button>
</header>
<h1>📅 <span id="tTitle"></span></h1>
<p class="lead" id="tLead"></p>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="panel" id="form"></div>
  <div class="panel"><h2 id="hRight"></h2><div id="right"></div></div>
</div>
<div id="toast"></div>
<footer>© 2026 Meridi Brand · <span id="fVer">Meridi Days v1.0.0</span> · 🐾 Built by one person and three cats</footer>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const LS = 'meridi_days_v1';
let lang = lsGet('meridiplay_lang') || ((navigator.language || 'en').startsWith('ja') ? 'ja' : 'en');
let theme = lsGet('meridiplay_theme') === 'light' ? 'light' : 'dark';
const J = () => lang === 'ja';
const t = (ja, en) => J() ? ja : en;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

let D = { cards: [] };
try { const x = JSON.parse(lsGet(LS) || 'null'); if (x && Array.isArray(x.cards)) D = x; } catch(e){}
const save = () => lsSet(LS, JSON.stringify(D));

// ---------- dates (local calendar days; no time-zone surprises) ----------
const pad = n => (n < 10 ? '0' : '') + n;
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parse = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const dayNum = d => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
const diff = (a, b) => dayNum(b) - dayNum(a);
const dim = (y, m) => new Date(y, m+1, 0).getDate();
const clampDay = (y, m, d) => new Date(y, m, Math.min(d, dim(y, m)));
const WD = () => J() ? ['日','月','火','水','木','金','土'] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt = d => J() ? (d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日（' + WD()[d.getDay()] + '）')
                     : (WD()[d.getDay()] + ', ' + d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'}));
const num = n => n.toLocaleString(J() ? 'ja-JP' : 'en-US');
function ageYM(from, to){ // full years and months
  let y = to.getFullYear() - from.getFullYear(), m = to.getMonth() - from.getMonth();
  if (to.getDate() < from.getDate()) m--;
  if (m < 0) { y--; m += 12; }
  return { y, m };
}
function nextYearly(base, from){ // next same month/day on or after `from` (Feb 29 → Feb 28)
  let d = clampDay(from.getFullYear(), base.getMonth(), base.getDate());
  if (diff(from, d) < 0) d = clampDay(from.getFullYear()+1, base.getMonth(), base.getDate());
  return d;
}
function nextMonthly(base, from){ // next same day of month (31st → last day of a short month)
  let d = clampDay(from.getFullYear(), from.getMonth(), base.getDate());
  if (diff(from, d) < 0) { const n = new Date(from.getFullYear(), from.getMonth()+1, 1); d = clampDay(n.getFullYear(), n.getMonth(), base.getDate()); }
  return d;
}
const MILES = [100,200,300,365,500,700,777,1000,1500,2000,2500,3000,4000,5000,7777,10000];
function nextMile(n){ for (const m of MILES) if (m > n) return m; return Math.ceil((n+1)/1000)*1000; }
// cat age in human years — a common rough guide (1 yr ≈ 15, 2 yrs ≈ 24, then about 4 per year)
function catHuman(y, m){ const a = y + m/12; if (a < 1) return Math.round(a*15); if (a < 2) return Math.round(15 + (a-1)*9); return Math.round(24 + (a-2)*4); }
// large dogs — common rough guide: 1 yr ≈ 12, then about 7 per year
function bigDogHuman(y, m){ const a = y + m/12; if (a < 1) return Math.round(a*12); return Math.round(12 + (a-1)*7); }
const KINDS = [
  {k:'cat',   ja:'🐈 猫',           en:'🐈 Cat',               h:catHuman},
  {k:'dog',   ja:'🐕 小型・中型犬', en:'🐕 Small/medium dog',  h:catHuman},
  {k:'bigdog',ja:'🐕‍🦺 大型犬',      en:'🐕‍🦺 Large dog',         h:bigDogHuman},
  {k:'rabbit',ja:'🐇 うさぎ',       en:'🐇 Rabbit'},
  {k:'small', ja:'🐹 小さな動物',   en:'🐹 Small pet'},
  {k:'bird',  ja:'🐦 鳥',           en:'🐦 Bird'},
  {k:'fish',  ja:'🐠 魚・水の生き物', en:'🐠 Fish & aquatic'},
  {k:'reptile',ja:'🦎 は虫類',      en:'🦎 Reptile'},
  {k:'other', ja:'🐾 ほか',         en:'🐾 Other'}
];
const kindOf = k => KINDS.find(x => x.k === k) || KINDS[0];

// ---------- Japanese eras / zodiac ----------
const ERAS = [ {ja:'令和',en:'Reiwa',s:[2019,5,1]}, {ja:'平成',en:'Heisei',s:[1989,1,8]}, {ja:'昭和',en:'Showa',s:[1926,12,25]}, {ja:'大正',en:'Taisho',s:[1912,7,30]}, {ja:'明治',en:'Meiji',s:[1868,10,23]} ];
function eraOf(d){ for (const e of ERAS){ const s = new Date(e.s[0], e.s[1]-1, e.s[2]); if (diff(s, d) >= 0) return { e, y: d.getFullYear() - e.s[0] + 1 }; } return null; }
const eraLabel = r => r ? ((J() ? r.e.ja : r.e.en + ' ') + (r.y === 1 && J() ? '元' : r.y) + (J() ? '年' : '')) : '—';
const ZJ = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'], ZE = ['Rat','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Goat','Monkey','Rooster','Dog','Pig'], ZI = ['🐭','🐮','🐯','🐰','🐲','🐍','🐴','🐑','🐵','🐔','🐶','🐗'];
const zodiac = y => { const i = ((y - 4) % 12 + 12) % 12; return ZI[i] + ' ' + (J() ? ZJ[i] + '（' + ['ね','うし','とら','う','たつ','み','うま','ひつじ','さる','とり','いぬ','い'][i] + '）' : ZE[i]); };

// ---------- tabs ----------
const TABS = [
  {k:'countdown', i:'⏳', ja:'あと何日',     en:'Countdown'},
  {k:'anniv',     i:'💞', ja:'記念日',       en:'Anniversary'},
  {k:'pet',       i:'🐾', ja:'うちの子',     en:'Our pet'},
  {k:'memorial',  i:'🌈', ja:'月命日・命日', en:'Memorial'},
  {k:'between',   i:'🔢', ja:'日数・曜日',   en:'Days between'},
  {k:'era',       i:'🎌', ja:'和暦・年齢・干支', en:'Era, age & zodiac'}
];
let tab = (location.hash || '').slice(1);
if (!TABS.some(x => x.k === tab)) tab = lsGet('meridi_days_tab') || 'countdown';
if (!TABS.some(x => x.k === tab)) tab = 'countdown';
function setTab(k){ tab = k; lsSet('meridi_days_tab', k); try { history.replaceState(null, '', '#' + k); } catch(e){} render(); }
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (TABS.some(x => x.k === k) && k !== tab) setTab(k); });

const toast = m => { const e = $('toast'); e.textContent = m; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1800); };

// ---------- forms ----------
const CARD_TABS = ['countdown','anniv','pet','memorial'];
const ANNIV_PRESETS = [
  {i:'💬', ja:'告白',         en:'Confession'},
  {i:'☕', ja:'初デート',     en:'First date'},
  {i:'💑', ja:'お付き合い',   en:'Dating'},
  {i:'🏠', ja:'同棲',         en:'Moving in'},
  {i:'💍', ja:'プロポーズ',   en:'Proposal'},
  {i:'💍', ja:'婚約',         en:'Engagement'},
  {i:'💒', ja:'結婚',         en:'Wedding'},
  {i:'✈️', ja:'初めての旅行', en:'First trip'}
];
const SOON = 14; // days — "coming soon" mark
let editId = null;
function formHTML(){
  const ex = editId ? D.cards.find(c => c.id === editId) : null;
  const v = ex || {};
  const nameRow = ph => `<div class="row"><label class="s">${t('名前','Name')}</label><input type="text" id="fName" maxlength="40" placeholder="${esc(ph)}" value="${esc(v.name||'')}"></div>`;
  const dateRow = (lab, id, val) => `<div class="row"><label class="s">${lab}</label><input type="date" id="${id}" value="${esc(val||'')}"></div>`;
  const btns = `<div class="row" style="margin-top:12px"><button class="btn solid" id="fSave">${ex ? t('✓ 更新する','✓ Update') : t('＋ カードを作る','＋ Add card')}</button>${ex ? `<button class="btn ghost" id="fCancel">${t('やめる','Cancel')}</button>` : ''}</div>`;
  if (tab === 'countdown') return `<h2>⏳ ${t('あと何日','COUNTDOWN')}</h2>${nameRow(t('例：大会・旅行・年越し','e.g. tournament, trip, New Year'))}${dateRow(t('その日','Date'),'fDate',v.date)}
    <div class="row"><label class="s">${t('時刻（任意）','Time (optional)')}</label><input type="time" id="fTime" value="${esc(v.time||'')}"></div>
    <p class="hint">${t('時刻を入れると「あと○時間○分」まで出ます。','Add a time to see hours and minutes too.')}</p>${btns}`;
  if (tab === 'anniv') return `<h2>💞 ${t('記念日','ANNIVERSARY')}</h2>${nameRow(t('例：お付き合い・結婚','e.g. dating, wedding'))}
    <div class="preset" id="fPreset">${ANNIV_PRESETS.map(p => `<button type="button" data-n="${esc(J() ? p.ja : p.en)}">${esc(p.i + ' ' + (J() ? p.ja : p.en))}</button>`).join('')}</div>${dateRow(t('始まりの日','Start date'),'fDate',v.date)}
    <p class="hint">${t('○日目と、次の節目（100日・1年・1000日など）までの日数が出ます。','Shows the day count and the next milestone (100 days, 1 year, 1,000 days…).')}</p>${btns}`;
  if (tab === 'pet') return `<h2>🐾 ${t('うちの子','OUR PET')}</h2>${nameRow(t('例：ミケ','e.g. Momo'))}
    ${dateRow(t('お家に来た日','Came home'),'fDate',v.date)}${dateRow(t('お誕生日','Birthday'),'fBirth',v.birth)}
    <p class="hint" style="margin:-4px 0 8px">${t('どちらか1つだけでもカードを作れます。','Either date is enough to make a card.')}</p>
    <div class="row"><label class="s">${t('種類','Kind')}</label><select id="fKindSel">${KINDS.map(x => `<option value="${x.k}"${(v.kind||'cat')===x.k?' selected':''}>${J() ? x.ja : x.en}</option>`).join('')}</select></div>
    <p class="hint">${t('猫・犬は「人でいうと何歳」も出ます（よく使われる目安）。猫と小型・中型犬は 1歳で約15歳・2歳で約24歳・そのあと1年で約4歳、大型犬は 1歳で約12歳・そのあと1年で約7歳。ほかの動物は種類によって大きく違うので出していません。','For cats and dogs, "in human years" uses a common rough guide: cats and small/medium dogs 1 yr ≈ 15, 2 yrs ≈ 24, then about 4 per year; large dogs 1 yr ≈ 12, then about 7 per year. Other animals vary too much by species, so no estimate is shown.')}</p>${btns}`;
  if (tab === 'memorial') return `<h2>🌈 ${t('月命日・命日','MEMORIAL')}</h2>${nameRow(t('例：ミケ','e.g. Momo'))}${dateRow(t('その日','Date'),'fDate',v.date)}
    <div class="row"><label class="s">${t('くり返し','Repeat')}</label><div class="seg" id="fRep">${[['monthly',t('毎月（月命日）','Every month')],['yearly',t('毎年（命日）','Every year')]].map(([k,l]) => `<button data-k="${k}" class="${(v.rep||'monthly')===k?'on':''}">${l}</button>`).join('')}</div></div>
    <p class="hint">${t('31日のように、その月にない日は月の最後の日に合わせます。','If a month is shorter, the last day of that month is used.')}</p>${btns}`;
  if (tab === 'between') return `<h2>🔢 ${t('日数・曜日','DAYS BETWEEN')}</h2>${dateRow(t('はじめ','From'),'bA',ymd(today()))}${dateRow(t('おわり','To'),'bB','')}
    <div class="row"><label class="s">${t('または','Or')}</label><input type="number" id="bN" placeholder="${t('○日後','days later')}" style="width:120px"><span class="hint" style="margin:0">${t('（マイナスで○日前）','(minus = days before)')}</span></div>
    <div class="row"><label class="s">${t('数え方','Count')}</label><div class="seg" id="bInc">${[['0',t('ふつう','Normal')],['1',t('初日も入れる','Include first day')]].map(([k,l]) => `<button data-k="${k}" class="${k==='0'?'on':''}">${l}</button>`).join('')}</div></div>`;
  if (tab === 'era') return `<h2>🎌 ${t('和暦・年齢・干支','ERA, AGE & ZODIAC')}</h2>${dateRow(t('生年月日など','Birth date etc.'),'eD','')}
    <div class="row"><label class="s">${t('西暦→和暦','Year → era')}</label><input type="number" id="eY" placeholder="2026" style="width:110px"></div>
    <div class="row"><label class="s">${t('和暦→西暦','Era → year')}</label><select id="eE">${ERAS.map(e => `<option value="${e.ja}">${J() ? e.ja : e.en}</option>`).join('')}</select><input type="number" id="eN" placeholder="${t('年','year')}" style="width:80px"></div>`;
  return '';
}
function bindForm(){
  const segPick = id => { const s = $(id); if (!s) return; s.querySelectorAll('button').forEach(b => b.onclick = () => { s.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); if (!CARD_TABS.includes(tab)) calc(); }); };
  ['fKind','fRep','bInc'].forEach(segPick);
  const pr = $('fPreset'); if (pr) pr.querySelectorAll('button').forEach(b => b.onclick = () => { $('fName').value = b.dataset.n; $('fName').focus(); });
  const segVal = id => { const b = $(id) && $(id).querySelector('button.on'); return b ? b.dataset.k : null; };
  if ($('fSave')) $('fSave').onclick = () => {
    const date = $('fDate').value, birth = $('fBirth') ? $('fBirth').value : '';
    if (!parse(date) && !(tab === 'pet' && parse(birth))) { toast(tab === 'pet' ? t('お家に来た日か、お誕生日を入れてください','Enter the day they came home, or their birthday') : t('日付を入れてください','Please enter a date')); return; }
    const c = { id: editId || Date.now(), type: tab, name: ($('fName').value || '').trim(), date };
    if (tab === 'countdown') c.time = $('fTime').value || '';
    if (tab === 'pet') { c.birth = birth || ''; c.kind = $('fKindSel').value || 'cat'; }
    if (tab === 'memorial') c.rep = segVal('fRep') || 'monthly';
    if (editId) D.cards = D.cards.map(x => x.id === editId ? c : x); else D.cards.push(c);
    editId = null; save(); render(); toast(t('保存しました（この端末の中だけ）','Saved — on this device only'));
  };
  if ($('fCancel')) $('fCancel').onclick = () => { editId = null; render(); };
  ['bA','bB','bN','eD','eY','eE','eN'].forEach(id => { const e = $(id); if (e) e.oninput = e.onchange = calc; });
}

// ---------- cards ----------
function cardInfo(c){
  const T = today(), base = parse(c.date); if (!base && !(c.type === 'pet' && parse(c.birth))) return null;
  const o = { big:'', unit:'', sub:[], mile:false, badge:'' };
  if (c.type === 'countdown'){
    const d = diff(T, base);
    if (c.time && d >= 0){
      const [h, m] = c.time.split(':').map(Number), tgt = new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m);
      const ms = tgt - new Date();
      if (ms > 0){ const dd = Math.floor(ms/864e5), hh = Math.floor(ms%864e5/36e5), mm = Math.floor(ms%36e5/6e4);
        o.big = num(dd); o.unit = t('日','days') + ' ' + hh + t('時間','h') + ' ' + mm + t('分','m'); }
      else { o.big = t('当日','Today'); o.unit = ''; }
    } else if (d > 0){ o.big = num(d); o.unit = t('日','days'); }
    else if (d === 0){ o.big = t('今日！','Today!'); o.mile = true; }
    else { o.big = num(-d); o.unit = t('日前に終了','days ago'); }
    o.sub.push('📅 ' + fmt(base) + (c.time ? ' ' + c.time : ''));
    if (d > 7) o.sub.push(t('約 ' + Math.round(d/7) + ' 週間後','about ' + Math.round(d/7) + ' weeks to go'));
    o.ics = { date: base, time: c.time, title: c.name || t('あと何日','Countdown'), rr: '' };
  }
  if (c.type === 'anniv'){
    const d = diff(base, T) + 1; // day 1 = the start day
    if (d < 1){ o.big = num(1 - d); o.unit = t('日後にスタート','days to go'); }
    else {
      o.big = num(d); o.unit = t('日目','days together');
      const nm = nextMile(d - 1), nmDate = new Date(base.getFullYear(), base.getMonth(), base.getDate() + nm - 1);
      const ny = nextYearly(base, T), yrs = ny.getFullYear() - base.getFullYear();
      if (MILES.includes(d)) { o.mile = true; o.badge = '✨ ' + num(d) + t('日目','th day'); }
      if (diff(T, ny) === 0 && yrs > 0) { o.mile = true; o.badge = '✨ ' + yrs + t('周年','-year anniversary'); }
      o.sub.push(t('次の節目：' + num(nm) + '日目まで あと ' + num(diff(T, nmDate)) + ' 日（' + fmt(nmDate) + '）', 'Next milestone: day ' + num(nm) + ' in ' + num(diff(T, nmDate)) + ' days (' + fmt(nmDate) + ')'));
      if (yrs > 0 && diff(T, ny) > 0) o.sub.push(t(yrs + '周年まで あと ' + num(diff(T, ny)) + ' 日', yrs + '-year anniversary in ' + num(diff(T, ny)) + ' days'));
      const ym = ageYM(base, T); o.sub.push(t(ym.y + '年' + ym.m + 'か月', ym.y + ' yr ' + ym.m + ' mo'));
      const nxt = Math.min(diff(T, nmDate), yrs > 0 && diff(T, ny) > 0 ? diff(T, ny) : 1e9);
      o.next = nxt; if (!o.mile && nxt > 0 && nxt <= SOON) o.soon = t('もうすぐ（あと' + nxt + '日）','soon — ' + nxt + ' days');
    }
    o.sub.push('📅 ' + fmt(base));
    o.ics = { date: base, title: (c.name || t('記念日','Anniversary')) + ' 💞', rr: 'YEARLY' };
  }
  if (c.type === 'pet'){
    const b = parse(c.birth), K = kindOf(c.kind || 'cat');
    if (base){
      const d = diff(base, T) + 1;
      o.big = num(Math.max(d, 0)); o.unit = t('日目','days home');
      if (MILES.includes(d)) { o.mile = true; o.badge = '✨ ' + num(d) + t('日目','th day'); }
      const nh = nextYearly(base, T), hy = nh.getFullYear() - base.getFullYear();
      if (diff(T, nh) === 0 && hy > 0) { o.mile = true; o.badge = '🏠 ' + t('お家記念日 ' + hy + '周年','home anniversary ' + hy); }
      else if (hy > 0) o.sub.push(t('🏠 お家記念日（' + hy + '周年）まで あと ' + num(diff(T, nh)) + ' 日', '🏠 Home anniversary #' + hy + ' in ' + num(diff(T, nh)) + ' days'));
    }
    if (b){
      const ym = ageYM(b, T), nb = nextYearly(b, T), by = nb.getFullYear() - b.getFullYear();
      if (!base){ o.big = t(ym.y + '歳' + ym.m + 'か月', ym.y + ' yr ' + ym.m + ' mo'); o.unit = ''; }
      else o.sub.push(t('🎂 ' + ym.y + '歳' + ym.m + 'か月', '🎂 ' + ym.y + ' yr ' + ym.m + ' mo'));
      if (diff(T, nb) === 0) { o.mile = true; o.badge = '🎂 ' + t(by + '歳のお誕生日！','Happy birthday — ' + by + '!'); }
      else o.sub.push(t('次のお誕生日（' + by + '歳）まで あと ' + num(diff(T, nb)) + ' 日', 'Next birthday (' + by + ') in ' + num(diff(T, nb)) + ' days'));
      if (K.h) o.sub.push(t(K.ja.split(' ')[0] + ' 人でいうと 約 ' + K.h(ym.y, ym.m) + ' 歳（目安）', K.en.split(' ')[0] + ' About ' + K.h(ym.y, ym.m) + ' in human years (rough guide)'));
    }
    o.sub.push(K[J() ? 'ja' : 'en'] + (base ? ' · 🏠 ' + fmt(base) : '') + (b ? ' · 🎂 ' + fmt(b) : ''));
    o.ics = { date: b || base, title: (c.name || t('うちの子','Our pet')) + (b ? t(' のお誕生日 🎂',' — birthday 🎂') : t(' のお家記念日 🏠',' — home anniversary 🏠')), rr: 'YEARLY' };
  }
  if (c.type === 'memorial'){
    const monthly = (c.rep || 'monthly') === 'monthly', nx = monthly ? nextMonthly(base, T) : nextYearly(base, T), dn = diff(T, nx);
    if (dn === 0){ o.big = t('今日','Today'); o.unit = monthly ? t('は月命日','— monthly memorial') : t('は命日','— memorial day'); }
    else { o.big = num(dn); o.unit = monthly ? t('日後に月命日','days to the monthly memorial') : t('日後に命日','days to the memorial day'); }
    o.sub.push('🌈 ' + fmt(nx));
    const ym = ageYM(base, T); if (diff(base, T) > 0) o.sub.push(t('あの日から ' + ym.y + '年' + ym.m + 'か月', ym.y + ' yr ' + ym.m + ' mo since'));
    o.sub.push('📅 ' + fmt(base));
    o.ics = { date: base, title: (c.name || '') + ' 🌈', rr: monthly ? 'MONTHLY' : 'YEARLY' };
  }
  return o;
}
function icsFor(c, o){
  const i = o.ics, d = i.date, s = d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
  let dt;
  if (i.time){ const [h, m] = i.time.split(':'); dt = 'DTSTART:' + s + 'T' + pad(+h) + pad(+m) + '00\r\nDURATION:PT1H'; }
  else { const e = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1); dt = 'DTSTART;VALUE=DATE:' + s + '\r\nDTEND;VALUE=DATE:' + e.getFullYear() + pad(e.getMonth()+1) + pad(e.getDate()); }
  let rr = '';
  if (i.rr === 'YEARLY') rr = '\r\nRRULE:FREQ=YEARLY';
  if (i.rr === 'MONTHLY') rr = '\r\nRRULE:FREQ=MONTHLY;BYMONTHDAY=' + (d.getDate() > 28 ? '-1' : d.getDate());
  const now = new Date(), stamp = now.getUTCFullYear() + pad(now.getUTCMonth()+1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + '00Z';
  const txt = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Meridi Brand//Days//EN','BEGIN:VEVENT','UID:' + c.id + '@meridibrand.com','DTSTAMP:' + stamp, dt + rr, 'SUMMARY:' + i.title.replace(/[,;\\]/g, ' '),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'text/calendar'})); a.download = (c.name || 'meridi-days').replace(/[\\/:*?"<>|]/g, '') + '.ics';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(t('カレンダー用のファイルを作りました','Calendar file created'));
}
function cardsHTML(){
  let list = D.cards.filter(c => c.type === tab);
  if (tab === 'anniv') list = list.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (!list.length) return `<div class="empty">${t('まだカードがありません。<br>左で日付を入れて「＋ カードを作る」を押してください。<br><small>入れた内容は、この端末の中だけに保存されます。</small>','No cards yet.<br>Enter a date on the left and press "＋ Add card".<br><small>Everything stays on this device.</small>')}</div>`;
  let head = '';
  if (tab === 'anniv' && list.length > 1){
    const first = parse(list[0].date), ym = first ? ageYM(first, today()) : null;
    head = `<div class="timeline">💞 ${t('古い順に並んでいます','Oldest first')}${ym ? ' · ' + esc(t('はじまりから ' + ym.y + '年' + ym.m + 'か月', ym.y + ' yr ' + ym.m + ' mo since the first')) : ''}</div>`;
  }
  return head + '<div class="cards">' + list.map(c => { const o = cardInfo(c); if (!o) return '';
    return `<div class="card k-${c.type}${o.mile && c.type !== 'memorial' ? ' mile' : ''}" data-id="${c.id}">
      <div class="acts"><button data-a="ics" title="${t('カレンダーに追加','Add to calendar')}">📅</button><button data-a="edit" title="${t('直す','Edit')}">✏️</button><button data-a="del" title="${t('消す','Delete')}">✕</button></div>
      <div class="nm">${esc(c.name || TABS.find(x => x.k === c.type)[J() ? 'ja' : 'en'])}${o.badge ? `<span class="badge">${esc(o.badge)}</span>` : ''}${o.soon ? `<span class="soon">⏳ ${esc(o.soon)}</span>` : ''}</div>
      <div class="big">${esc(o.big)}<small>${esc(o.unit)}</small></div>
      <div class="sub">${o.sub.map(esc).join('<br>')}</div></div>`; }).join('') + '</div>';
}
function bindCards(){
  document.querySelectorAll('.card .acts button').forEach(b => b.onclick = () => {
    const id = +b.closest('.card').dataset.id, c = D.cards.find(x => x.id === id); if (!c) return;
    if (b.dataset.a === 'del'){ if (!confirm(t('このカードを消しますか？','Delete this card?'))) return; D.cards = D.cards.filter(x => x.id !== id); save(); render(); }
    if (b.dataset.a === 'edit'){ editId = id; render(); window.scrollTo({top:0, behavior:'smooth'}); }
    if (b.dataset.a === 'ics'){ const o = cardInfo(c); if (o) icsFor(c, o); }
  });
}

// ---------- calculators ----------
function calc(){
  const R = $('right'); if (!R) return;
  if (tab === 'between'){
    const A = parse($('bA').value), B = parse($('bB').value), N = $('bN').value, inc = ($('bInc').querySelector('button.on') || {}).dataset;
    const plus = inc && inc.k === '1' ? 1 : 0;
    if (A && N !== '' && !isNaN(+N) && !B){
      const r = new Date(A.getFullYear(), A.getMonth(), A.getDate() + (+N));
      R.innerHTML = `<div class="res"><div class="sub">${esc(fmt(A))} ${t('の','')} ${esc(num(+N))} ${t('日' + (+N < 0 ? '前' : '後') + 'は', 'days ' + (+N < 0 ? 'before' : 'later'))}</div><div class="big">${esc(fmt(r))}</div><div class="sub">${esc(eraLabel(eraOf(r)))}</div></div>`; return;
    }
    if (A && B){
      const d = diff(A, B), ad = Math.abs(d) + plus, ym = ageYM(d >= 0 ? A : B, d >= 0 ? B : A);
      let wd = 0; const s = d >= 0 ? A : B; for (let i = 0; i < Math.abs(d) + plus && i < 40000; i++){ const x = new Date(s.getFullYear(), s.getMonth(), s.getDate() + i + (plus ? 0 : 1)); if (x.getDay() % 6) wd++; }
      R.innerHTML = `<div class="res"><div class="big">${esc(num(ad))} <small style="font-size:14px">${t('日','days')}</small></div>
        <table><tr><td>${t('週にすると','In weeks')}</td><td>${esc(Math.floor(ad/7) + t('週間と','w ') + ad%7 + t('日','d'))}</td></tr>
        <tr><td>${t('年・月にすると','In years & months')}</td><td>${esc(t(ym.y + '年' + ym.m + 'か月', ym.y + ' yr ' + ym.m + ' mo'))}</td></tr>
        <tr><td>${t('平日（土日を除く）','Weekdays (no Sat/Sun)')}</td><td>${esc(num(wd))} ${t('日','days')}</td></tr>
        <tr><td>${t('おわりの日の曜日','Day of the week')}</td><td>${esc(fmt(B))}</td></tr></table>
        <p class="hint">${t('祝日は数えていません。','Public holidays are not taken into account.')}</p></div>`; return;
    }
    R.innerHTML = `<div class="empty">${t('2つの日付か、「○日後」を入れてください。','Enter two dates, or a number of days.')}</div>`;
  }
  if (tab === 'era'){
    let h = '';
    const d = parse($('eD').value);
    if (d){ const T = today(), ym = ageYM(d, T), r = eraOf(d);
      h += `<div class="res"><table>
        <tr><td>${t('和暦','Japanese era')}</td><td>${esc(eraLabel(r))}${r ? esc(t((d.getMonth()+1) + '月' + d.getDate() + '日','')) : ''}</td></tr>
        <tr><td>${t('今の年齢','Age today')}</td><td><b>${esc(t(ym.y + '歳' + ym.m + 'か月', ym.y + ' yr ' + ym.m + ' mo'))}</b></td></tr>
        <tr><td>${t('干支','Zodiac')}</td><td>${esc(zodiac(d.getFullYear()))}</td></tr>
        <tr><td>${t('生まれた曜日','Day of the week')}</td><td>${esc(WD()[d.getDay()] + t('曜日',''))}</td></tr>
        <tr><td>${t('生まれてから','Days since')}</td><td>${esc(num(diff(d, T)))} ${t('日','days')}</td></tr>
        <tr><td>${t('次のお誕生日まで','Next birthday in')}</td><td>${esc(num(diff(T, nextYearly(d, T))))} ${t('日','days')}</td></tr></table>
        <p class="hint">${t('1月1日〜2月3日ごろ生まれの干支は、数え方（立春から）によって前の年になることがあります。','Zodiac is shown by calendar year; some traditions start the year at the lunar new year or early February.')}</p></div>`; }
    const y = +$('eY').value;
    if (y >= 1868 && y <= 2200){ const end = new Date(y, 11, 31), st = new Date(y, 0, 1), r1 = eraOf(st), r2 = eraOf(end);
      h += `<div class="res" style="margin-top:10px"><div class="sub">${esc(y)} ${t('年は','is')}</div><div class="big" style="font-size:26px">${esc(eraLabel(r1))}${r1 && r2 && r1.e !== r2.e ? ' / ' + esc(eraLabel(r2)) : ''}</div><div class="sub">${esc(zodiac(y))}</div></div>`; }
    const en = $('eE').value, n = +$('eN').value, E = ERAS.find(e => e.ja === en);
    if (E && n >= 1 && n <= 100){ const yy = E.s[0] + n - 1;
      h += `<div class="res" style="margin-top:10px"><div class="sub">${esc(J() ? E.ja + n + '年は' : E.en + ' ' + n + ' is')}</div><div class="big" style="font-size:26px">${esc(yy)}${t('年','')}</div><div class="sub">${esc(zodiac(yy))}</div></div>`; }
    R.innerHTML = h || `<div class="empty">${t('生年月日や、西暦・和暦を入れてください。','Enter a birth date, a year, or an era year.')}</div>`;
  }
}

// ---------- render ----------
function render(){
  document.body.classList.toggle('light', theme === 'light'); document.documentElement.lang = J() ? 'ja' : 'en';
  $('tTitle').textContent = 'DAYS';
  $('tLead').innerHTML = t('あと何日・記念日・うちの子・月命日・日数・和暦を、1ページで。<br>入れた日付は、この端末の中だけに保存されます（通信なし・登録なし）。','Countdowns, anniversaries, pets, memorial days, days between dates and Japanese eras — in one page.<br>Everything stays on this device (no upload, no sign-up).');
  $('tLang').textContent = J() ? '🌐 EN' : '🌐 日本語'; $('tTheme').textContent = theme === 'light' ? '🌙' : '☀️';
  $('tabs').innerHTML = TABS.map(x => `<button class="tab${x.k === tab ? ' on' : ''}" data-k="${x.k}">${x.i} ${J() ? x.ja : x.en}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { editId = null; setTab(b.dataset.k); });
  $('form').innerHTML = formHTML(); bindForm();
  const isCards = CARD_TABS.includes(tab);
  $('hRight').textContent = isCards ? t('カード','CARDS') : t('結果','RESULT');
  if (isCards){ $('right').innerHTML = cardsHTML(); bindCards(); } else calc();
}
$('tLang').onclick = () => { lang = J() ? 'en' : 'ja'; lsSet('meridiplay_lang', lang); render(); };
$('tTheme').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; lsSet('meridiplay_theme', theme); render(); };
$('tInfo').onclick = () => alert(t('📅 Meridi Days v1.0.0\n\n・6つのタブ：あと何日／記念日／うちの子／月命日・命日／日数・曜日／和暦・年齢・干支\n・カードは端末の中だけに保存\n・📅 でカレンダーに追加（毎年・毎月のくり返し）\n・アドレスに #countdown などを付けると、そのタブで開きます','📅 Meridi Days v1.0.0\n\n• 6 tabs: countdown / anniversary / our pet / memorial / days between / era, age & zodiac\n• Cards are saved on this device only\n• 📅 adds to your calendar (yearly / monthly repeat)\n• Add #countdown etc. to the address to open a tab directly'));
setInterval(() => { if (tab === 'countdown' && !editId) { const r = $('right'); if (r) { r.innerHTML = cardsHTML(); bindCards(); } } }, 30000);
render();
})();
</script>
