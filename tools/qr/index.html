  sms:  { ic:'💬', n:['SMS','SMS'], f:[['tel',['電話番号','Phone number'],''],['body',['本文','Message'],'','area']], build: v => v.tel ? `SMSTO:${v.tel.replace(/[^\d+]/g, '')}:${v.body || ''}` : '' },
};
const MARKS = ['', '🐾', '🐈', '🐈‍⬛', '😺', '☕', '⭐', '❤️', '🎵', '🍜'];

/* ===== 描く ===== */
let last = null;
function contrast(a, b){ const L = h => { const n = parseInt(h.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }; const x = L(a), y = L(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
function svgOf(q, fg, bg, round, mark){

  const inMark = (x, y) => mark && x >= m0 - .5 && x < m0 + ms + .5 && y >= m0 - .5 && y < m0 + ms + .5;
  const isFinder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  let p = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
    if (!q.modules[y][x] || inMark(x, y)) continue;
    if (round && !isFinder(x, y)) p += `<circle cx="${x + Q + .5}" cy="${y + Q + .5}" r=".46"/>`;
    else p += `<rect x="${x + Q}" y="${y + Q}" width="1.02" height="1.02"/>`;
  }
  let mk = '';
  if (mark){ const c = Q + n / 2; mk = `<rect x="${c - ms / 2}" y="${c - ms / 2}" width="${ms}" height="${ms}" rx="${ms * .22}" fill="${bg}"/><text x="${c}" y="${c + ms * .33}" font-size="${ms * .82}" text-anchor="middle">${mark}</text>`; }

function update(){
  const T = TYPES[S.type], data = T.build(S.v[S.type] || {}), fg = $('cFg').value, bg = $('cBg').value;
  const ecl = S.mark ? 'H' : S.ecl; $('sEcl').value = ecl; $('sEcl').disabled = !!S.mark;
  if (!data){ $('qrBox').innerHTML = `<div style="color:#999;font-size:13px;padding:20px;text-align:center">${t('左に入力すると、ここに QR コードが出ます', 'Fill in the form to make a QR code')}</div>`; $('meta').textContent = ''; $('warn').textContent = ''; last = null; return; }
  let q; try { q = QR.encode(data, ecl); } catch(e){ $('warn').textContent = t('⚠ 長すぎて QR コードに入りません。短くしてください。', '⚠ Too long to fit in a QR code.'); last = null; return; }
  const svg = svgOf(q, fg, bg, $('cRound').checked, S.mark); last = { svg, q, data };
  $('qrBox').innerHTML = svg; $('qrBox').style.background = bg;
  $('meta').innerHTML = t(`版 ${q.version}（${q.size}×${q.size} マス）・誤り訂正 ${ecl}・${q.bytes} バイト`, `Version ${q.version} (${q.size}×${q.size}) · error correction ${ecl} · ${q.bytes} bytes`);
  const c = contrast(fg, bg), w = [];
  if (c < 3) w.push(t('⚠ 色の差が小さく、読み取れないことがあります。', '⚠ Low contrast — may not scan.'));
  const lum = h => { const n = parseInt(h.slice(1), 16); return (n >> 16) * .299 + (n >> 8 & 255) * .587 + (n & 255) * .114; };
  if (lum(fg) > lum(bg)) w.push(t('⚠ 明るい模様に暗い背景は、読めないアプリがあります。', '⚠ Light-on-dark codes fail in some apps.'));
  if (q.version > 15) w.push(t('ℹ 情報が多いので模様が細かくなっています。印刷は大きめに。', 'ℹ Dense code — print it larger.'));
  $('warn').textContent = w.join(' ');
}
function renderForm(){
  const T = TYPES[S.type], v = S.v[S.type] = S.v[S.type] || {};
  $('form').innerHTML = T.f.map(([k, lab, ph, kind, opts]) => {
    const L = Array.isArray(lab) ? (J() ? lab[0] : lab[1]) : lab;
    if (kind === 'area') return `<div class="f">${L ? `<label>${L}</label>` : ''}<textarea data-k="${k}" placeholder="${S.type === 'text' ? t('ここに文字を入れてください', 'Type your text') : ''}">${(v[k] || '').replace(/</g, '&lt;')}</textarea></div>`;
    if (kind === 'sel') return `<div class="f"><label>${L}</label><select data-k="${k}">${opts.map(o => `<option ${(v[k] || ph) === o ? 'selected' : ''} value="${o}">${o === 'nopass' ? t('なし', 'None') : o}</option>`).join('')}</select></div>`;
    if (kind === 'chk') return `<label class="sw" style="margin-bottom:8px"><input type="checkbox" data-k="${k}" ${v[k] ? 'checked' : ''}> ${L}</label>`;
    return `<div class="f"><label>${L}</label><input data-k="${k}" value="${(v[k] || '').replace(/"/g, '&quot;')}" placeholder="${ph}" autocomplete="off"></div>`;
  }).join('') + (S.type === 'wifi' ? `<p style="font-size:11.5px;color:var(--sub);line-height:1.7">${t('🔒 パスワードは QR コードの中に入ります。お客さん用の Wi-Fi など、見られても良いネットワークで使ってください。この画面からは、どこにも送られません。', '🔒 The password is stored inside the code — use it for guest networks. Nothing is sent anywhere.')}</p>` : '');
  $('form').querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', () => { v[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; save(); update(); }));
}
function render(){
  document.documentElement.lang = lang; document.body.classList.toggle('light', theme === 'light');
  $('tLang').textContent = J() ? '🌐 EN' : '🌐 日本語'; $('tTheme').textContent = theme === 'light' ? t('🌙 ダーク', '🌙 Dark') : t('☀️ ノーマル', '☀️ Normal');
  $('lead').textContent = t('作った QR コードは、入れた文字がそのまま模様になる「直接の QR」です。どこのサイトも通らないので、期限切れにならず、ずっと使えます。作るのも全部この端末の中です。', 'These are direct QR codes: your text becomes the pattern itself. No redirect site in between, so they never expire. Everything happens on this device.');
  $('tabs').innerHTML = ''; Object.entries(TYPES).forEach(([k, T]) => { const b = document.createElement('button'); b.className = 'tg' + (S.type === k ? ' on' : ''); b.textContent = T.ic + ' ' + (J() ? T.n[0] : T.n[1]); b.onclick = () => { S.type = k; save(); render(); }; $('tabs').append(b); });

  $('marks').querySelectorAll('button').forEach(b => b.onclick = () => { S.mark = b.dataset.m; save(); render(); });
  $('bCopy').textContent = t('📋 画像をコピー', '📋 Copy image'); $('lSize').textContent = t('PNG の大きさ', 'PNG size');
  $('iP').textContent = t('広告なし・登録なし・通信なし。入れた文字やパスワードは、この端末の中だけで QR コードになります。', 'No ads, no sign-up, no network. Your text and passwords only become a QR code on this device.');
  $('iCof').textContent = t('ひとりで作っています。チラシやお店で役に立ったら、コーヒー 1 杯分の応援がうれしいです。', 'Made by one person. If it helped your shop or flyer, a coffee would mean a lot.');
  $('iCl').innerHTML = '📜 <b>v1.0.0 — 2026-11-16</b><br>' + t('・最初の公開：URL・文字・Wi-Fi・連絡先・メール・電話・SMS の 7 種類／模様と背景の色、丸い点、真ん中の絵（🐾 など 9 種）／誤り訂正 L・M・Q・H／PNG（512〜2048）と SVG の保存、画像のコピー、印刷／色の差の注意／説明書き', '• First release: 7 types (URL, text, Wi-Fi, contact, email, phone, SMS) / colours, rounded dots, center marks (🐾 and more) / error correction L·M·Q·H / PNG (512–2048) & SVG export, copy, print / contrast warnings / guide');
  $('guide').innerHTML = J() ? GUIDE_JA : GUIDE_EN;
  renderForm(); update();
}
const GUIDE_JA = `<h3>📖 説明書き（ちょっと高度）</h3>
<details open><summary>「直接の QR」と「動的 QR」のちがい</summary><p>「無料の QR 作成」の中には、作った QR コードの中身が<b>作成サイトの転送用の URL</b>になっているものがあります（動的 QR）。読み取ると、いったんそのサイトを通ってから目的のページへ移ります。そのため、しばらくすると有料の会員にならないと使えなくなったり、広告が挟まったり、いつ誰が読み取ったかを記録されたりすることがあります。</p><p>Meridi QR は、入れた URL や文字が<b>そのまま模様</b>になる「直接の QR」です。間に何も通らないので、期限切れになりません。そのかわり、印刷したあとに中身を書き換えることはできません。</p></details>
<details><summary>誤り訂正 L・M・Q・H</summary><p>QR コードは、模様が少し欠けたり汚れたりしても読めるように、同じ情報を余分に入れています。H にすると約 30% が欠けても読めるので、真ん中に絵を置けます。そのかわり、模様は細かくなります。</p><table><tr><th>L</th><td>約 7%</td><td>情報をたくさん入れたいとき</td></tr><tr><th>M</th><td>約 15%</td><td>ふつう</td></tr><tr><th>Q</th><td>約 25%</td><td>汚れやすい場所（工場・屋外）</td></tr><tr><th>H</th><td>約 30%</td><td>真ん中に絵を入れるとき</td></tr></table></details>
<details><summary>印刷するときの大きさの目安</summary><p>読み取る距離の<b>約 10 分の 1</b>が目安です。手に持って読むチラシなら 2〜3cm、2m 離れて読むポスターなら 20cm くらい。まわりに白い余白（4 マス分）を残すと読みやすくなります。SVG で保存すると、どれだけ大きく印刷しても線が荒れません。</p></details>
<details><summary>色の決まり</summary><p>模様は暗く、背景は明るくするのが基本です。逆にしたり、色の差が小さかったりすると、読めないアプリがあります。画面の下に注意が出たら、色を見直してください。</p></details>
<details><summary>🔒 安全について</summary><p>このページは何も送りません。Wi-Fi のパスワードも、この端末の中で QR コードになるだけです。ただし、QR コードの中にはパスワードがそのまま入るので、お客さん用など見られても良いネットワークに使ってください。知らない QR コードを読むときは、開く前に表示された URL を確かめましょう。</p></details>`;
const GUIDE_EN = `<h3>📖 GUIDE</h3>
<details open><summary>Direct vs dynamic QR codes</summary><p>Many "free QR" sites encode a redirect link to their own server. Later the code may stop working unless you pay, show ads, or track scans. Meridi QR encodes your content directly — nothing in between, so it never expires (but can't be edited after printing).</p></details>
<details><summary>Error correction</summary><p>L ~7%, M ~15%, Q ~25%, H ~30% of the code can be damaged and still scan. H lets you put a mark in the middle.</p></details>
<details><summary>Printing size</summary><p>About 1/10 of the scanning distance: 2–3 cm for a handheld flyer, ~20 cm for a poster read from 2 m. Keep a white margin. SVG stays sharp at any size.</p></details>
<details><summary>Privacy</summary><p>Nothing is uploaded. Wi-Fi passwords are stored inside the code itself, so use it for guest networks.</p></details>`;
async function pngBlob(){ const px = +$('sSize').value; const img = new Image(); const url = URL.createObjectURL(new Blob([last.svg], { type: 'image/svg+xml' }));
  await new Promise((r, j) => { img.onload = r; img.onerror = j; img.src = url; });
  const c = document.createElement('canvas'); c.width = c.height = px; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(img, 0, 0, px, px); URL.revokeObjectURL(url);
  return new Promise(r => c.toBlob(r, 'image/png')); }

$('bSvg').onclick = () => { if (last) dl(new Blob([last.svg], { type: 'image/svg+xml' }), `meridi-qr-${S.type}.svg`); };

['cFg', 'cBg', 'cRound'].forEach(id => $(id).addEventListener('input', update));
$('sEcl').onchange = () => { S.ecl = $('sEcl').value; save(); update(); };
$('tLang').onclick = () => { lang = J() ? 'en' : 'ja'; lsSet('meridiqr_lang', lang); render(); };
$('tTheme').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; lsSet('meridiplay_theme', theme); render(); };

})();
